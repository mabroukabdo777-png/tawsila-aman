<script type="module">
import { initializeApp } from "firebase/app";
import { getDatabase, ref, onValue, set, push, update, get } from "firebase/database";
const firebaseConfig = {
  apiKey: "AIzaSyCFYCnn8bUqSfL619UhNyv3G6Vvkrmp7hk",
  authDomain: "mata3m-masr.firebaseapp.com",
  databaseURL: "https://mata3m-masr-default-rtdb.firebaseio.com",
  projectId: "mata3m-masr",
  storageBucket: "mata3m-masr.firebasestorage.app",
  messagingSenderId: "315344044519",
  appId: "1:315344044519:web:2766778ebdec4cf053fd42",
  measurementId: "G-C1273J01LG"
};
const appFB = initializeApp(firebaseConfig);
const db = getDatabase(appFB);
let userPos=null, cart=[], mapObj=null, liveMap=null, deliveryMarker=null, currentUserId=localStorage.getItem('matamy_userId'), userData=JSON.parse(localStorage.getItem('matamy_userData')||'null'), restaurantsCache={}, deliveryWatchId=null, selectedRole='';

let lastRestOrders=0, lastDelOrders=0, audioUnlocked=false;
document.addEventListener('click', ()=>{ if(!audioUnlocked){ document.getElementById('orderSound').play().then(()=>{ document.getElementById('orderSound').pause(); document.getElementById('orderSound').currentTime=0; audioUnlocked=true; }).catch(()=>{}); } }, {once:true});
if(Notification && Notification.permission!=='granted') Notification.requestPermission();
function playOrderSound(){ const a=document.getElementById('orderSound'); a.currentTime=0; a.play().catch(()=>{}); if('vibrate' in navigator) navigator.vibrate([300,100,300]); }
function playDeliverySound(){ const a=document.getElementById('deliverySound'); a.currentTime=0; a.play().catch(()=>{}); if('vibrate' in navigator) navigator.vibrate([200,100,200]); }
function showRealNotif(title, desc){ document.getElementById('notifTitle').innerText=title; document.getElementById('notifDesc').innerText=desc; document.getElementById('notifBar').classList.remove('hidden'); setTimeout(()=>{ document.getElementById('notifBar').classList.add('hidden'); }, 7000); if(Notification && Notification.permission==='granted') new Notification(title, {body:desc}); }

function calcDist(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180;const dLon=(d-b)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function deliveryPrice(km){if(km<=2)return 15;if(km<=5)return Math.ceil(15+(km-2)*4);return Math.ceil(27+(km-5)*5);}
function renderHome(){
  document.getElementById('app').innerHTML=`<div class="bg-[#0F172A] text-white p-6 pb-16 rounded-b-[36px]"><div class="flex items-center gap-3"><div onclick="secretTap()" class="w-12 h-12 bg-[#16A34A] rounded-2xl flex items-center justify-center font-black text-2xl cursor-pointer">م</div><div><h1 class="font-black text-xl">مطعمي</h1><p class="text-[11px] text-white/60">مصر كلها - تتبع لايف حقيقي 100%</p></div></div><div class="mt-8"><h2 class="text-[32px] font-black leading-[0.9]">تابع الطيار<br><span class="text-[#16A34A]">لايف على الخريطة</span></h2><p class="text-[13px] text-white/60 mt-2">من أي مكان في مصر - تشوفه بيتحرك فين</p></div></div><div class="p-4 -mt-8 space-y-3 max-w-lg mx-auto"><div onclick="selectRole('client')" class="bg-white rounded-[20px] p-4 shadow border flex gap-4 cursor-pointer"><div class="w-14 h-14 bg-[#16A34A] rounded-2xl flex items-center justify-center text-white text-2xl">🛒</div><div class="flex-1"><h3 class="font-black">عميل - تتبع لايف</h3><p class="text-[11px] text-gray-500">تابع الطيار لايف بيتحرك فين - مصر كلها</p></div><div class="w-9 h-9 bg-black text-white rounded-full flex items-center justify-center">→</div></div><div onclick="selectRole('restaurant')" class="bg-white rounded-[20px] p-4 shadow border flex gap-4 cursor-pointer"><div class="w-14 h-14 bg-[#0F172A] rounded-2xl flex items-center justify-center text-white">🍔</div><div class="flex-1"><h3 class="font-black">صاحب مطعم - مصر كلها - 🔊 صوت حقيقي</h3><p class="text-[11px]">يظهر لكل مصر + صوت جرس حقيقي</p></div></div><div onclick="selectRole('delivery')" class="bg-white rounded-[20px] p-4 shadow border flex gap-4 cursor-pointer"><div class="w-14 h-14 bg-[#facc15] rounded-2xl flex items-center justify-center">🛵</div><div class="flex-1"><h3 class="font-black">طيار - موقعك لايف + 🔊</h3><p class="text-[11px]">موقعك بيتحدث لايف + صوت حقيقي</p></div></div></div>`;
}
function renderRegister(){
  document.getElementById('app').innerHTML=`<div class="bg-[#0F172A] text-white p-4 flex gap-3"><button onclick="renderHome()" class="w-10 h-10 bg-white/10 rounded-full">←</button><h2 class="font-black">تسجيل ${selectedRole} - مصر كلها</h2></div><div class="p-5 space-y-3 max-w-md mx-auto"><input id="name" placeholder="الاسم" class="w-full p-4 rounded-2xl border"><input id="phone" placeholder="01xxxxxxxxx" class="w-full p-4 rounded-2xl border"><select id="governorate" class="w-full p-4 rounded-2xl border"><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>القليوبية</option><option>الشرقية</option><option>الدقهلية</option><option>باقي مصر</option></select><input id="address" placeholder="العنوان" class="w-full p-4 rounded-2xl border"><button id="registerBtn" class="w-full bg-[#16A34A] text-white p-4 rounded-2xl font-black">سجل - مصر كلها - حقيقي</button></div>`;
  document.getElementById('registerBtn').onclick=async()=>{
    const name=document.getElementById('name').value, phone=document.getElementById('phone').value, gov=document.getElementById('governorate').value, address=document.getElementById('address').value;
    const uid='user_'+phone+'_'+Date.now();
    const userObj={uid,name,phone,role:selectedRole,governorate:gov,address,lat:userPos?.lat||26.82,lng:userPos?.lng||30.80,createdAt:Date.now()};
    await set(ref(db,`users/${uid}`), userObj);
    localStorage.setItem('matamy_userId',uid); localStorage.setItem('matamy_userData',JSON.stringify(userObj)); currentUserId=uid; userData=userObj;
    if(selectedRole==='restaurant'){ await set(ref(db,`restaurants/egypt/${uid}`),{name,phone,governorate:gov,address,lat:userObj.lat,lng:userObj.lng,isOpen:true,rating:4.8,menu:{item1:{name:'كشري',price:35}}}); renderRestaurantPage(); }
    else if(selectedRole==='delivery'){ await set(ref(db,`deliveries/egypt/${uid}`),{name,phone,governorate:gov,lat:userObj.lat,lng:userObj.lng,orders:0,profit:0}); renderDeliveryPage(); }
    else renderClient();
  };
}
function renderClient(){
  cart=[]; document.getElementById('app').innerHTML=`<div class="bg-[#0F172A] text-white p-4 flex justify-between"><h2 class="font-black">مطاعم مصر - تتبع لايف</h2><button onclick="showMyOrders()" class="bg-white/10 px-3 py-1.5 rounded-full text-xs">طلباتي + لايف</button></div><div class="p-3 space-y-3"><div id="map"></div><div id="restList"></div></div><div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-black text-white p-4 hidden"><div class="flex justify-between"><p id="cartTxt"></p><button onclick="checkout()" class="bg-[#16A34A] px-6 py-3 rounded-full">اطلب</button></div></div>`;
  setTimeout(()=>{
    mapObj=L.map('map').setView([26.82,30.80],6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapObj);
    if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{ userPos={lat:p.coords.latitude,lng:p.coords.longitude}; mapObj.setView([userPos.lat,userPos.lng],12); L.marker([userPos.lat,userPos.lng]).addTo(mapObj).bindPopup('انت هنا').openPopup(); loadRests(); },()=>{ userPos={lat:26.82,lng:30.80}; loadRests(); });
    function loadRests(){
      onValue(ref(db,'restaurants/egypt'), snap=>{
        const data=snap.val()||{}; restaurantsCache=data; let html=''; Object.entries(data).forEach(([id,r])=>{
          const dist=userPos?calcDist(userPos.lat,userPos.lng,r.lat||26.82,r.lng||30.80):3; const price=deliveryPrice(dist);
          html+=`<div class="bg-white rounded-2xl p-4 shadow border flex gap-3"><div class="w-16 h-16 bg-[#F0FDF4] rounded-2xl flex items-center justify-center">🍔</div><div class="flex-1"><h3 class="font-black">${r.name} - ${r.governorate}</h3><p class="text-xs">${dist.toFixed(2)} كم - توصيل ${price}ج حقيقي</p><button onclick="openRest('${id}')" class="mt-2 bg-black text-white text-xs px-4 py-1 rounded-full">منيو</button></div></div>`;
        }); document.getElementById('restList').innerHTML=html||'لا يوجد مطاعم - سجل مطعم';
      });
    }
  },300);
}
window.openRest=(id)=>{
  const r=restaurantsCache[id]; document.getElementById('app').innerHTML+=`<div id="menuModal" class="fixed inset-0 bg-white z-50 p-4"><div class="flex justify-between"><h2 class="font-black">${r.name}</h2><button onclick="document.getElementById('menuModal').remove()" class="w-8 h-8 bg-black text-white rounded-full">x</button></div><div id="modalMenu" class="mt-3 space-y-2"></div></div>`;
  onValue(ref(db,`restaurants/egypt/${id}/menu`), snap=>{ const data=snap.val()||{}; let html=''; Object.entries(data).forEach(([mid,m])=>{ html+=`<div class="flex justify-between bg-[#F8FAFC] p-3 rounded-xl"><span>${m.name} - ${m.price}ج</span><button onclick="addToCart('${id}','${m.name}',${m.price})" class="bg-[#16A34A] text-white px-3 rounded-full">+</button></div>`; }); document.getElementById('modalMenu').innerHTML=html; }, {onlyOnce:true});
};
window.addToCart=(restId,name,price)=>{ cart.push({restId,name,price}); document.getElementById('cartBar').classList.remove('hidden'); document.getElementById('cartTxt').innerText=cart.length+' أصناف'; if(document.getElementById('menuModal')) document.getElementById('menuModal').remove(); };
window.checkout=async()=>{
  const total=cart.reduce((s,i)=>s+i.price,0); const dPrice=deliveryPrice(3); const orderId=push(ref(db,'orders/egypt')).key; const rId=cart[0]?.restId; const r=restaurantsCache[rId]||{lat:26.82,lng:30.80,governorate:userData?.governorate||'مصر'};
  await set(ref(db,`orders/egypt/${orderId}`),{clientId:currentUserId||'guest',clientName:userData?.name||'عميل',governorate:userData?.governorate||'مصر',restId:rId,items:cart.map(c=>c.name).join(','),total:total+dPrice,deliveryPrice:dPrice,status:'pending',clientLat:userPos.lat,clientLng:userPos.lng,restLat:r.lat,restLng:r.lng,createdAt:Date.now()});
  alert('تم الطلب - تابع لايف'); cart=[]; document.getElementById('cartBar').classList.add('hidden'); showMyOrders();
};
window.showMyOrders=()=>{
  document.getElementById('app').innerHTML=`<div class="bg-black text-white p-4 flex justify-between"><h2 class="font-black">طلباتي + تتبع لايف</h2><button onclick="renderClient()" class="bg-white/10 px-3 py-1 rounded-full text-xs">رجوع</button></div><div id="myOrders" class="p-3 space-y-2"></div>`;
  onValue(ref(db,'orders/egypt'), snap=>{
    const data=snap.val()||{}; let html=''; Object.entries(data).filter(([k,v])=>v.clientId===currentUserId).forEach(([id,o])=>{
      const canTrack=o.status==='on_the_way';
      html+=`<div class="bg-white rounded-xl p-3 border ${canTrack?'border-green-500 border-2':''}"><b>${o.total}ج - ${o.status} - ${o.governorate}</b><p class="text-xs">${o.items} - ${o.deliveryPrice}ج</p>${canTrack?`<button onclick="renderLiveTracking('${id}')" class="w-full mt-2 bg-[#16A34A] text-white py-2 rounded-full text-xs">🗺️ تابع الطيار لايف 🔴</button>`:`<p class="text-[11px] text-gray-500">في انتظار الطيار</p>`}</div>`;
    }); document.getElementById('myOrders').innerHTML=html||'لسه معملتش';
  });
};
window.renderLiveTracking=(orderId)=>{
  document.getElementById('app').innerHTML=`<div class="bg-black text-white p-4 flex justify-between"><h2 class="font-black">🗺️ تتبع لايف 🔴</h2><button onclick="showMyOrders()" class="bg-white/10 px-3 py-1 rounded-full text-xs">رجوع</button></div><div class="p-3 space-y-3"><div id="liveTrackMap"></div><div class="bg-white rounded-2xl p-4 border"><p class="font-black" id="trackStatus">جاري...</p><p class="text-xs" id="liveDetails"></p></div></div>`;
  setTimeout(()=>{
    const m=L.map('liveTrackMap').setView([26.82,30.80],6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
    let dM=null,cM=null; const dIcon=L.divIcon({html:'<div style="background:#facc15;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #0F172A;">🛵</div>',iconSize:[36,36],className:''});
    const cIcon=L.divIcon({html:'<div style="background:#16A34A;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;">📍</div>',iconSize:[36,36],className:''});
    onValue(ref(db,`orders/egypt/${orderId}`), snap=>{
      const o=snap.val(); if(!o) return;
      document.getElementById('trackStatus').innerText=o.status==='on_the_way'?'🛵 الطيار في الطريق - لايف 🔴':o.status;
      if(o.clientLat){
        if(!cM) cM=L.marker([o.clientLat,o.clientLng],{icon:cIcon}).addTo(m).bindPopup('انت');
        if(o.deliveryLat){
          if(!dM) dM=L.marker([o.deliveryLat,o.deliveryLng],{icon:dIcon}).addTo(m).bindPopup('الطيار لايف').openPopup();
          else dM.setLatLng([o.deliveryLat,o.deliveryLng]);
          document.getElementById('liveDetails').innerText=`🛵 الطيار: ${o.deliveryLat.toFixed(5)}, ${o.deliveryLng.toFixed(5)} - المسافة: ${calcDist(o.deliveryLat,o.deliveryLng,o.clientLat,o.clientLng).toFixed(2)} كم - لايف حقيقي 100%`;
          m.fitBounds([[o.clientLat,o.clientLng],[o.deliveryLat,o.deliveryLng]],{padding:[40,40]});
        }
      }
    });
  },400);
};
function renderDeliveryPage(){
  document.getElementById('app').innerHTML=`<div class="bg-[#facc15] p-4 flex justify-between"><h2 class="font-black">🛵 طيار - موقعك لايف + 🔊 صوت</h2><button onclick="renderHome()" class="bg-black text-white px-3 py-1 rounded-full text-xs">خروج</button></div><div class="p-3 space-y-3"><div class="bg-black text-white rounded-2xl p-4 flex justify-between"><div><p class="font-black">📍 موقعك لايف للعميل</p><p class="text-xs" id="myLivePos">جاري...</p></div><span class="w-3 h-3 bg-red-500 rounded-full pulse"></span></div><div id="mapDelivery" style="height:240px;border-radius:16px"></div><div id="availOrders" class="space-y-2"></div><div id="myActiveOrder" class="hidden bg-[#16A34A] rounded-2xl p-4 text-white"><h3 class="font-black">طلبك النشط - لايف شغال</h3><p id="activeOrderInfo" class="text-xs"></p><button onclick="finishDelivery()" class="bg-white text-[#16A34A] px-4 py-2 rounded-full text-xs mt-2">تم التوصيل</button></div></div>`;
  setTimeout(()=>{
    const m=L.map('mapDelivery').setView([26.82,30.80],6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
    onValue(ref(db,'orders/egypt'), snap=>{ const data=snap.val()||{}; let html=''; Object.entries(data).forEach(([id,o])=>{ if(o.status!=='pending') return; const dist=o.clientLat&&o.restLat?calcDist(o.restLat,o.restLng,o.clientLat,o.clientLng):5; const price=deliveryPrice(dist); html+=`<div class="border rounded-xl p-3 flex justify-between"><div><b>${o.total}ج - ${o.governorate} - ${price}ج</b><p class="text-xs">${dist.toFixed(2)} كم</p></div><button onclick="takeOrderLive('${id}')" class="bg-black text-white text-xs px-5 py-2 rounded-full">استلام + لايف 🔴</button></div>`; }); document.getElementById('availOrders').innerHTML=html||'لا يوجد'; });
    onValue(ref(db,`deliveries/egypt/${currentUserId}`), snap=>{ const d=snap.val()||{}; if(d.activeOrder){ document.getElementById('myActiveOrder').classList.remove('hidden'); document.getElementById('activeOrderInfo').innerText=`طلب ${d.activeOrder} - موقعك لايف`; startLiveTracking(d.activeOrder); } });
  },400);
  window.takeOrderLive=async(id)=>{
    await update(ref(db,`orders/egypt/${id}`),{status:'on_the_way',deliveryId:currentUserId});
    await update(ref(db,`deliveries/egypt/${currentUserId}`),{activeOrder:id});
    const orderSnap=await get(ref(db,`orders/egypt/${id}`)); const o=orderSnap.val(); const profit=Math.ceil((o.deliveryPrice||15)*0.15);
    const snap=await get(ref(db,`deliveries/egypt/${currentUserId}`)); const d=snap.val()||{orders:0,profit:0};
    await update(ref(db,`deliveries/egypt/${currentUserId}`),{orders:(d.orders||0)+1,profit:(d.profit||0)+profit});
    alert('استلمت - موقعك لايف الآن للعميل 🔴'); startLiveTracking(id);
  };
  window.startLiveTracking=(orderId)=>{
    if(deliveryWatchId) navigator.geolocation.clearWatch(deliveryWatchId);
    deliveryWatchId=navigator.geolocation.watchPosition(async pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;
      document.getElementById('myLivePos').innerText=`🔴 لايف: ${lat.toFixed(5)}, ${lng.toFixed(5)} - ${new Date().toLocaleTimeString('ar-EG')}`;
      await update(ref(db,`orders/egypt/${orderId}`),{deliveryLat:lat,deliveryLng:lng,lastUpdate:Date.now()});
    },()=>{}, {enableHighAccuracy:true,maximumAge:2000});
  };
  window.finishDelivery=async()=>{
    const snap=await get(ref(db,`deliveries/egypt/${currentUserId}`)); const d=snap.val()||{}; const orderId=d.activeOrder; if(!orderId) return;
    await update(ref(db,`orders/egypt/${orderId}`),{status:'delivered'}); await update(ref(db,`deliveries/egypt/${currentUserId}`),{activeOrder:null});
    if(deliveryWatchId) navigator.geolocation.clearWatch(deliveryWatchId); alert('تم التوصيل ✅'); document.getElementById('myActiveOrder').classList.add('hidden');
  };
}
function renderRestaurantPage(){
  document.getElementById('app').innerHTML=`<div class="bg-black text-white p-4 flex justify-between"><h2 class="font-black">لوحة مطعمي - مصر كلها - 🔊</h2><button onclick="renderHome()" class="bg-white/10 px-3 py-1 rounded-full text-xs">خروج</button></div><div class="p-3 space-y-3"><div class="bg-[#FEFCE8] border-2 border-[#facc15] rounded-2xl p-3 flex gap-3"><div class="w-10 h-10 bg-[#facc15] rounded-full flex items-center justify-center">🔊</div><div><p class="font-black text-sm">🔔 إشعار صوتي حقيقي شغال</p><p class="text-[11px]">لما يجي أوردر هتسمع جرس حقيقي</p><button onclick="testSound()" class="mt-2 bg-black text-white text-xs px-3 py-1 rounded-full">جرب الصوت</button></div></div><div class="bg-white rounded-2xl p-4 border"><h3 class="font-black mb-2">منيو</h3><div class=
