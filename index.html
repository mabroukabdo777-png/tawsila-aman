<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#FFD700;font-family:Cairo,sans-serif}
.header{background:#000;border-bottom:1px solid #1e1e1e;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999}
.logo-box{width:52px;height:52px;border-radius:12px;background:#000;border:1.5px solid #FFD70044;overflow:hidden;position:relative;cursor:pointer}
.logo-box img{width:100%;height:100%;object-fit:contain}
#progressRing{position:absolute;inset:-6px;width:64px;height:64px;transform:rotate(-90deg);display:none}
.card{background:#0c0c0c;border:1px solid #1e1e1e;border-radius:20px;padding:14px;margin:10px}
.btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:900;font-size:15px;cursor:pointer;margin:6px 0}
.btn-gold{background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;box-shadow:0 6px 20px rgba(255,215,0,.3)}
.btn-dark{background:#1a1a1a;color:#FFD700;border:1px solid #FFD70033}
.small-imgs{display:flex;gap:10px;justify-content:center;margin:12px 0}
.small-imgs div{width:92px;height:92px;border-radius:18px;overflow:hidden;border:2.5px solid #222;background:#111;cursor:pointer;position:relative;transition:.3s}
.small-imgs div.selected{border-color:#FFD700;box-shadow:0 0 18px rgba(255,215,0,.5);transform:scale(1.06)}
.small-imgs img{width:100%;height:100%;object-fit:cover}
.small-imgs div.selected::after{content:'مختار';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);background:#FFD700;color:#000;font-size:8px;font-weight:900;padding:2px 7px;border-radius:999px}
#map-customer,#map-tracking,#owner-map{width:100%;height:380px;border-radius:18px;border:2px solid #FFD70044;background:#111;z-index:1}
.input{width:100%;padding:12px;background:#0a0a0a;border:1px solid #333;border-radius:12px;color:#FFD700;margin:5px 0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(12px)}
.badge{background:#FFD70014;border:1px solid #FFD70033;padding:4px 10px;border-radius:999px;font-size:11px}
</style>
