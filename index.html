<!doctype html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="google" content="notranslate">
<title>Tawsila Aman - توصيلة أمان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{font-family:'Cairo',sans-serif!important}
body{background:#080808}
.glass{background:rgba(20,20,20,.92);border:1px solid rgba(255,255,255,.08)}
.red-black{background:linear-gradient(135deg,#C70000,#5A0000)}
#map{height:250px!important;width:100%;border-radius:18px}
</style>
</head>
<body class="text-white notranslate" translate="no">
<div class="p-5 text-center">
<h1 class="text-[32px] font-black"><span class="text-[#C70000]">Tawsila</span> Aman</h1>
<p class="text-xs opacity-60">توصيلة أمان - أحمر × أسمر شيك</p>
<button id="installBtn" class="hidden mt-3 bg-white text-black text-xs font-black px-4 py-2 rounded-full">📲 ثبّت التطبيق</button>
</div>
<div class="p-3">
<div class="glass p-2 rounded-[20px]">
<div id="map"></div>
<p class="text-[10px] text-center opacity-40 mt-2">خريطة حقيقية 100% - 250 - تفعيل تلقائي لايف</p>
</div>
</div>
<script>
document.documentElement.setAttribute('translate','no');
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.classList.remove('hidden');});
installBtn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;installBtn.classList.add('hidden');}});

let map=L.map('map',{zoomControl:false}).setView([30.0444,31.2357],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let userMarker=null;
// تفعيل موقع المستخدم تلقائيا من غير اعدادات
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(p=>{
let ll=[p.coords.latitude,p.coords.longitude];
userMarker=L.marker(ll).addTo(map);
map.setView(ll,16);
});
navigator.geolocation.watchPosition(p=>{
let ll=[p.coords.latitude,p.coords.longitude];
if(userMarker) map.removeLayer(userMarker);
userMarker=L.marker(ll).addTo(map);
map.setView(ll,16);
},null,{enableHighAccuracy:true});
}
</script>
</body>
</html>
