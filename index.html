function haversine(lat1,lon1,lat2,lon2){const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function calcPrice(km){ return Math.min(Math.max(Math.round(10+km*5),10),300); }
function calcCommission(price){ return Math.round(price*0.15); }
function calcRealDebtFromOrders(driverId, orders, clearedAt){const filtered=orders.filter(o=>o.driverId===driverId && (o.status==='accepted'||o.status==='delivered') && (!clearedAt || o.createdAt>clearedAt)); const total=filtered.reduce((sum,o)=>sum+(o.commission||calcCommission(o.price||0)),0); return {total, count:filtered.length, orders:filtered};}
async function getRoute(lat1,lon1,lat2,lon2){try{const url='https://router.project-osrm.org/route/v1/driving/'+lon1+','+lat1+';'+lon2+','+lat2+'?overview=full&geometries=geojson'; const r=await fetch(url); const d=await r.json(); if(d.routes&&d.routes[0]) return {coords:d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]), dist:d.routes[0].distance/1000, dur:d.routes[0].duration/60};}catch(e){} return null;}
function toB64(file){return new Promise((res,rej)=>{const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file);});}
async function uploadImage(file, folder){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const maxW = 800;
        let w = img.width, h = img.height;
        if(w > maxW){ h = h * (maxW / w); w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let currentUser=JSON.parse(localStorage.getItem('sf_user')||'null');
let myLat=null,myLng=null,selectedLat=null,selectedLng=null,currentDist=0,currentPrice=10,orderImgB64=null,driverMap=null,miniMap=null,currentRouteLine=null,startM=null,endM=null;

async function hashPass(s){const enc=new TextEncoder().encode(s); const buf=await crypto.subtle.digest('SHA-256',enc); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
const OWNER_HASHES=['5cac72a0c4c1d0a1b7c7f4c7c6b8a9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6','01002548338','01065260945','1234'];
let ownerAttempt=0;
async function checkOwnerPass(input){
  try{const h=await hashPass(input); if(OWNER_HASHES.includes(h)) return true;}catch(e){}
  if(['01002548338','01065260945','1234'].includes(input)) return true;
  try{
    const snap=await new Promise(res=>{onValue(ref(db,'owners'),s=>res(s),{onlyOnce:true});});
    const owners=snap.val()||{};
    for(const k in owners){const o=owners[k]; if(o.hash){try{if(await hashPass(input)===o.hash) return true;}catch(e){} } if(o.phone===input) return true; }
  }catch(e){}
  return false;
}

function save(u){localStorage.setItem('sf_user',JSON.stringify(u)); currentUser=u;}
function renderLanding(){
  document.getElementById('app').innerHTML=`<div class="text-center py-10"><div class="w-20 h-20 bg-[#FFD600] rounded-[20px] flex items-center justify-center mx-auto text-4xl">⚡</div><h1 class="font-black text-2xl mt-6">Super Flash</h1><p class="opacity-50 text-sm mt-2">مصر كلها - توصيل حقيقي</p><div class="grid grid-cols-2 gap-3 mt-8"><button onclick="renderRegister('customer')" class="glass p-6 rounded-[20px]"><div class="text-3xl">🛒</div><div class="font-black mt-2 text-sm">اطلب الآن</div><div class="text-[11px] opacity-50 mt-1">10ج + 5/كم</div></button><button onclick="renderRegister('delivery')" class="yellow p-6 rounded-[20px]"><div class="text-3xl">🛵</div><div class="font-black mt-2 text-sm">انضم كدليفري</div><div class="text-[11px] opacity-70 mt-1">اكسب عمولات</div></button></div><p class="text-[11px] opacity-30 mt-8">دوس 5 مرات على ⚡ لدخول المالك</p></div>`;
  let clicks=0; document.getElementById('logo').onclick=()=>{clicks++; if(clicks>=5){clicks=0; document.getElementById('adminModal').classList.remove('hidden');} setTimeout(()=>clicks=0,2000);};
  document.getElementById('enterAdmin').onclick=async()=>{
    const p=document.getElementById('passIn').value.trim();
    if(await checkOwnerPass(p)){document.getElementById('adminModal').classList.add('hidden'); renderAdmin();}
    else{document.getElementById('passErr').classList.remove('hidden');}
  };
  document.getElementById('closeAdmin').onclick=()=>document.getElementById('adminModal').classList.add('hidden');
  document.getElementById('passIn').onkeydown=(e)=>{if(e.key==='Enter') document.getElementById('enterAdmin').click();};
}

function renderRegister(role){
  document.getElementById('app').innerHTML=`<div class="glass p-6 rounded-[24px]"><h2 class="font-black">${role==='customer'?'اطلب الآن - 10ج +5/كم':'انضم كدليفري'}</h2><input id="rName" placeholder="اسمك" class="w-full mt-4 bg-black/30 border border-white/10 rounded-xl p-3 text-sm outline-none"><input id="rPhone" placeholder="رقم الموبايل" class="w-full mt-3 bg-black/30 border border-white/10 rounded-xl p-3 text-sm outline-none"><input id="rPass" type="password" placeholder="الباسورد" class="w-full mt-3 bg-black/30 border border-white/10 rounded-xl p-3 text-sm outline-none"><button onclick="doRegister('${role}')" class="w-full mt-4 yellow font-black py-3 rounded-xl text-sm">تسجيل</button><button onclick="renderLanding()" class="w-full mt-2 bg-white/10 py-3 rounded-xl text-sm">رجوع</button></div>`;
}
window.doRegister=async(role)=>{
  const name=document.getElementById('rName').value.trim();
  const phone=document.getElementById('rPhone').value.trim();
  const pass=document.getElementById('rPass').value.trim();
  if(!name||!phone||!pass){alert('اكمل البيانات'); return;}
  const id='user_'+Date.now();
  const user={id,name,phone,pass,role,status:role==='customer'?'approved':'pending',debt:0,createdAt:Date.now(),avgRating:0,totalRatings:0};
  await set(ref(db,'users/'+id),user);
  save(user);
  if(role==='customer') renderCustomer(); else{alert('تم إرسال طلبك - في انتظار موافقة المالك'); renderLanding();}
};

function renderCustomer(){
  document.getElementById('app').innerHTML=`<div class="flex justify-between mb-4"><h2 class="font-black">اطلب الآن ⚡</h2><button onclick="logout()" class="bg-white/10 px-3 py-1.5 rounded-full text-xs">خروج</button></div><div class="glass p-4 rounded-[20px] mb-4"><div class="text-xs opacity-50">📍 موقعك بيتحدد تلقائي - نقطة على الخريطة للدليفري</div><div id="locText" class="text-[11px] mt-2 bg-black/30 p-2 rounded-xl">جاري تحديد موقعك...</div><div id="miniMap" class="mini mt-3 border border-white/10"></div><div class="text-[10px] opacity-40 mt-2">💡 دوس على الخريطة تغير مكانك - الدليفري هيشوف نقطتك مباشرة</div><div class="flex gap-2 mt-3"><div class="flex-1 glass p-2 rounded-xl text-center"><div class="text-[10px] opacity-50">المسافة</div><div id="distReal" class="font-black text-sm">--</div></div><div class="flex-1 glass p-2 rounded-xl text-center"><div class="text-[10px] opacity-50">السعر</div><div id="priceReal" class="font-black text-sm text-[#FFD600]">--</div></div></div><textarea id="ot" placeholder="عاوز ايه؟ مثلا: 2 كيلو طماطم من السوق" class="w-full mt-3 bg-black/30 border border-white/10 rounded-xl p-3 text-sm h-[80px] outline-none"></textarea><input type="file" id="orderImg" accept="image/*" class="w-full mt-2 text-xs"><div class="text-[10px] opacity-30 mt-1">📷 صورة (اختياري) - موقعك من الخريطة كفاية</div><button id="priceBtn" onclick="placeOrder()" class="w-full mt-3 yellow font-black py-3 rounded-xl text-sm">اطلب الآن - 10ج - موقعك تلقائي</button></div><div id="myOrders"></div>`;
  setTimeout(()=>initCustomerMap(),300);
  loadMyOrders();
  autoActivateLocation();
}
function initCustomerMap(){
  try{
    miniMap=L.map('miniMap').setView([26.8206,30.8025],5.5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(miniMap);
    miniMap.on('click',async(e)=>{
      selectedLat=e.latlng.lat; selectedLng=e.latlng.lng;
      if(window.cMarker) miniMap.removeLayer(window.cMarker);
      window.cMarker=L.marker([selectedLat,selectedLng],{draggable:true}).addTo(miniMap);
      window.cMarker.on('dragend',ev=>{selectedLat=ev.target.getLatLng().lat; selectedLng=ev.target.getLatLng().lng; updateDistPrice();});
      updateDistPrice();
    });
  }catch(err){}
}
async function updateDistPrice(){
  if(myLat&&selectedLat){
    const d=haversine(myLat,myLng,selectedLat,selectedLng);
    currentDist=d; currentPrice=calcPrice(d);
    document.getElementById('distReal').textContent=d.toFixed(1)+' كم';
    document.getElementById('priceReal').textContent=currentPrice+'ج';
    document.getElementById('priceBtn').textContent=`اطلب الآن - ${currentPrice}ج - ${d.toFixed(1)} كم`;
  } else if(selectedLat){
    currentPrice=10; currentDist=0;
    document.getElementById('distReal').textContent='0 كم';
    document.getElementById('priceReal').textContent='10ج';
    document.getElementById('priceBtn').textContent='اطلب الآن - 10ج - موقعك تلقائي';
  }
}
function autoActivateLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    myLat=pos.coords.latitude; myLng=pos.coords.longitude;
    selectedLat=myLat; selectedLng=myLng;
    document.getElementById('locText').textContent=myLat.toFixed(5)+','+myLng.toFixed(5)+' - موقعك تلقائي ✓';
    if(miniMap){
      miniMap.setView([myLat,myLng],15);
      if(window.cMarker) miniMap.removeLayer(window.cMarker);
      window.cMarker=L.marker([myLat,myLng],{draggable:true}).addTo(miniMap);
      window.cMarker.on('dragend',ev=>{selectedLat=ev.target.getLatLng().lat; selectedLng=ev.target.getLatLng().lng; updateDistPrice();});
    }
    updateDistPrice();
    if(currentUser) update(ref(db,'users/'+currentUser.id),{lastLat:myLat,lastLng:myLng,lastSeen:Date.now()});
  });
  navigator.geolocation.watchPosition(pos=>{
    myLat=pos.coords.latitude; myLng=pos.coords.longitude;
    if(currentUser) update(ref(db,'users/'+currentUser.id),{lastLat:myLat,lastLng:myLng,lastSeen:Date.now()});
  });
}
window.placeOrder=async()=>{
  const text=document.getElementById('ot').value.trim();
  if(!text){alert('اكتب عاوز ايه'); return;}
  let lat=selectedLat, lng=selectedLng;
  if(!lat){ if(myLat){lat=myLat; lng=myLng;} else{alert('حدد مكانك على الخريطة'); return;} }
  const dist=currentDist||0;
  const price=currentPrice||10;
  const comm=calcCommission(price);
  const imgFile=document.getElementById('orderImg').files[0];
  let photo=null;
  if(imgFile){ photo=await uploadImage(imgFile,'orders'); }
  const order={customerId:currentUser.id,customerName:currentUser.name,customerPhone:currentUser.phone,text,address:`موقع تلقائي - ${lat},${lng} - نقطة على الخريطة`,lat,lng,distance:dist,price,commission:comm,status:'searching',photo,createdAt:Date.now()};
  const newRef=push(ref(db,'orders'));
  await set(newRef,order);
  await push(ref(db,'notifications'),{type:'new_order',orderId:newRef.key,lat,lng,price,text:text.slice(0,50),customerName:currentUser.name,at:Date.now()});
  alert(`✅ تم إرسال الطلب - موقعك تلقائي ${lat.toFixed(4)},${lng.toFixed(4)} - الدليفري هيشوف نقطتك - ${price}ج`);
  document.getElementById('ot').value='';
  document.getElementById('orderImg').value='';
};
function loadMyOrders(){
  onValue(ref(db,'orders'),s=>{
    const all=Object.values(s.val()||{}).filter(o=>o.customerId===currentUser.id).sort((a,b)=>b.createdAt-a.createdAt);
    document.getElementById('myOrders').innerHTML='<h3 class="font-black text-sm mb-2">طلباتي</h3>'+all.map(o=>`<div class="glass p-3 rounded-xl mb-2"><div class="flex justify-between"><div class="font-bold text-sm">${o.text.slice(0,30)}</div><div class="text-xs ${o.status==='searching'?'text-yellow-400':o.status==='accepted'?'text-blue-400':'text-green-400'}">${o.status==='searching'?'⏳ بانتظار':o.status==='accepted'?'🛵 جايلك':'✅ تم'}</div></div><div class="text-[11px] opacity-50 mt-1">📍 ${o.address||''} - ${o.price}ج - ${o.distance?o.distance.toFixed(1)+' كم':''}</div>${o.driverName?`<div class="mt-2 p-2 bg-black/30 rounded-xl"><div class="text-xs">🛵 ${o.driverName} - ${o.driverPhone} ${o.driverRating?`⭐${o.driverRating}`:''}</div><div class="flex gap-2 mt-2"><a href="tel:${o.driverPhone}" class="flex-1 bg-green-500 text-black text-center py-2 rounded-xl text-xs font-black">📞 اتصل</a><button onclick="showDriverOnMap(${o.driverLat},${o.driverLng},${o.lat},${o.lng})" class="flex-1 bg-white/10 py-2 rounded-xl text-xs">🗺️ شوف مكانه</button></div></div>`:''}</div>`).join('')||'<div class="text-center opacity-30 text-xs py-4">لا يوجد طلبات</div>';
  });
}
window.showDriverOnMap=(dLat,dLng,cLat,cLng)=>{
  if(!miniMap) return;
  miniMap.setView([dLat||cLat,cLat],14);
  showRouteOnCustomerMap(dLat,dLng,cLat,cLng);
};
async function showRouteOnCustomerMap(dLat,dLng,cLat,cLng){
  const route=await getRoute(dLat,dLng,cLat,cLng);
  if(route&&miniMap){
    if(currentRouteLine) miniMap.removeLayer(currentRouteLine);
    currentRouteLine=L.polyline(route.coords,{color:'#FFD600',weight:6,opacity:0.9}).addTo(miniMap);
    miniMap.fitBounds(currentRouteLine.getBounds());
  }
}

function renderDriver(){
  if(currentUser.status==='waiting_payment'){ renderBlocked(); return; }
  document.getElementById('app').innerHTML=`<div class="flex justify-between mb-4"><h2 class="font-black">دليفري - ${currentUser.name} 🛵</h2><button onclick="logout()" class="bg-white/10 px-3 py-1.5 rounded-full text-xs">خروج</button></div><div class="grid grid-cols-3 gap-2 mb-4"><div class="glass p-3 rounded-xl text-center"><div class="font-black text-[#FFD600]" id="dDebt">0ج</div><div class="text-[10px] opacity-50">مديونية</div></div><div class="glass p-3 rounded-xl text-center"><div class="font-black" id="dOrders">0</div><div class="text-[10px] opacity-50">طلباتي</div></div><div class="glass p-3 rounded-xl text-center"><div class="font-black" id="dRating">⭐${currentUser.avgRating||0}</div><div class="text-[10px] opacity-50">تقييم</div></div></div><div id="driverMap" class="h-[350px] rounded-[20px] overflow-hidden border border-white/10 mb-4"></div><div class="glass p-3 rounded-xl mb-4 text-xs"><div>📍 موقعك: <span id="myLocText">جاري...</span></div><div class="mt-2 flex gap-2"><button onclick="showRouteOnDriverMap(myLat,myLng,selectedLat,selectedLng)" class="flex-1 bg-white/10 py-2 rounded-xl text-xs">⚡ مسار حقيقي</button><button onclick="centerDriverMap()" class="flex-1 yellow py-2 rounded-xl text-xs font-black">📍 موقعي</button></div></div><div id="nearOrders"></div>`;
  setTimeout(()=>initDriverMap(),300);
}
function initDriverMap(){
  driverMap=L.map('driverMap').setView([26.8206,30.8025],5.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(driverMap);
  driverMap.on('click',e=>{selectedLat=e.latlng.lat; selectedLng=e.latlng.lng;});
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{
      myLat=pos.coords.latitude; myLng=pos.coords.longitude;
      document.getElementById('myLocText').textContent=myLat.toFixed(4)+','+myLng.toFixed(4)+' ✓';
      if(driverMap) driverMap.setView([myLat,myLng],15);
      if(currentUser) update(ref(db,'users/'+currentUser.id),{lastLat:myLat,lastLng:myLng,lastSeen:Date.now()});
      loadNearOrders();
    });
    navigator.geolocation.getCurrentPosition(pos=>{myLat=pos.coords.latitude; myLng=pos.coords.longitude; driverMap.setView([myLat,myLng],15);});
  }
  loadNearOrders();
  loadDriverStats();
}
function loadDriverStats(){
  onValue(ref(db,'orders'),s=>{
    const all=Object.values(s.val()||{}).filter(o=>o.driverId===currentUser.id);
    document.getElementById('dOrders').textContent=all.length;
    const real=calcRealDebtFromOrders(currentUser.id, all, currentUser.debtClearedAt||0);
    document.getElementById('dDebt').textContent=real.total+'ج';
    if(real.total>=150){ save({...currentUser,debt:real.total,status:'waiting_payment'}); renderBlocked(); }
  });
}
function loadNearOrders(){
  if(!myLat) return;
  onValue(ref(db,'orders'),s=>{
    const all=Object.values(s.val()||{}).filter(o=>o.status==='searching').map(o=>{const d=haversine(myLat,myLng,o.lat,o.lng); return {...o,dist:d};}).filter(o=>o.dist<=7).sort((a,b)=>a.dist-b.dist);

window.showRouteOnDriverMap=async(cLat,cLng,dLat,dLng)=>{
  if(!cLat||!dLat){alert('حدد مكان العميل'); return;}
  const route=await getRoute(cLat,cLng,dLat,dLng);
  if(route&&driverMap){
    if(currentRouteLine) driverMap.removeLayer(currentRouteLine);
    if(startM) driverMap.removeLayer(startM);
    if(endM) driverMap.removeLayer(endM);
    currentRouteLine=L.polyline(route.coords,{color:'#FFD600',weight:6,opacity:0.9}).addTo(driverMap);
    startM=L.marker([cLat,cLng],{icon:L.divIcon({html:'🛵',className:'',iconSize:[28,28]})}).addTo(driverMap).bindPopup('موقعك');
    endM=L.marker([dLat,dLng],{icon:L.divIcon({html:'📦',className:'',iconSize:[28,28]})}).addTo(driverMap).bindPopup('العميل');
    driverMap.fitBounds(currentRouteLine.getBounds());
    alert(`📍 مسار حقيقي OSRM - ${route.dist.toFixed(1)} كم • ${route.dur.toFixed(0)} دقيقة - الخط الأصفر = طريق السيارة الحقيقي`);
  } else {
    if(driverMap){ if(currentRouteLine) driverMap.removeLayer(currentRouteLine); currentRouteLine=L.polyline([[cLat,cLng],[dLat,dLng]],{color:'#FFD600',weight:6,dashArray:'10,10'}).addTo(driverMap); driverMap.fitBounds([[cLat,cLng],[dLat,dLng]]); }
  }
};

    if(!confirm('تحذف المالك ده؟')) return;
    await set(ref(db,'owners/'+id),null);
    atab('owners');
  };
  window.atab('pending');
}
window.logout=()=>{localStorage.removeItem('sf_user'); localStorage.removeItem('sf_user_backup'); currentUser=null; renderLanding();};
try{
  render();
}catch(e){
  console.error('Render error', e);
  document.getElementById('app').innerHTML = '<div class="text-center py-20"><div class="text-4xl">⚡</div><h2 class="font-black mt-4">Super Flash</h2><p class="opacity-50 text-sm mt-2">جاري التحميل...</p><p class="text-xs opacity-30 mt-2">'+e.message+'</p><button onclick="localStorage.clear(); location.reload()" class="mt-6 bg-[#FFD600] text-black px-6 py-2 rounded-xl font-black text-sm">إعادة تشغيل</button></div>';
  setTimeout(()=>{ try{ renderLanding(); }catch(err){} }, 500);
}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js');});}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').classList.remove('hidden');});
document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBanner').classList.add('hidden');};
</script>
