function haversine(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180;const dLon=(d-b)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

window.simpleRegister=async function(){
  const name=document.getElementById('userName').value.trim();
  const phone=document.getElementById('userPhone').value.trim();
  if(!name||!phone){alert("اكتب اسمك ورقمك");return;}
  document.getElementById('authStatus').innerText='⏳ جاري التسجيل...';
  try{
    if(!currentUser){
      const cred=await signInAnonymously(auth);
      currentUser=cred.user;
    }
    let restImageUrl='';
    const imgFile=document.getElementById('restImageFile')?.files[0];
    if(currentRole==='restaurant' && imgFile){
      try{
        const ref=sRef(storage,`restaurants_images/${currentUser.uid}/${Date.now()}_${imgFile.name}`);
        await uploadBytes(ref,imgFile);
        restImageUrl=await getDownloadURL(ref);
      }catch(e){}
    }
    let autoAddr=document.getElementById('userAddress').value||'';
    if(userLat && !autoAddr){ autoAddr=await reverseGeocode(userLat,userLng); }
    let restAutoAddr='';
    if(currentRole==='restaurant' && userLat){ restAutoAddr=await reverseGeocode(userLat,userLng); }

    if(currentRole==='delivery'){
      // تسجيل دليفري جديد - في انتظار الموافقة
      const deliveryData={
        uid:currentUser.uid,
        name:name,
        phone:phone,
        address:autoAddr,
        lat:userLat,
        lng:userLng,
        role:'delivery',
        status:'pending',
        created_at:new Date().toISOString(),
        timestamp:serverTimestamp()
      };
      await addDoc(collection(db,'delivery_requests'), deliveryData);
      await addDoc(collection(db,'users'), {...deliveryData, restImage:restImageUrl});
      document.getElementById('authCard').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:60px">⏳</div><h2 style="color:#ff6b00">في انتظار القبول</h2><p style="margin-top:10px;line-height:1.8">أهلا ${name}<br>تم استلام طلبك كدليفري<br>📞 ${phone}<br>📍 ${autoAddr}<br><br>سوف يتواصل معك موظفنا خلال 5 دقائق<br>لتوثيق رقمك والتأكد من العمولة</p><div style="margin-top:15px;background:#fff3e0;padding:10px;border-radius:10px">✅ طلبك وصل للمالك حالا</div></div>`;
      // إشعار للمالك
      try{
        await addDoc(collection(db,'notifications'),{
          type:'new_delivery',
          name:name,
          phone:phone,
          address:autoAddr,
          uid:currentUser.uid,
          createdAt:serverTimestamp()
        });
      }catch(e){}
      return;
    }

    // عميل أو مطعم - دخول مباشر
    await addDoc(collection(db,'users'),{
      uid:currentUser.uid,
      name:name,
      phone:phone,
      address:autoAddr,
      restPhone:document.getElementById('restPhone').value||'',
      restImage:restImageUrl,
      restaurantAddress:restAutoAddr,
      role:currentRole,
      lat:userLat,
      lng:userLng,
      status:'approved',
      created_at:new Date().toISOString()
    });
    if(currentRole==='restaurant'){
      await setDoc(doc(db,'restaurants',currentUser.uid),{
        name:name,
        uid:currentUser.uid,
        phone:document.getElementById('restPhone').value||phone,
        restImage:restImageUrl,
        address:restAutoAddr,
        lat:userLat,
        lng:userLng
      },{merge:true});

  }
}
