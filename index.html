<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مطاعم مصر - موقع حقيقي 100%</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FF6B00">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#0A0A0A;color:#fff}
.header{position:sticky;top:0;z-index:100;background:#1A1A1A;border-bottom:2px solid #FF6B00;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.map-box{height:400px;border:2px solid #FF6B00;border-radius:20px;margin:12px;background:#111;display:block}
.card{background:#fff;color:#000;border-radius:20px;padding:16px;text-align:center;cursor:pointer;border:2px solid #fff}
.card:hover{border-color:#FF6B00}
.box{background:#fff;color:#000;border-radius:18px;padding:14px;margin-top:12px}
.input{width:100%;padding:12px;border-radius:12px;border:2px solid #FFE4CC;margin-top:8px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="gpsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99999;padding:20px;align-items:center;justify-content:center">
<div style="background:#fff;color:#000;max-width:380px;width:100%;border-radius:22px;padding:20px;text-align:center">
<div style="font-size:52px">📍</div>
<h2>فعل موقعك على الموبايل</h2>
<p style="font-size:13px;color:#555">عشان نجيبلك أقرب مطاعم ونحسب التوصيل صح<br><b>15ج ثابت + 5ج لكل كم</b></p>
<button onclick="askGPS()" style="background:#FF6B00;color:#fff;padding:14px;border-radius:12px;border:0;width:100%;font-weight:900;margin-top:10px">📍 تفعيل الموقع الآن</button>
<button onclick="document.getElementById('gpsModal').style.display='none'" style="background:#eee;padding:10px;border-radius:10px;border:0;width:100%;margin-top:8px">تخطي</button>
</div>
</div>

<div class="header">
<span id="locBtn" onclick="askGPS()" style="background:rgba(255,255,255,.12);padding:7px 12px;border-radius:20px;font-size:12px;cursor:pointer">📍 جاري تحديد موقعك...</span>
<div onclick="ownerClicks()" style="display:flex;align-items:center;gap:8px;cursor:pointer"><div style="text-align:right"><div style="font-weight:900">مطاعم مصر</div><div style="font-size:10px;color:#FFB380">سيرفر حقيقي 100%</div></div><div style="background:#FF6B00;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900">م</div></div>
</div>

<div id="landing">
<div style="text-align:center;padding:18px">
<div style="font-size:48px">🍽️</div>
<h1 style="color:#FF6B00">مطاعم <span style="color:#fff">مصر</span></h1>
<div id="stats" style="background:rgba(255,107,0,.14);border:1px solid #FF6B00;border-radius:14px;padding:10px;max-width:560px;margin:10px auto;color:#FFB380;font-size:11px"></div>
<div id="installBox" style="display:none;max-width:560px;margin:10px auto;background:#fff;color:#000;border-radius:14px;padding:10px;border:2px solid #FF6B00">
<div style="display:flex;justify-content:space-between;align-items:center"><div><b>📲 ثبّت التطبيق</b><div style="font-size:11px;color:#666">يشتغل بدون نت</div></div><button id="installBtn" style="background:#FF6B00;color:#fff;border:0;padding:8px 16px;border-radius:10px;font-weight:900">تثبيت مباشر</button></div>
</div>
</div>
<div id="mainMap" class="map-box"></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:800px;margin:14px auto;padding:0 12px">
<div class="card" onclick="openAuth('client')"><div style="font-size:32px">👤</div><b>عميل</b></div>
<div class="card" onclick="openAuth('restaurant')"><div style="font-size:32px">🍽️</div><b>مطعم</b></div>
<div class="card" onclick="openAuth('delivery')"><div style="font-size:32px">🏍️</div><b>دليفري</b></div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCFYCnn8BuQsfL619UhNyv3G6Vvkrmp7hk",
  authDomain: "mata3m-masr.firebaseapp.com",
  projectId: "mata3m-masr",
  storageBucket: "mata3m-masr.firebasestorage.app",
  messagingSenderId: "315344044519",
  appId: "1:315344044519:web:2766778ebdec4cf053fd42",
  measurementId: "G-C1273J01LG"
};
let fbApp=null,fbAuth=null,fbDb=null,isReal=false;
try{fbApp=firebase.initializeApp(firebaseConfig);fbAuth=firebase.auth();fbDb=firebase.firestore();isReal=true;}catch(e){}
let userLoc={lat:30.0444,lng:31.2357},locEnabled=false,map=null,clicks=0,last=0;
let realRestaurants=JSON.parse(localStorage.getItem('realRestaurants')||'[]');
const calc=k=>Math.round(15+k*5);
const hav=(a,b,c,d)=>{const R=6371,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};
function updateStats(){const el=document.getElementById('stats');if(el)el.innerHTML=`📍 ${userLoc.lat.toFixed(5)} ${locEnabled?'✅ GPS حقيقي':'📍'} • ${realRestaurants.length} مطعم • حسبة 15+المسافة×5`;document.getElementById('locBtn').textContent=locEnabled?`📍 ${userLoc.lat.toFixed(4)} ✅`:`📍 جاري تحديد موقعك... دوس هنا`;}
function askGPS(){
  document.getElementById('gpsModal').style.display='none';
  if(!navigator.geolocation){updateStats();initMap();return;}
  document.getElementById('locBtn').textContent='📍 بطلب الإذن... وافق فوق 👆';
  navigator.geolocation.getCurrentPosition(p=>{userLoc={lat:p.coords.latitude,lng:p.coords.longitude};locEnabled=true;localStorage.setItem('gpsOk','1');updateStats();initMap();},e=>{updateStats();initMap();},{enableHighAccuracy:true,timeout:15000});
}
function initMap(){
  const el=document.getElementById('mainMap');if(!el)return;
  if(typeof L==='undefined'){setTimeout(initMap,800);return;}
  try{if(map){try{map.remove();}catch(e){}map=null;}el.innerHTML='';map=L.map('mainMap').setView([userLoc.lat,userLoc.lng],locEnabled?15:6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);L.marker([userLoc.lat,userLoc.lng]).addTo(map).bindPopup('📍 أنت هنا').openPopup();realRestaurants.forEach(r=>{const la=r.lat||userLoc.lat+(Math.random()-0.5)*0.04,ln=r.lng||userLoc.lng+(Math.random()-0.5)*0.04;L.marker([la,ln]).addTo(map).bindPopup(`🍽️ ${r.name||r.restName}`);});setTimeout(()=>{try{map.invalidateSize();}catch(e){}},700);}catch(e){}
}
function firstLoad(){
  updateStats();initMap();setTimeout(initMap,1000);
  if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{userLoc={lat:p.coords.latitude,lng:p.coords.longitude};locEnabled=true;updateStats();initMap();},()=>{},{timeout:8000});}
  const gpsOk=localStorage.getItem('gpsOk');if(!gpsOk){setTimeout(()=>{document.getElementById('gpsModal').style.display='flex';},1200);}
  if(isReal&&fbDb){fbDb.collection('restaurants').onSnapshot(s=>{realRestaurants=s.docs.map(d=>({...d.data()}));localStorage.setItem('realRestaurants',JSON.stringify(realRestaurants));updateStats();initMap();});}
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBox').style.display='block';});
document.addEventListener('click',async e=>{if(e.target&&e.target.id==='installBtn'){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBox').style.display='none';}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=clean-v1');}
function ownerClicks(){const n=Date.now();if(n-last>2000)clicks=0;last=n;clicks++;if(clicks>=5){const p=prompt('باسورد المالك:');if(p==='246246')alert('لوحة المالك');clicks=0;}}
function openAuth(r){alert('تسجيل '+r+' - هتكمل بعدين');}
firstLoad();
</script>
</body>
  </html>
