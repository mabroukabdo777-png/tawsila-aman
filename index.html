<script>
// === Hayat Privacy: صور المراية تنزل على موبايل البنت فقط ===
window.HAYAT_PRIVACY_MODE = true;
window.saveImageToPhoneOnly = function(canvas, filterName='hayat'){
  const fileName = `hayat-${filterName}-${Date.now()}.jpg`;
  canvas.toBlob(async (blob)=>{
    if(!blob) return;
    const file = new File([blob], fileName, {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone/i.test(navigator.userAgent)){
      try{ await navigator.share({files:[file], title:'حيات', text:'BE YOUR OWN GLOW ✨'}); showHayatToast('تم الحفظ في موبايلك ✅'); return; }catch(e){}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fileName; a.style.display='none'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); showHayatToast('📲 نزلت في الاستوديو - مش متسجلة عندنا'); },300);
  },'image/jpeg',0.92);
};
function showHayatToast(m){ let t=document.getElementById('hayat-toast'); if(!t){ t=document.createElement('div'); t.id='hayat-toast'; t.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:white;padding:10px 18px;border-radius:999px;font-size:12px;font-weight:700;z-index:10001;backdrop-filter:blur(10px);border:1px solid rgba(212,175,55,0.3);'; document.body.appendChild(t);} t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3500); }

// Browser-only install bar (hidden when installed)
(function(){
  const isInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(isInstalled) return;
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; showBar(); });
  function showBar(){
    if(document.getElementById('hayat-auto-install')) return;
    const bar=document.createElement('div'); bar.id='hayat-auto-install';
    bar.innerHTML=`<div style="position:fixed;top:0;left:0;right:0;z-index:10000;background:linear-gradient(90deg,#0a3d9c,#d4af37);color:white;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-family:Tajawal,system-ui;"><div style="display:flex;align-items:center;gap:10px;"><span>✨</span><span style="font-size:12px;font-weight:800;">ثبتي حيات كتطبيق على موبايلك</span></div><div style="display:flex;gap:8px;"><button id="hayat-do-install" style="background:white;color:#0a3d9c;border:none;padding:6px 14px;border-radius:999px;font-weight:800;font-size:11px;">تثبيت</button><button id="hayat-close-install" style="background:rgba(0,0,0,0.2);color:white;border:1px solid rgba(255,255,255,0.3);width:26px;height:26px;border-radius:50%;">✕</button></div></div>`;
    document.body.prepend(bar);
    document.getElementById('hayat-do-install').onclick=async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); const r=await deferredPrompt.userChoice; if(r.outcome==='accepted') bar.remove(); deferredPrompt=null;} else { alert('دوسي ⋮ > إضافة إلى الشاشة الرئيسية'); } };
    document.getElementById('hayat-close-install').onclick=()=>bar.remove();
  }
  setTimeout(()=>{ if(!isInstalled && !document.getElementById('hayat-auto-install') && /Android|iPhone/i.test(navigator.userAgent)) showBar(); },2500);
})();
</script>
