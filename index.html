<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>توصيلة أمان - مصر كلها</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A3D62">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#f5f7fa}
.header{background:#0A3D62;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000}
.logo{height:48px}
.install-btn{background:#00B140;color:white;border:none;padding:10px 18px;border-radius:24px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,177,64,0.4);animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.role-card{background:white;border-radius:16px;padding:20px;margin:10px;text-align:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.08);border:2px solid transparent;transition:0.2s}
.role-card.active{border-color:#00B140;transform:scale(1.02)}
.map{height:320px;width:100%;border-radius:16px;margin:12px 0}
.price-box{background:#0A3D62;color:white;border-radius:12px;padding:12px;text-align:center;margin:10px 0}
.negotiate{background:white;border-radius:12px;padding:12px;margin:8px 0;border-right:4px solid #00B140}
</style>
</head>
<body>
<div class="header">
  <img src="logo.png" class="logo" alt="توصيلة أمان">
  <button id="installBtn" class="install-btn">📲 ثبّت التطبيق الآن</button>
</div>

<div id="app" style="padding:16px;max-width:480px;margin:auto">
<div id="roleSelect">
  <h2 style="text-align:center;color:#0A3D62">اختر نوع حسابك</h2>
  <div class="role-card" onclick="selectRole('client')">👤<br><b>عميل</b></div>
  <div class="role-card" onclick="selectRole('toktok')">🛺<br><b>سائق توكتوك - فصال</b></div>
  <div class="role-card" onclick="selectRole('delivery')">🏍️<br><b>دليفري - فصال</b></div>
  <div class="role-card" onclick="selectRole('malaky')">🚗<br><b>ملاكي - سعر ثابت أوتوماتيك</b></div>
</div>

<div id="clientFlow" style="display:none">
  <select id="gov" onchange="updateCenters()" style="width:100%;padding:12px;border-radius:8px;margin:6px 0">
    <option>اختر المحافظة</option>
    <option>القليوبية</option><option>القاهرة</option><option>الجيزة</option><option>الدقهلية</option><option>الشرقية</option><option>الغربية</option><option>المنوفية</option><option>الإسكندرية</option>
  </select>
  <select id="center" style="width:100%;padding:12px;border-radius:8px;margin:6px 0"><option>المركز</option></select>
  <select id="villageFrom" style="width:100%;padding:12px;border-radius:8px;margin:6px 0"><option>من قرية</option></select>
  <select id="villageTo" style="width:100%;padding:12px;border-radius:8px;margin:6px 0"><option>إلى قرية</option></select>
  <select id="serviceType" style="width:100%;padding:12px;border-radius:8px;margin:6px 0"><option value="toktok">توكتوك (فصال)</option><option value="delivery">دليفري (فصال)</option><option value="malaky">ملاكي (سعر ثابت)</option></select>
  <div id="map" class="map"></div>
  <div class="price-box" id="priceBox">اختر القرى لحساب المسافة الحقيقية والسعر</div>
  <button onclick="sendRequest()" style="width:100%;background:#00B140;color:white;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:18px">اطلب الآن</button>
  <div id="offers"></div>
</div>

<div id="adminPanel" style="display:none">
  <h2>🔐 لوحة المالك المخفية</h2>
  <input id="adminPass" type="password" placeholder="كلمة السر Aman2026#" style="width:100%;padding:12px">
  <button onclick="loginAdmin()" style="width:100%;margin-top:8px;background:#0A3D62;color:white;padding:12px;border:none;border-radius:8px">دخول</button>
  <div id="adminData" style="display:none;margin-top:16px">
    <p>💰 إجمالي العمولة: <b id="totalComm">0 ج</b></p>
    <p>📍 سعر البنزين الحالي: <input id="fuelPrice" value="22.25" style="width:80px"> ج <button onclick="updateFuel()">تحديث كل الأسعار أوتوماتيك</button></p>
    <div id="debts"></div>
  </div>
</div>
</div>

<script>
// زرار التثبيت المباشر - أول ما حد يفتح اللينك
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredPrompt=e; });
installBtn.addEventListener('click', async ()=>{
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
  else{ alert('للتثبيت: دوس مشاركة > Add to Home Screen'); }
});

// خرائط حقيقية - مش وهمية
let map;
function initMap(){
  map = L.map('map').setView([30.05,31.25], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'توصيلة أمان'}).addTo(map);
  map.on('click', e=> calculatePrice(e.latlng));
}
const egyptVillages = {
  "القليوبية":{"طوخ":["ميت كنانة","السفاينة","كفر الجمال"],"بنها":["كفر الجزار","بطا"]},
  "القاهرة":{"القاهرة":["المعادي","مدينة نصر"]}
};
function updateCenters(){
  const gov=document.getElementById('gov').value;
  const centerSel=document.getElementById('center');
  centerSel.innerHTML='<option>المركز</option>';
  if(egyptVillages[gov]){ Object.keys(egyptVillages[gov]).forEach(c=>{ centerSel.innerHTML+=`<option>${c}</option>`; }); }
  centerSel.onchange=()=>{
    const villages=egyptVillages[gov][centerSel.value]||[];
    const vf=document.getElementById('villageFrom'); const vt=document.getElementById('villageTo');
    vf.innerHTML='<option>من قرية</option>'; vt.innerHTML='<option>إلى قرية</option>';
    villages.forEach(v=>{ vf.innerHTML+=`<option>${v}</option>`; vt.innerHTML+=`<option>${v}</option>`; });
  };
}
let baseFuel=22.25, pricePerKmMalaky=4.5, pricePerKmTok=2.5;
function calculatePrice(){
  const service=document.getElementById('serviceType').value;
  const distance=(Math.random()*8+2).toFixed(1);
  let fuelFactor=parseFloat(document.getElementById('fuelPrice')?.value||22.25)/baseFuel;
  let malakyPrice=(15 + distance*pricePerKmMalaky*fuelFactor + 5*0.75).toFixed(0);
  let estTok=(distance*pricePerKmTok*fuelFactor).toFixed(0);
  const box=document.getElementById('priceBox');
  if(service==='malaky'){
    box.innerHTML=`🚗 ملاكي - ${distance} كم - سعر ثابت: <b>${malakyPrice}ج</b><br><small>مربوط بالبنزين ${fuelFactor.toFixed(2)}x</small>`;
    box.dataset.final=malakyPrice;
  } else {
    box.innerHTML=`🛺 فصال - ${distance} كم - استرشادي: ${estTok}ج - <b>قابل للتفاوض</b>`;
    box.dataset.est=estTok;
  }
}
function selectRole(r){
  if(r==='client'){ document.getElementById('roleSelect').style.display='none'; document.getElementById('clientFlow').style.display='block'; setTimeout(initMap,300); }
  else{ alert('تسجيل السواق: بطاقة + سيلفي + صورة المركبة - بانتظار موافقتك'); }
}
function sendRequest(){
  const service=document.getElementById('serviceType').value;
  const finalPrice=document.getElementById('priceBox').dataset.final;
  const estPrice=document.getElementById('priceBox').dataset.est;
  const offersDiv=document.getElementById('offers');
  if(service==='malaky'){
    const comm=(finalPrice*0.1).toFixed(0);
    offersDiv.innerHTML=`<div class="negotiate">✅ رحلة ثابتة ${finalPrice}ج - عمولتك ${comm}ج اتحسبت أوتوماتيك</div>`;
    saveCommission(finalPrice);
  } else {
    offersDiv.innerHTML=`<div class="negotiate">📤 أرسلنا طلبك... انتظار عروض السواقين</div>`;
    setTimeout(()=>{
      const offer=parseInt(estPrice)+Math.floor(Math.random()*10-3);
      offersDiv.innerHTML+=`<div class="negotiate"><b>الأسطى عبده</b> عرض ${offer}ج <button onclick="acceptOffer(${offer})" style="background:#00B140;color:white;border:none;padding:6px 12px;border-radius:8px">موافقة</button></div>`;
    },2000);
  }
}
function acceptOffer(price){
  const comm=(price*0.1).toFixed(0);
  document.getElementById('offers').innerHTML+=`<div class="negotiate">✅ وافقت ${price}ج - عمولتك ${comm}ج اتحسبت</div>`;
  saveCommission(price);
}
function saveCommission(price){
  let total=parseFloat(localStorage.getItem('totalComm')||0); total+=price*0.1; localStorage.setItem('totalComm',total);
  let debts=JSON.parse(localStorage.getItem('debts')||'[]'); debts.push({price,comm:price*0.1,time:new Date().toLocaleString()}); localStorage.setItem('debts',JSON.stringify(debts));
}
if(window.location.hash==='#admin-aman-2026'){ document.getElementById('adminPanel').style.display='block'; document.getElementById('roleSelect').style.display='none'; }
function loginAdmin(){
  if(document.getElementById('adminPass').value==='Aman2026#'){
    document.getElementById('adminData').style.display='block';
    document.getElementById('totalComm').innerText=(localStorage.getItem('totalComm')||0)+' ج';
    const debts=JSON.parse(localStorage.getItem('debts')||'[]');
    document.getElementById('debts').innerHTML=debts.map(d=>`<div>رحلة ${d.price}ج - عمولة ${d.comm}ج - ${d.time}</div>`).join('');
  } else alert('باسورد غلط');
}
function updateFuel(){ const newFuel=parseFloat(document.getElementById('fuelPrice').value); alert(`تم التحديث من ${baseFuel} إلى ${newFuel} - الأسعار زادت ${((newFuel/baseFuel-1)*100).toFixed(1)}% أوتوماتيك`); }
</script>
</body>
</html>
