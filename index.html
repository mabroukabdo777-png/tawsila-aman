function haversine(lat1,lon1,lat2,lon2){const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

async function uploadImage(file){return new Promise((res)=>{const rd=new FileReader(); rd.onload=(e)=>{const img=new Image(); img.onload=()=>{const cv=document.createElement('canvas'); let w=img.width,h=img.height; if(w>900){h=h*(900/w); w=900;} cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.65));}; img.src=e.target.result;}; rd.readAsDataURL(file);});}

function renderDriver(){

  onValue(ref(db,'orders'), s=>{
    const vals=s.val()||{}; const all=Object.values(vals).filter(o=>o.driverId===currentUser.id);

      save({...currentUser,debt:real.total,status:'blocked'});
      return renderBlockedPayment(real.total);
    }
    const activeEntry=Object.entries(vals).find(([k,v])=>v.driverId===currentUser.id && (v.status==='accepted'||v.status==='on_the_way'));
    if(activeEntry){ renderDriverActive(activeEntry[0],activeEntry[1]); } else { renderDriverFree(); }
  });
  // كمان يسمع حالة حسابه نفسه لو اتحظر أو اتوافق
  if(currentUser?.id){
    onValue(ref(db,'users/'+currentUser.id), us=>{
      const u=us.val(); if(!u) return;
      if(u.status!==currentUser.status){
        save({...currentUser, ...u});
        render();
      }
    });
  }
}

function initDriverMap(){
  try{
    driverMap=L.map('driverMap').setView([30.4698,31.1969],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(driverMap);
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>{myLat=pos.coords.latitude; myLng=pos.coords.longitude; driverMap.setView([myLat,myLng],14); loadNearOrders();}, ()=>loadNearOrders());
      if(watchId) navigator.geolocation.clearWatch(watchId);
      let lastNearUpdate=0; watchId=navigator.geolocation.watchPosition(pos=>{myLat=pos.coords.latitude; myLng=pos.coords.longitude; const now=Date.now(); if(now-lastNearUpdate>10000){lastNearUpdate=now; loadNearOrders();}}, null, {enableHighAccuracy:false, maximumAge:10000});
    } else loadNearOrders();
    loadDriverStats();
  }catch(e){}

function startDriverLocationWatch(orderKey){
  if(!navigator.geolocation) return;
  if(watchId) navigator.geolocation.clearWatch(watchId);
  let lastDriverUpdate=0;
  watchId=navigator.geolocation.watchPosition(async pos=>{
    myLat=pos.coords.latitude; myLng=pos.coords.longitude;
    const now=Date.now();
    if(now-lastDriverUpdate<10000) return; // 🔋 توفير باقة - كل 10 ثواني بس
    lastDriverUpdate=now;
    try{ await update(ref(db,'orders/'+orderKey),{driverLat:myLat,driverLng:myLng,lastUpdate:Date.now()}); }catch(e){}
  }, null, {enableHighAccuracy:true, maximumAge:10000, timeout:15000});
}

window.acceptOrder=async(id)=>{
  const btn=event?.target; if(btn){btn.disabled=true; btn.textContent='جاري القبول...';}
  try{
    const oSnapCheck=await new Promise(r=>{onValue(ref(db,'orders'),s=>r(s),{onlyOnce:true});});
    const allCheck=Object.values(oSnapCheck.val()||{});
    const hasActive=allCheck.find(o=>o.driverId===currentUser.id && (o.status==='accepted'||o.status==='on_the_way'));
    if(hasActive){ alert('⛔ عندك طلب شغال حاليا - خلصه الأول'); if(btn){btn.disabled=false; btn.textContent='قبول ويشوف تفاصيل العميل';} return; }
    const uSnap=await new Promise(r=>{onValue(ref(db,'users/'+currentUser.id),s=>r(s),{onlyOnce:true});});
    const u=uSnap.val()||currentUser;
    const real=calcRealDebtFromOrders(currentUser.id, allCheck, u.debtClearedAt||0);
    if(real.total>=150){ save({...currentUser,debt:real.total,status:'blocked'}); return renderBlockedPayment(real.total); }
    // 🔒 Transaction - دليفري واحد بس هياخد الأوردر
    const result=await runTransaction(ref(db,'orders/'+id), (cur)=>{
      if(cur===null) return cur;
      if(cur.status!=='searching') return; // abort
      const dist=haversine(myLat||cur.lat,myLng||cur.lng,cur.lat,cur.lng);
      const realPrice=calcPrice(dist);
      const comm=calcCommission(realPrice);
      cur.status='accepted';
      cur.driverId=currentUser.id;
      cur.driverName=currentUser.name;
      cur.driverPhone=currentUser.phone;
      cur.driverLat=myLat;
      cur.driverLng=myLng;
      cur.price=realPrice;
      cur.distance=dist;
      cur.commission=comm;
      cur.acceptedAt=Date.now();
      return cur;
    });
    if(!result.committed){ alert('❌ الأوردر اتاخد من دليفري تاني في نفس الثانية'); loadNearOrders(); if(btn){btn.disabled=false; btn.textContent='قبول ويشوف تفاصيل العميل';} return; }
    save({...currentUser,debt:real.total});
    renderDriver();
    setTimeout(async()=>{
      const check=await new Promise(r=>{onValue(ref(db,'orders/'+id),s=>r(s),{onlyOnce:true});});
      const c=check.val();
      if(c && c.status==='accepted' && c.driverId===currentUser.id){
        await update(ref(db,'orders/'+id),{status:'searching',driverId:null,driverName:null,driverPhone:null,autoReturnedAt:Date.now()});
      }
    }, 7*60*1000);

window.completeDelivery=async(id)=>{

  try{
    const snap=await new Promise(r=>{onValue(ref(db,'orders/'+id),s=>r(s),{onlyOnce:true});});
    const ord=snap.val();
    if(!ord) return;
    await update(ref(db,'orders/'+id),{status:'delivered',deliveredAt:Date.now(),customerConfirmed:false});
    // add commission now only
    const uSnap=await new Promise(r=>{onValue(ref(db,'users/'+currentUser.id),s=>r(s),{onlyOnce:true});});
    const u=uSnap.val()||currentUser;
    const oSnap=await new Promise(r=>{onValue(ref(db,'orders'),s=>r(s),{onlyOnce:true});});
    const all=Object.values(oSnap.val()||{});
    const real=calcRealDebtFromOrders(currentUser.id, all, u.debtClearedAt||0);
    await update(ref(db,'users/'+currentUser.id),{debt:real.total,status:real.total>=150?'blocked':'approved'});

    if(real.total>=150){ alert('✅ تم التسليم - '+ord.price+'ج - عدادك وصل '+real.total+'ج - تم إيقافك حتى السداد 01002548338'); renderBlockedPayment(real.total); }
    else { alert('✅ تم التسليم - '+ord.price+'ج - عمولة '+ord.commission+'ج'); renderDriver(); }
  }catch(e){ alert(e.message); }
};
