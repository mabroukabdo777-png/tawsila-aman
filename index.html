<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, onSnapshot, getDocs, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFYCnn8bUqSfL619UhNyv3G6Vvkrmp7hk",
  authDomain: "mata3m-masr.firebaseapp.com",
  projectId: "mata3m-masr",
  storageBucket: "mata3m-masr.firebasestorage.app",
  messagingSenderId: "315344044519",
  appId: "1:315344044519:web:2766778ebdec4cf053fd42",
  measurementId: "G-C1273J01LG"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

document.documentElement.setAttribute('translate','no');
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').style.display='block'; });
window.installApp=async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBtn').style.display='none'; } else alert('دوس ⋮ ثم إضافة إلى الشاشة الرئيسية'); };

let map,myMarker,otherMarker, watchId=null, currentRole='customer', chosenVehicle='tuk', pathLine=null, pathCoords=[], locationAlreadyRequested=false;
let currentUser = JSON.parse(localStorage.getItem('tawsila_user_final')||'null') || {id:'user_'+Math.random().toString(36).slice(2,7), role:'customer', name:'', phone:'', address:'', plate:'', vehicleType:'customer'};
localStorage.setItem('tawsila_user_final', JSON.stringify(currentUser));

function calcKm(lat1,lon1,lat2,lon2){
 let R=6371, dLa=(lat2-lat1)*Math.PI/180, dLo=(lon2-lon1)*Math.PI/180;
 let a=Math.sin(dLa/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function generateTripCode(){ return 'AMN-'+Math.floor(100000+Math.random()*900000); }

// الإذن الحقيقي اللي يظهر للعميل زي أي تطبيق - تفعيل الموقع ويدوس موافق على طول بإذن الإعدادات تلقائيا
// مفيش واجهة وهمية - بنطلب الموقع مباشر من المتصفح - المتصفح نفسه بيطلع الإذن الحقيقي سماح/حظر
function requestNativeLocation(){
 if(locationAlreadyRequested) return;
 locationAlreadyRequested=true;
 document.getElementById('nativeHint').style.display='none';
 if(!navigator.geolocation){ alert('متصفحك لا يدعم الموقع'); return; }
 navigator.geolocation.getCurrentPosition(
   pos=>{
     document.getElementById('nativeHint').style.display='none';
     startRealTracking(pos);
   },
   err=>{
     if(err.code===1){
       document.getElementById('nativeHint').innerHTML='❌ رفضت الإذن - افتح إعدادات المتصفح: ⋮ > الإعدادات > الخصوصية > الموقع > السماح لـ mabr.github.io';
       document.getElementById('nativeHint').style.display='block';
     }
   },
   {enableHighAccuracy:true, timeout:15000, maximumAge:0}
 );
}

// أول لمسة للشاشة = نطلب الإذن الحقيقي من المتصفح نفسه - زي أي تطبيق - السماح تلقائيا من الإعدادات
document.addEventListener('click', function firstClick(){
 if(!locationAlreadyRequested){
   requestNativeLocation();
 }
}, {once:true});

document.addEventListener('touchstart', function firstTouch(){
 if(!locationAlreadyRequested){
   document.getElementById('nativeHint').style.display='block';
   setTimeout(()=>{ requestNativeLocation(); }, 300);
 }
}, {once:true});

// لو كان وافق قبل كده شغل الموقع تلقائيا بدون ما تطلب
if(localStorage.getItem('locationAsked')==='1'){
 setTimeout(()=>{ if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(pos=>startRealTracking(pos), ()=>{}, {enableHighAccuracy:true, timeout:10000, maximumAge:60000}); } }, 1000);
} else {
 setTimeout(()=>{ document.getElementById('nativeHint').style.display='block'; }, 1500);
}

function startRealTracking(initialPos){
 document.getElementById('real-map').style.display='block'; document.getElementById('priceBox').style.display='block';
 if(!window.L) return;
 let orderId=localStorage.getItem('currentOrder');
 if(!map){
   map=L.map('real-map').setView([initialPos.coords.latitude, initialPos.coords.longitude],17);
   L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
   myMarker=L.marker([initialPos.coords.latitude, initialPos.coords.longitude]).addTo(map).bindPopup('📍 انت هنا - موقعك الحقيقي 100%').openPopup();
   otherMarker=L.marker([initialPos.coords.latitude+0.001, initialPos.coords.longitude+0.001]).addTo(map);
   pathCoords=[[initialPos.coords.latitude, initialPos.coords.longitude]];
   pathLine=L.polyline(pathCoords, {color:'#d00000', weight:5}).addTo(map);
   setTimeout(()=>{ map.invalidateSize(); }, 300);
 } else {
   myMarker.setLatLng([initialPos.coords.latitude, initialPos.coords.longitude]);
   map.setView([initialPos.coords.latitude, initialPos.coords.longitude],17);
 }
 localStorage.setItem('locationAsked','1');
 setDoc(doc(db,'liveLocations', currentUser.id), {id:currentUser.id, role:currentRole, vehicleType:currentRole, orderId:orderId||'', lat:initialPos.coords.latitude, lng:initialPos.coords.longitude, accuracy:initialPos.coords.accuracy, updatedAt:serverTimestamp()}, {merge:true});
 if(watchId) navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(p=>{ myMarker.setLatLng([p.coords.latitude, p.coords.longitude]); pathCoords.push([p.coords.latitude, p.coords.longitude]); pathLine.setLatLngs(pathCoords); map.panTo([p.coords.latitude, p.coords.longitude]); setDoc(doc(db,'liveLocations', currentUser.id), {id:currentUser.id, role:currentRole, vehicleType:currentRole, orderId:orderId||'', lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy, updatedAt:serverTimestamp()}, {merge:true}); document.getElementById('priceBox').innerHTML=`📍 موقعك الحقيقي: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} - دقة ${p.coords.accuracy.toFixed(0)}م - تتبع حقيقي 100%`; }, e=>{}, {enableHighAccuracy:true, maximumAge:0, timeout:10000});
 onSnapshot(collection(db,'liveLocations'), snap=>{
   snap.forEach(d=>{
     let o=d.data(); if(o.orderId===orderId && o.id!==currentUser.id){
       otherMarker.setLatLng([o.lat,o.lng]).bindPopup(o.role==='customer'?'العميل لايف':'السائق بتاعك لايف - شايفه فين ورايح فين بجد');
       let km=calcKm(initialPos.coords.latitude, initialPos.coords.longitude, o.lat, o.lng); let price=(currentRole==='car'||o.vehicleType==='car'||chosenVehicle==='car')?(25+km*7):(15+km*5);
       document.getElementById('priceBox').innerHTML+=`<br>📏 ${km.toFixed(1)}كم - 💵 ${price.toFixed(0)}ج بره - عمولة 10%: ${(price*0.1).toFixed(0)}ج`;
       window.currentKm=km; window.currentPrice=price;
     }
   });
 });
}

window.setRole=(role)=>{
 currentRole=role; chosenVehicle=role==='customer'?'tuk':role;
 document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
 document.getElementById('btn-'+(role==='customer'?'customer':role)).classList.add('active');
 render();
};
window.chooseVehicle=(v)=>{ chosenVehicle=v; document.querySelectorAll('.vehicle-card').forEach(c=>c.classList.remove('active')); document.getElementById('card-'+v).classList.add('active'); setRole('customer'); loadDriversForCustomer(); if(localStorage.getItem('locationAsked')){ navigator.geolocation.getCurrentPosition(p=>startRealTracking(p), ()=>{}, {enableHighAccuracy:true}); } };

function render(){
 document.getElementById('customerArea').innerHTML=''; document.getElementById('driverArea').innerHTML='';
 if(currentRole==='customer') renderCustomer(); else renderDriver(currentRole);
}
function renderCustomer(){
 document.getElementById('customerArea').innerHTML=`
 <div class="card card-red">
 <h3 style="margin:0;color:#ff2222">🧑 تسجيل دخول عميل - الإذن الحقيقي</h3>
 <input id="cName" placeholder="اسمك الكامل" value="${currentUser.name||''}">
 <input id="cPhone" placeholder="رقمك" value="${currentUser.phone||''}">
 <input id="cAddr" placeholder="عنوانك - طوخ" value="${currentUser.address||''}">
 <button class="btn btn-red" onclick="login('customer')">🔐 تسجيل دخول - حقيقي</button>
 <button class="btn btn-black" onclick="requestNativeLocation()" style="margin-top:8px">📍 فعل الموقع الحقيقي - الإذن الحقيقي سماح/حظر</button>
 <div id="driverList"></div>
 <div id="myTripCode" style="margin-top:10px"></div>
 </div>`;
 loadDriversForCustomer(); loadMyTripCode();
}
function renderDriver(type){
 document.getElementById('driverArea').innerHTML=`
