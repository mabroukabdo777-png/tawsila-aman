<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ff6b00">
<title>مطعمي - soqshpin - شركة كاملة</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.notranslate{translate:no}
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,Tahoma}
body{background:#f5f5f5}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:1000}
.logo{width:44px;height:44px;background:linear-gradient(135deg,#ff6b00,#ff9a00);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px}
#map{height:42vh;width:100%;display:none}
.card{background:#fff;margin:10px;border-radius:16px;padding:14px;box-shadow:0 4px 14px #0001}
input,select,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font-size:14px;outline:none}
button{background:#ff6b00;color:#fff;border:none;font-weight:800;cursor:pointer}
button.black{background:#111}
.badge{font-size:11px;background:#fff3e0;color:#ff6b00;padding:5px 10px;border-radius:20px;font-weight:700}
.tabs{display:flex;gap:6px;margin:8px 10px}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:#fff;border:1px solid #eee;font-weight:800;font-size:12px;cursor:pointer}
.tab.active{background:#111;color:#fff}
.live-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chatBox{height:160px;overflow:auto;background:#fafafa;border-radius:10px;padding:8px;border:1px solid #eee}
.msg{padding:6px 10px;border-radius:10px;margin:4px 0;max-width:80%;font-size:13px}
.msg.me{background:#ff6b00;color:#fff;margin-left:auto}
.msg.other{background:#eee}
.receipt{background:#111;color:#fff;padding:12px;border-radius:12px;font-family:monospace;font-size:12px;line-height:1.7}
#installBar{background:#111;color:#fff;padding:6px 10px;display:none;justify-content:space-between;align-items:center;margin:8px 10px;border-radius:20px;font-size:12px}
.authBox{background:#fffbe6;border:1px dashed #ff9a00;padding:12px;border-radius:12px;margin:8px 0}
</style>
</head>
<body class="notranslate">
<header>
<div class="logo">م</div>
<div style="text-align:center"><div style="font-weight:900">مطعمي - soqshpin</div><div id="gpsBadge" class="badge">🔥 مربوط بـ soqshpin حقيقي</div></div>
<div><button id="installBtn" style="width:auto;padding:5px 8px;font-size:10px;border-radius:20px;background:#111;display:none">ثبت 📲</button></div>
</header>
<div id="installBar"><span>📲 ثبت مطعمي</span><button id="installBarBtn" style="width:auto;padding:6px 10px;background:#ff6b00">تثبيت</button></div>

<div class="card" id="authCard">
<h3>🔐 تسجيل دخول حقيقي - مطعمي</h3>
<p style="font-size:11px;color:#666">الموقع بيتفعل تلقائيا لأي مستخدم حتى العميل</p>
<div class="tabs">
<div class="tab active" onclick="setRole('client')">عميل 🧑</div>
<div class="tab" onclick="setRole('restaurant')">مطعم 🍔</div>
<div class="tab" onclick="setRole('delivery')">دليفري 🛵</div>
</div>
<div id="roleLabel" style="font-weight:800;margin:6px 0">تسجيل عميل</div>
<input id="userName" placeholder="اسمك">
<input id="userPhone" placeholder="رقم الموبايل 01xxxxxxxxx">
<div id="recaptcha-container"></div>
<button id="sendOtpBtn" onclick="sendOTP()">إرسال كود OTP حقيقي</button>
<div id="otpBox" style="display:none">
<input id="otpCode" placeholder="اكتب كود الـ OTP">
<button class="black" onclick="verifyOTP()">تأكيد ودخول</button>
</div>
<p id="authStatus" style="font-size:12px;color:#666;margin-top:6px"></p>
</div>

<div id="map"></div>

<div class="card" id="clientCard" style="display:none">
<h3>🧑 أهلا <span id="clientNameShow"></span> <span class="live-dot"></span></h3>
<select id="restName"><option>برجر كينج - القاهرة</option><option>كنتاكي - الجيزة</option><option>ماكدونالدز - اسكندرية</option><option>حضرموت - المنصورة</option></select>
<input id="mealName" placeholder="الوجبة">
<input id="mealPrice" type="number" placeholder="سعر الوجبة">
<textarea id="notes" placeholder="ملاحظات" rows="2"></textarea>
<input id="cAddress" placeholder="العنوان">
<div id="priceBox" style="background:#fff7ed;padding:12px;border-radius:12px;display:none;font-weight:800"></div>
<div id="receiptBox" style="display:none;margin:8px 0"></div>
<button onclick="calc()">احسب المسافة والسعر 13+5/كم</button>
<button class="black" onclick="sendOrder()">إرسال الطلب لـ soqshpin حقيقي</button>
<div id="chatClient" class="chatBox" style="margin-top:10px"></div>
<input id="chatInputClient" placeholder="رسالة..."><button onclick="sendChat('client')">إرسال</button>
<button style="background:#eee;color:#111;margin-top:10px" onclick="logout()">خروج</button>
</div>

<div class="card" id="deliveryCard" style="display:none">
<h3>🛵 أهلا <span id="deliveryNameShow"></span></h3>
<div id="liveOrders">في انتظار طلبات...</div>
<button style="background:#22c55e" onclick="startTracking()">📡 ابدأ تتبع مباشر</button>
<p id="trackStatus" style="font-size:11px"></p>
<div id="chatDelivery" class="chatBox"></div>
<input id="chatInputDelivery" placeholder="رسالة..."><button onclick="sendChat('delivery')">إرسال</button>
<button style="background:#eee;color:#111;margin-top:10px" onclick="logout()">خروج</button>
</div>

<div class="card" id="ownerCard" style="display:none">
<h3>🍔 أهلا <span id="ownerNameShow"></span> - لوحة المطعم</h3>
<div id="ownerOrders"></div>
<button style="background:#eee;color:#111;margin-top:10px" onclick="logout()">خروج</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB0eHMekVj3hxInK2n1HfBEjEshGp2njpg",
  authDomain: "soqshpin.firebaseapp.com",
  databaseURL: "https://soqshpin-default-rtdb.firebaseio.com",
  projectId: "soqshpin",
  storageBucket: "soqshpin.firebasestorage.app",
  messagingSenderId: "282224755647",
  appId: "1:282224755647:web:deb4a22bcb7274c8b1570a"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentRole='client';let confirmationResult=null;let currentUser=null;let userLat=null,userLng=null,map,userMarker,polyline;let restLat=30.0444,restLng=31.2357;let lastDist=0,lastFee=0;
function initMap(){map=L.map('map',{zoomControl:false}).setView([30.0444,31.2357],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);L.marker([restLat,restLng]).addTo(map).bindPopup("المطعم");autoGPS();}
function autoGPS(){if(!navigator.geolocation) return;navigator.geolocation.getCurrentPosition(p=>{userLat=p.coords.latitude;userLng=p.coords.longitude;onLoc(p.coords);},{},{enableHighAccuracy:true});}
function onLoc(c){if(!map) return;document.getElementById('gpsBadge').innerText=`📍 ${c.latitude.toFixed(4)} - مطعمي جاهز`;if(userMarker) map.removeLayer(userMarker);userMarker=L.marker([c.latitude,c.longitude],{icon:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/149/149060.png',iconSize:[32,32]})}).addTo(map).bindPopup("انت هنا").openPopup();if(polyline) map.removeLayer(polyline);polyline=L.polyline([[restLat,restLng],[c.latitude,c.longitude]],{color:'#ff6b00',dashArray:'6,6'}).addTo(map);map.fitBounds(polyline.getBounds(),{padding:[30,30]});calc();}
function haversine(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180;const dLon=(d-b)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
window.setRole=function(role){currentRole=role;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');document.getElementById('roleLabel').innerText='تسجيل '+ (role==='client'?'عميل':role==='restaurant'?'مطعم':'دليفري');if(role==='restaurant'||role==='delivery'||role==='client'){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{userLat=p.coords.latitude;userLng=p.coords.longitude;document.getElementById('gpsBadge').innerText=`📍 موقعك اتفعل تلقائيا ${p.coords.latitude.toFixed(4)}`;},{},{enableHighAccuracy:true});}}
window.calc=function(){if(!userLat){autoGPS();alert("فعل GPS");return;}const d=haversine(restLat,restLng,userLat,userLng);lastDist=d;lastFee=13+(5*d);const mealP=parseFloat(document.getElementById('mealPrice').value)||0;const total=mealP+lastFee;document.getElementById('priceBox').style.display='block';document.getElementById('priceBox').innerHTML=`المسافة: ${d.toFixed(2)} كم - توصيل: ${lastFee.toFixed(2)}ج (13 فتح +5/كم) - الإجمالي: ${total.toFixed(2)}ج`;document.getElementById('receiptBox').style.display='block';document.getElementById('receiptBox').innerHTML=`<div class="receipt">🧾 مطعمي<br>${document.getElementById('restName').value}<br>${document.getElementById('mealName').value}<br>المسافة ${d.toFixed(2)}كم - ${total.toFixed(2)}ج</div>`;}
window.sendOTP=async function(){const phone=document.getElementById('userPhone').value.trim();const name=document.getElementById('userName').value.trim();if(!phone||!name){alert("اكتب اسمك ورقمك");return;}let formatted=phone;if(phone.startsWith('01')) formatted='+2'+phone;if(!formatted.startsWith('+')) formatted='+2'+formatted;try{document.getElementById('authStatus').innerText='جاري إرسال OTP...';window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {size:'normal'});confirmationResult = await signInWithPhoneNumber(auth, formatted, window.recaptchaVerifier);document.getElementById('otpBox').style.display='block';document.getElementById('authStatus').innerText='✅ كود اتبعت';}catch(e){document.getElementById('authStatus').innerText='خطأ: '+e.message;}}
window.verifyOTP=async function(){const code=document.getElementById('otpCode').value.trim();if(!code||!confirmationResult){alert("اكتب الكود");return;}try{const result=await confirmationResult.confirm(code);currentUser=result.user;await addDoc(collection(db,"users"), {uid:currentUser.uid, name:document.getElementById('userName').value, phone:document.getElementById('userPhone').value, role:currentRole, lat:userLat, lng:userLng, created_at:new Date().toISOString()});afterLogin();}catch(e){document.getElementById('authStatus').innerText='كود غلط: '+e.message;}}
function afterLogin(){document.getElementById('authCard').style.display='none';document.getElementById('map').style.display='block';if(!map) initMap(); else setTimeout(()=>map.invalidateSize(),300);const name=document.getElementById('userName').value;if(currentRole==='client'){document.getElementById('clientCard').style.display='block';document.getElementById('clientNameShow').innerText=name;}if(currentRole==='delivery'){document.getElementById('deliveryCard').style.display='block';document.getElementById('deliveryNameShow').innerText=name;}if(currentRole==='restaurant'){document.getElementById('ownerCard').style.display='block';document.getElementById('ownerNameShow').innerText=name;}}
window.logout=async function(){await signOut(auth);location.reload();}
window.sendOrder=async function(){const o={client_name:document.getElementById('userName').value,client_phone:document.getElementById('userPhone').value,client_uid: currentUser?.uid||'guest',restaurant_name:document.getElementById('restName').value,meal_name:document.getElementById('mealName').value,meal_price:parseFloat(document.getElementById('mealPrice').value)||0,notes:document.getElementById('notes').value,client_address:document.getElementById('cAddress').value,client_lat:userLat,client_lng:userLng,distance:lastDist,delivery_fee:lastFee,total_price:(parseFloat(document.getElementById('mealPrice').value)||0)+lastFee,created_at:new Date().toISOString(),timestamp: serverTimestamp()};if(!o.meal_name){alert("اكتب الوجبة");return;}await addDoc(collection(db,"orders"), o);alert("✅ الطلب اتبعت حقيقي"); }
function addOrderLive(o){const html=`<div style="border:1px solid #eee;padding:12px;border-radius:12px;margin:8px 0;background:#f0fdf4"><span class="live-dot"></span> <b>${o.restaurant_name}</b> - ${o.meal_name} (${o.meal_price}ج)<br>👤 ${o.client_name} - 📞 ${o.client_phone}<br>📍 ${o.client_address}<br>📏 ${o.distance?.toFixed(2)}كم - ${o.delivery_fee?.toFixed(2)}ج - إجمالي ${o.total_price?.toFixed(2)}ج</div>`;document.getElementById('liveOrders').innerHTML=html+document.getElementById('liveOrders').innerHTML;document.getElementById('ownerOrders').innerHTML=html+document.getElementById('ownerOrders').innerHTML;}
const q1=query(collection(db,"orders"), orderBy("timestamp","desc"));onSnapshot(q1,(snap)=>{snap.docChanges().forEach(ch=>{if(ch.type==='added'){addOrderLive(ch.doc.data());}});});
const q2=query(collection(db,"messages"), orderBy("timestamp","asc"));onSnapshot(q2,(snap)=>{snap.docChanges().forEach(ch=>{if(ch.type==='added'){addChatMsg(ch.doc.data());}});});
window.sendChat=async function(from){const id=from==='client'?'chatInputClient':'chatInputDelivery';const text=document.getElementById(id).value.trim();if(!text) return;await addDoc(collection(db,"messages"), {from_role:from,text:text,timestamp:serverTimestamp()});document.getElementById(id).value='';}
function addChatMsg(m){const html=`<div class="msg ${m.from_role==='client'?'me':'other'}">${m.from_role}: ${m.text}</div>`;document.getElementById('chatClient').innerHTML+=html;document.getElementById('chatDelivery').innerHTML+=html;}
window.startTracking=async function(){if(!navigator.geolocation) return;document.getElementById('trackStatus').innerText="🟢 تتبع شغال";navigator.geolocation.watchPosition(async p=>{const {latitude,longitude}=p.coords;if(userMarker) userMarker.setLatLng([latitude,longitude]);await addDoc(collection(db,"courier_locations"), {lat:latitude,lng:longitude,timestamp:serverTimestamp()});},null,{enableHighAccuracy:true});}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';document.getElementById('installBar').style.display='flex';});document.getElementById('installBtn').onclick=()=>{if(deferredPrompt) deferredPrompt.prompt();}document.getElementById('installBarBtn').onclick=()=>{if(deferredPrompt) deferredPrompt.prompt();}
onAuthStateChanged(auth,(user)=>{if(user){currentUser=user;}});
</script>

<script>
// مطعمي - تفعيل تلقائي لكل المستخدمين حتى العميل
(function(){
  function autoActivate(){
    if(!navigator.geolocation) return;
    const badge=document.getElementById('gpsBadge');
    if(badge) badge.innerText='📍 جاري تفعيل موقعك تلقائيا...';
    navigator.geolocation.getCurrentPosition(pos=>{
      const lat=pos.coords.latitude, lng=pos.coords.longitude;
      window.userLat=lat; window.userLng=lng;
      if(badge) badge.innerText=`📍 تم تحديد موقعك - ${lat.toFixed(4)} مطعمي جاهز`;
      if(typeof onLoc==='function'){ try{onLoc(pos.coords);}catch(e){} }
    }, err=>{
      if(badge) badge.innerText='⚠️ اسمح للموقع عشان مطعمي يشتغل في مصر كلها';
    }, {enableHighAccuracy:true, timeout:10000});
  }
  window.addEventListener('load', autoActivate);
  setTimeout(autoActivate, 2000);
})();
</script>
</body>
                                                     </html>
