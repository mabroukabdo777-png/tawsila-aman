function renderRegister(){
  const roleName = selectedRole==='client'?'عميل':selectedRole==='restaurant'?'صاحب مطعم':'دليفري';
  document.getElementById('app').innerHTML = `
  <div class="bg-[#16A34A] text-white p-4 flex items-center gap-3">
    <button onclick="renderHome()" class="w-9 h-9 bg-white/20 rounded-full">←</button><h2 class="font-black">تسجيل ${roleName}</h2>
  </div>
  <div class="p-5">
    <div class="bg-white border rounded-2xl p-4 shadow space-y-3">
      <input id="name" placeholder="الاسم كامل" class="w-full border rounded-xl p-3 text-sm">
      <input id="phone" placeholder="01xxxxxxxxx" class="w-full border rounded-xl p-3 text-sm" dir="ltr">
      <input id="address" placeholder="العنوان بالتفصيل" class="w-full border rounded-xl p-3 text-sm">
      <input id="password" type="password" placeholder="كلمة السر" class="w-full border rounded-xl p-3 text-sm">
      ${selectedRole==='restaurant'?`<div class="border-2 border-dashed border-[#86EFAC] rounded-xl p-4 bg-[#F0FDF4] text-center"><p class="text-xs font-bold">صورة المطعم</p><input id="restImg" type="file" class="mt-2 text-xs w-full"><div id="imgPreview" class="mt-2"></div></div>`:''}
      <div id="otpSection" class="hidden"><input id="otpCode" placeholder="كود التأكيد 123456" class="w-full border rounded-xl p-3 text-center"><button id="verifyBtn" class="w-full bg-[#14532D] text-white py-3 rounded-xl mt-2">تأكيد الكود</button></div>
      <button id="sendOtpBtn" class="w-full bg-[#16A34A] text-white py-4 rounded-xl font-black">ارسال كود التأكيد</button>
      <button id="registerBtn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hidden">تسجيل الحساب</button>
      <p id="status" class="text-[11px] text-center text-slate-500"></p>
    </div>
  </div>`;

  if(selectedRole==='restaurant'){
    document.getElementById('restImg').onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const refS = sRef(storage, `restaurants/${Date.now()}_${file.name}`);
      await uploadBytes(refS, file);
      uploadedImageUrl = await getDownloadURL(refS);
      document.getElementById('imgPreview').innerHTML = `<img src="${uploadedImageUrl}" class="w-full h-24 rounded-xl object-cover">`;
    };
  }

  window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {size:'invisible'});
  document.getElementById('sendOtpBtn').onclick = async ()=>{
    const phone = document.getElementById('phone').value.trim();
    if(!phone.startsWith('01')){ alert('رقم غلط'); return; }
    confirmationResult = await signInWithPhoneNumber(auth, '+2'+phone, window.recaptchaVerifier);
    document.getElementById('otpSection').classList.remove('hidden');
    document.getElementById('registerBtn').classList.remove('hidden');
    document.getElementById('sendOtpBtn').classList.add('hidden');
    document.getElementById('status').innerText = 'تم ارسال الكود';
  };
  document.getElementById('verifyBtn').onclick = async ()=>{
    await confirmationResult.confirm(document.getElementById('otpCode').value);
    document.getElementById('status').innerText = 'تم التأكد من الرقم';
  };
  document.getElementById('registerBtn').onclick = async ()=>{
    await set(ref(db, `users/${auth.currentUser.uid}`),{
      role:selectedRole,
      name:document.getElementById('name').value,
      phone:document.getElementById('phone').value,
      address:document.getElementById('address').value,
      password:document.getElementById('password').value,
      image:uploadedImageUrl, verified:true, createdAt:Date.now()
    });
    alert('تم التسجيل');
    renderHome();
  };
}

window.selectRole = (r)=>{ selectedRole=r; renderRegister(); };
window.renderHome = renderHome;
renderHome();

window.secretTap = ()=>{
  secretClicks++;
  if(secretTimer) clearTimeout(secretTimer);
  secretTimer=setTimeout(()=>{secretClicks=0}, 3000);
  if(secretClicks>=7){
    secretClicks=0;
    document.getElementById('secretModal').classList.remove('hidden');
    document.getElementById('secretModal').classList.add('flex');
  }
};
window.closeSecret = ()=>{
  document.getElementById('secretModal').classList.add('hidden');
  document.getElementById('secretModal').classList.remove('flex');
};
window.checkSecret = ()=>{
  if(document.getElementById('secretPass').value==='261997'){
    closeSecret(); renderAdmin();
  }else{ alert('باسورد غلط'); }
};

function renderAdmin(){
  document.getElementById('app').innerHTML = `
  <div class="bg-black text-white p-4 flex justify-between items-center">
    <h2 class="font-black">لوحة المالك - سرية</h2>
    <button onclick="renderHome()" class="bg-white/20 px-3 py-1 rounded-full text-xs">خروج</button>
  </div>
  <div class="p-3 space-y-4 bg-[#F8FAFC] min-h-screen">
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white rounded-xl p-3 text-center border"><p class="text-[10px]">عملاء</p><p id="cClients" class="font-black text-xl text-[#16A34A]">0</p></div>
      <div class="bg-white rounded-xl p-3 text-center border"><p class="text-[10px]">مطاعم</p><p id="cRests" class="font-black text-xl text-[#EA580C]">0</p></div>
      <div class="bg-white rounded-xl p-3 text-center border"><p class="text-[10px]">دليفري</p><p id="cDels" class="font-black text-xl text-[#2563EB]">0</p></div>
    </div>

    <div class="bg-white rounded-xl p-3 border">
      <div class="flex gap-2 mb-2"><button onclick="showTab('users')" class="tabBtn bg-black text-white px-3 py-1 rounded-full text-xs">المستخدمين</button><button onclick="showTab('ads')" class="tabBtn bg-slate-100 px-3 py-1 rounded-full text-xs">الاعلانات المطلوبة</button><button onclick="showTab('commission')" class="tabBtn bg-slate-100 px-3 py-1 rounded-full text-xs">عمولة 15%</button></div>
      <div id="tab-users"></div>
      <div id="tab-ads" class="hidden"></div>
      <div id="tab-commission" class="hidden"></div>
    </div>
  </div>`;

  // احصائيات مباشرة حقيقية
  onValue(ref(db,'users'), (snap)=>{
    const data=snap.val()||{}; let cl=0, re=0, de=0; let html='';
    Object.entries(data).forEach(([uid,u])=>{
      if(u.role==='client') cl++; if(u.role==='restaurant') re++; if(u.role==='delivery') de++;
      html+=`<div class="flex justify-between items-center border-b py-2 text-[11px]"><div><p class="font-bold">${u.name} - ${u.role}</p><p class="text-slate-500">${u.phone} - ${u.address||''}</p></div><button onclick="delUser('${uid}')" class="bg-red-600 text-white px-2 py-1 rounded-full text-[10px]">حذف</button></div>`;
    });
    document.getElementById('cClients').innerText=cl;
    document.getElementById('cRests').innerText=re;
    document.getElementById('cDels').innerText=de;
    document.getElementById('tab-users').innerHTML=html||'لا يوجد مستخدمين';
  });

  // اعلانات مطلوبة
  onValue(ref(db,'adRequests'), (snap)=>{
    const data=snap.val()||{}; let html='';
    Object.entries(data).forEach(([id,ad])=>{
      html+=`<div class="border rounded-xl p-2 mb-2 text-[11px]"><p class="font-black">${ad.restName} - ${ad.ownerName}</p><p>${ad.phone} - ${ad.address}</p><p>نوع: ${ad.type}</p>${ad.type==='image'?`<img src="${ad.url}" class="w-full h-32 object-cover rounded-xl mt-1">`:`<video src="${ad.url}" controls class="w-full h-32 rounded-xl"></video>`}<div class="flex gap-2 mt-2"><button onclick="approveAd('${id}')" class="bg-green-600 text-white px-3 py-1 rounded-full">موافق - انشر</button><button onclick="rejectAd('${id}')" class="bg-red-600 text-white px-3 py-1 rounded-full">رفض</button></div></div>`;
    });
    document.getElementById('tab-ads').innerHTML=html||'لا يوجد طلبات اعلان';
  });

  // عمولة دليفري 15%
  onValue(ref(db,'deliveries/qalyubia'), (snap)=>{
    const data=snap.val()||{}; let html='';
    Object.entries(data).forEach(([uid,d])=>{
      const orders=d.orders||0; const profit=d.profit||0; const commission=(profit*0.15).toFixed(2);
      html+=`<div class="border rounded-xl p-2 mb-2 text-[11px] bg-white"><p class="font-black">${d.name} - ${d.phone}</p><p class="text-slate-500">${d.address}</p><div class="grid grid-cols-3 gap-2 mt-2 text-center"><div class="bg-slate-50 rounded-lg p-2"><p class="text-[9px]">الاوردرات</p><p class="font-black">${orders}</p><p class="text-[8px]">بيزيد تلقائي عند انتهاء الاوردر</p></div><div class="bg-green-50 rounded-lg p-2"><p class="text-[9px]">ربحه</p><p class="font-black">${profit}ج</p></div><div class="bg-yellow-50 rounded-lg p-2"><p class="text-[9px]">عمولتي 15%</p><p class="font-black">${commission}ج</p></div></div><button onclick="delDelivery('${uid}')" class="bg-red-600 text-white px-2 py-1 rounded-full text-[10px] mt-2">حذف الدليفري</button></div>`;
    });
    document.getElementById('tab-commission').innerHTML=html||'لا يوجد دليفري';
  });
}

window.showTab = (t)=>{
  document.querySelectorAll('[id^="tab-"]').forEach(e=>e.classList.add('hidden'));

window.toggleTracking=async()=>{
  const btn=document.getElementById('trackBtn');

    navigator.geolocation.clearWatch(deliveryWatch); deliveryWatch=null;
    await update(ref(db,`deliveries/qalyubia/${auth.currentUser.uid}`),{status:'free'});
    btn.innerText='🟢 شغل تتبع موقعي لايف - حقيقي';
  } else {
    btn.innerText='🔴 جاري تتبع لايف... - علامة حمراء لما تبدأ رحلة';
    deliveryWatch=navigator.geolocation.watchPosition(async(pos)=>{
      await update(ref(db,`deliveries/qalyubia/${auth.currentUser.uid}`),{lat:pos.coords.latitude,lng:pos.coords.longitude,lastSeen:Date.now()});
      await update(ref(db,`users/${auth.currentUser.uid}`),{lat:pos.coords.latitude,lng:pos.coords.longitude});
    },()=>{},{enableHighAccuracy:true,maximumAge:0});
  }
};

window.startDelTripReal=async(orderId)=>{
  const orderSnap=await get(ref(db,`orders/${orderId}`)); const o=orderSnap.val();
  const restSnap=await get(ref(db,`restaurants/qalyubia/${o.restId}`)); const rest=restSnap.val()||{};
  const dist=calcDist(rest.lat||30.1027,rest.lng||31.3157,o.clientLat||30.1027,o.clientLng||31.3157);
  const fee=calcFee(dist); const commission=Math.round(o.total*0.15);

  await update(ref(db,`orders/${orderId}`),{status:'on_the_way',deliveryFee:fee,commission,startedAt:Date.now()});
  await update(ref(db,`delivery_orders/${auth.currentUser.uid}/${orderId}`),{status:'on_the_way',deliveryFee:fee,commission});
  await update(ref(db,`deliveries/qalyubia/${auth.currentUser.uid}`),{status:'busy'}); // علامة حمراء مشغول
  // يروح لصفحة المالك مع العمولة
  await set(ref(db,`owner_commissions/${orderId}`),{orderId,deliveryId:auth.currentUser.uid,restId:o.restId,total:o.total,fee,commission,createdAt:Date.now()});
  openReceiptReal(orderId);
};

window.openReceiptReal=async(orderId)=>{
  const o=await (await get(ref(db,`orders/${orderId}`))).val();
  const rest=await (await get(ref(db,`restaurants/qalyubia/${o.restId}`))).val()||{};
  const client=await (await get(ref(db,`users/${o.clientId}`))).val()||{};
  const dist=o.clientLat?calcDist(rest.lat||0,rest.lng||0,o.clientLat,o.clientLng).toFixed(2):'0';
  const fee=o.deliveryFee||calcFee(Number(dist));
  const body=`
    <p><b>مطعم:</b> ${rest.name||''} - ${rest.phone||''} - ${rest.address||''}</p>
    <p><b>عميل:</b> ${client.name||''} - ${o.clientPhone||client.phone||''}</p>
    <p><b>عنوان العميل:</b> ${o.address||client.address||''}</p>
    <p><b>الوجبات:</b> ${o.items?.map(i=>i.name+' '+i.price+'ج').join(', ')}</p>
    <p><b>سعر المطعم:</b> ${o.total}ج</p>
    <p><b>المسافة:</b> ${dist} كم</p>
    <p><b>سعر التوصيل (13+5*كم):</b> ${fee}ج حقيقي</p>
    <p><b>العمولة 15%:</b> ${Math.round(o.total*0.15)}ج</p>
    <hr><p><b>الاجمالي للعميل:</b> ${o.total+fee}ج</p>
    <p class="text-[9px] text-slate-500">الشيك حقيقي - طالع من الفايربيز</p>
  `;
  document.getElementById('receiptBody').innerHTML=body;
  document.getElementById('receiptModal').classList.remove('hidden');
  document.getElementById('receiptModal').classList.add('flex');
};
window.closeReceipt=()=>{document.getElementById('receiptModal').classList.add('hidden');};

window.cancelDelOrder=async(orderId)=>{
  if(!confirm('لو لغيت هيزيد على عمولتك 2ج - متأكد؟')) return;
  const snap=await get(ref(db,`deliveries/qalyubia/${auth.currentUser.uid}`)); const d=snap.val()||{};
  await update(ref(db,`deliveries/qalyubia/${auth.currentUser.uid}`),{commission:(d.commission||0)+2, cancelCount:(d.cancelCount||0)+1});
  await update(ref(db,`orders/${orderId}`),{status:'cancelled_by_delivery', cancelledAt:Date.now()});
  await update(ref(db,`delivery_orders/${auth.currentUser.uid}/${orderId}`),{status:'cancelled_by_delivery'});
  await set(ref(db,`owner_commissions/${orderId}_cancel`),{orderId,deliveryId:auth.currentUser.uid,penalty:2,reason:'cancel',createdAt:Date.now()});
  alert('الاوردر اتلغى - زاد على عمولتك 2ج حقيقي - راح لصفحة المالك');
};

window.finishTrip=async(orderId)=>{
  const o=await (await get(ref(db,`orders/${orderId}`))).val();
  const fee=o.deliveryFee||20; const commission=o.commission||Math.round(o.total*0.15);
  await update(ref(db,`orders/${orderId}`),{status:'delivered',deliveredAt:Date.now()});
  await update(ref(db,`delivery_orders/${auth.currentUser.uid}/${orderId}`),{status:'delivered'});
  const dSnap=await get(ref(db,`deliveries/qalyubia/${auth.currentUser.uid}`)); const d=dSnap.val()||{};
  await update(ref(db,`deliveries/qalyubia/${auth.currentUser.uid}`),{status:'free',profit:(d.profit||0)+fee,commission:(d.commission||0)+commission,orders:(d.orders||0)+1});

  alert(`انتهت الرحلة حقيقي - ربحت ${fee}ج - عمولة ${commission}ج - بقيت متاح 🟢`);
};

const installBtn=document.getElementById('installBtn');

// لو متثبت قبل كده اخفيه
if(localStorage.getItem('appInstalled')==='1' || window.matchMedia('(display-mode: standalone)').matches){
  installBtn.style.display='none';
}

window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  if(localStorage.getItem('appInstalled')!=='1'){
    installBtn.style.display='block';
  }
});

installBtn.onclick=async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted'){
    installBtn.style.display='none';
    localStorage.setItem('appInstalled','1');
  }
  deferredPrompt=null;
};

window.addEventListener('appinstalled',()=>{
  installBtn.style.display='none';
  localStorage.setItem('appInstalled','1');
});
</script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.update(); // بيجبر التطبيق يدور على تحديث جديد
  });
}
</script>
