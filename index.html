<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>توصيلة أمان - Tawseela Aman</title>
<meta name="theme-color" content="#0A2540">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#F6F8FB;color:#0A2540}
.header{position:sticky;top:0;z-index:1000;background:rgba(10,37,64,0.94);backdrop-filter:blur(16px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo{height:48px;width:48px;background:white;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0A2540}
.app-name{color:white;line-height:1}.app-name b{font-size:15px;display:block}.app-name span{font-size:11px;opacity:.7}
.install{border:none;background:white;color:#0A2540;padding:10px 18px;border-radius:100px;font-weight:900;font-size:13px;cursor:pointer}
.install.ready{background:#00E676}
.back{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:white;padding:7px 14px;border-radius:100px;font-size:13px;cursor:pointer}
.shell{max-width:520px;margin:auto;padding:14px}
.loc-card{background:white;border:1px solid #E6ECF5;border-radius:24px;padding:18px;box-shadow:0 12px 32px rgba(10,37,64,.08);margin-bottom:14px}
.btn{width:100%;border:none;border-radius:16px;padding:15px;font-weight:900;font-size:15px;cursor:pointer}
.btn-dark{background:#0A2540;color:white}.btn-green{background:#00B140;color:white}
.map{height:260px;border-radius:20px;overflow:hidden;border:1px solid #DDE5EF;margin-top:12px;display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-card{background:white;border:1px solid #E8EEF7;border-radius:22px;padding:16px;text-align:center;box-shadow:0 8px 24px rgba(10,37,64,.06);cursor:pointer}
.icon-circle{width:56px;height:56px;border-radius:18px;margin:0 auto 10px auto;display:flex;align-items:center;justify-content:center;font-size:28px}
.screen{background:white;border:1px solid #E6ECF5;border-radius:24px;padding:16px;box-shadow:0 12px 32px rgba(10,37,64,.08)}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #D8E2EF;background:#F8FAFF;font-size:15px;margin:8px 0}
</style>
</head>
<body translate="no">
<div class="header">
<div class="logo-wrap"><button id="backBtn" onclick="goBack()" class="back" style="display:none">← رجوع</button><div class="logo">أمان</div><div class="app-name"><b>توصيلة أمان</b><span>TAWSEELA AMAN</span></div></div>
<button id="installBtn" class="install">📲 ثبّت</button>
</div>
<div class="shell">
<div id="locBox" class="loc-card"><h3>📍 فعّل موقعك الحقيقي</h3><p style="font-size:13px;color:#5B6B80">عشان نجيبلك سواقين في 3 كم والخرائط حقيقية</p><button onclick="askLocation()" class="btn btn-dark">✅ السماح بفتح الموقع</button><div id="locStatus" style="font-size:12px;margin-top:10px"></div><div id="mapPreview" class="map"></div></div>
<div id="roleSelect"><h2 style="margin:4px 6px 12px 0;font-size:18px">اختر حسابك</h2><div class="grid">
<div class="role-card" onclick="goAuth()"><div class="icon-circle" style="background:#E8F0FF">👤</div><b>عميل</b></div>
<div class="role-card" onclick="goAuth()"><div class="icon-circle" style="background:#FFF3CD">🛺</div><b>توكتوك</b></div>
<div class="role-card" onclick="goAuth()"><div class="icon-circle" style="background:#E6FFF0">🏍️</div><b>دليفري</b></div>
<div class="role-card" onclick="goAuth()"><div class="icon-circle" style="background:#E8EEFF">🚗</div><b>ملاكي</b></div>
</div></div>
<div id="authScreen" style="display:none"><button onclick="goBack()" class="btn" style="width:auto;background:#F0F4F8">← الرئيسية</button><div class="screen" style="margin-top:10px"><input class="input" placeholder="01xxxxxxxxx"><input class="input" placeholder="الاسم"><button onclick="verify()" class="btn btn-green">دخول - 1234</button></div></div>
<div id="clientFlow" style="display:none"><button onclick="goBack()" class="btn" style="width:auto;background:#F0F4F8">← رجوع</button><div class="screen" style="margin-top:10px"><div id="map" class="map" style="display:block;height:360px"></div><button onclick="alert('تم الطلب ✅ - عمولة 10%')" class="btn btn-green" style="margin-top:12px">اطلب الآن</button></div></div>
</div>
<script>
let userLoc=null,deferredPrompt=null,stack=['roleSelect'],map,mapPreview;
function goAuth(){if(!userLoc && !localStorage.getItem('userLoc')){alert('فعل الموقع الأول');askLocation();return;}document.getElementById('roleSelect').style.display='none';document.getElementById('authScreen').style.display='block';stack.push('authScreen');document.getElementById('backBtn').style.display='inline-block';}
function goBack(){if(stack.length<=1)return;document.getElementById(stack.pop()).style.display='none';document.getElementById(stack[stack.length-1]).style.display='block';if(stack.length==1){document.getElementById('backBtn').style.display='none';document.getElementById('locBox').style.display='block';}}
function askLocation(){let s=document.getElementById('locStatus');s.innerHTML='⏳ بنحدد موقعك...';navigator.geolocation.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];localStorage.setItem('userLoc',JSON.stringify(userLoc));s.innerHTML='✅ موقعك الحقيقي';document.getElementById('mapPreview').style.display='block';setTimeout(()=>{if(!mapPreview){mapPreview=L.map('mapPreview',{zoomControl:false}).setView(userLoc,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapPreview);}mapPreview.setView(userLoc,15);L.marker(userLoc).addTo(mapPreview).bindPopup('أنت هنا').openPopup();L.circle(userLoc,{radius:3000,color:'#00B140',fillOpacity:0.06}).addTo(mapPreview);},200);},e=>{s.innerHTML='❌ وافق من فوق';},{enableHighAccuracy:true});}
window.addEventListener('load',()=>{let sv=localStorage.getItem('userLoc');if(sv){userLoc=JSON.parse(sv);} if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}});
let b=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;b.classList.add('ready');b.innerHTML='📲 ثبّت الآن ✅';});b.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}});
function verify(){document.getElementById('authScreen').style.display='none';document.getElementById('clientFlow').style.display='block';document.getElementById('locBox').style.display='none';stack.push('clientFlow');setTimeout(()=>{if(!map){map=L.map('map',{zoomControl:false}).setView(userLoc||[30.35,31.19],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);L.marker(userLoc||[30.35,31.19]).addTo(map).bindPopup('موقعك الحقيقي').openPopup();}},300);}
</script>
</body>
</html>
