<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {

}

<style>
:root{--black:#0B0B0B;--gold:#FFD60A;--green:#00C950}
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:var(--black);-webkit-tap-highlight-color:transparent}
.header{position:sticky;top:0;z-index:1000;background:#000;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold)}
.logo{height:54px;width:54px;background:white;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(255,214,10,.15)}
.logo img{width:100%;height:100%;object-fit:cover}
.app-name{color:white;line-height:1}.app-name b{font-size:18px;display:block;font-weight:900}.app-name span{font-size:10px;opacity:.6;letter-spacing:2px}
.slogan{background:#000;color:var(--gold);text-align:center;padding:8px;font-weight:900;font-size:13px;letter-spacing:.5px;border-bottom:1px solid #1A1A1A}
.install{border:none;background:white;color:black;padding:10px 18px;border-radius:100px;font-weight:900;font-size:13px;cursor:pointer}
.install.ready{background:var(--gold);color:black;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.shell{max-width:580px;margin:auto;padding:14px;background:white;min-height:100vh}
.card{background:white;border:1.5px solid #000;border-radius:22px;padding:18px;box-shadow:8px 8px 0 #000;margin-bottom:14px}
.card-black{background:#000;color:white;border:1.5px solid #000;border-radius:22px;padding:18px;box-shadow:8px 8px 0 var(--gold);margin-bottom:14px}
.btn{width:100%;border:1.5px solid #000;border-radius:14px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;transition:.15s;box-shadow:4px 4px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.btn-dark{background:#000;color:white}.btn-gold{background:var(--gold);color:black}.btn-green{background:var(--green);color:black}.btn-light{background:#F5F5F5;color:black}
.map{height:320px;border-radius:18px;overflow:hidden;border:2px solid #000;margin-top:12px;display:none;box-shadow:6px 6px 0 #000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-card{background:white;border:2px solid #000;border-radius:20px;padding:20px 10px;text-align:center;box-shadow:6px 6px 0 #000;cursor:pointer;transition:.15s}
.role-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.role-card b{display:block;margin-top:8px;font-size:15px}
.icon-circle{width:72px;height:72px;border-radius:18px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:36px;border:2px solid #000;background:white}
.input,.select{width:100%;padding:14px 16px;border-radius:12px;border:2px solid #000;background:white;font-size:14px;margin:6px 0;outline:none;font-weight:600}
.input:focus{background:#FFFBEB;border-color:#000}
.label{font-size:11px;font-weight:900;margin:12px 4px 4px 0;display:block;letter-spacing:.5px;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.kpi div{background:white;border:2px solid #000;border-radius:14px;padding:12px;text-align:center;box-shadow:4px 4px 0 #000}
.kpi b{display:block;font-size:20px;font-weight:900}
.tabs{display:flex;gap:8px;margin:12px 0;overflow:auto;padding-bottom:6px}
.tab{padding:10px 16px;border-radius:100px;border:2px solid #000;background:white;font-weight:800;font-size:13px;white-space:nowrap;cursor:pointer;box-shadow:3px 3px 0 #000}
.tab.active{background:#000;color:white}
.order-item{border:2px solid #000;border-radius:16px;padding:14px;margin:10px 0;background:white;box-shadow:4px 4px 0 #000}
.hidden{display:none!important}
.img-preview{width:100%;height:160px;border-radius:12px;border:2px dashed #000;object-fit:cover;display:none;margin-top:8px}
.small{font-size:12px;color:#555;line-height:1.7;font-weight:600}
.badge{display:inline-block;padding:5px 12px;border-radius:100px;font-size:11px;font-weight:900;border:1.5px solid #000}
.badge-green{background:var(--green);color:black}.badge-gold{background:var(--gold);color:black}.badge-black{background:#000;color:white}
.leaflet-container{font-family:'Cairo'!important}
</style>
</head>
