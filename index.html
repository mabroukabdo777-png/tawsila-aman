function renderHome(){
  document.getElementById('app').innerHTML = `
  <div class="bg-gradient-to-b from-[#16A34A] to-[#15803D] text-white p-6 pb-10 rounded-b-[40px]">

function renderRegister(){
  const roleName = selectedRole==='client'?'عميل':selectedRole==='restaurant'?'صاحب مطعم':'دليفري';
  document.getElementById('app').innerHTML = `
  <div class="bg-[#16A34A] text-white p-4 flex items-center gap-3">
    <button onclick="renderHome()" class="w-9 h-9 bg-white/20 rounded-full">←</button><h2 class="font-black">تسجيل ${roleName}</h2>
  </div>
  <div class="p-5">
    <div class="bg-white border rounded-2xl p-4 shadow space-y-3">
      <input id="name" placeholder="الاسم كامل" class="w-full border rounded-xl p-3 text-sm">
      <input id="phone" placeholder="01xxxxxxxxx" class="w-full border rounded-xl p-3 text-sm" dir="ltr">
      <input id="address" placeholder="العنوان بالتفصيل" class="w-full border rounded-xl p-3 text-sm">
      <input id="password" type="password" placeholder="كلمة السر" class="w-full border rounded-xl p-3 text-sm">
      ${selectedRole==='restaurant'?`<div class="border-2 border-dashed border-[#86EFAC] rounded-xl p-4 bg-[#F0FDF4] text-center"><p class="text-xs font-bold">صورة المطعم</p><input id="restImg" type="file" class="mt-2 text-xs w-full"><div id="imgPreview" class="mt-2"></div></div>`:''}
      <div id="otpSection" class="hidden"><input id="otpCode" placeholder="كود التأكيد 123456" class="w-full border rounded-xl p-3 text-center"><button id="verifyBtn" class="w-full bg-[#14532D] text-white py-3 rounded-xl mt-2">تأكيد الكود</button></div>
      <button id="sendOtpBtn" class="w-full bg-[#16A34A] text-white py-4 rounded-xl font-black">ارسال كود التأكيد</button>
      <button id="registerBtn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hidden">تسجيل الحساب</button>
      <p id="status" class="text-[11px] text-center text-slate-500"></p>
    </div>
  </div>`;

  if(selectedRole==='restaurant'){
    document.getElementById('restImg').onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const refS = sRef(storage, `restaurants/${Date.now()}_${file.name}`);
      await uploadBytes(refS, file);
      uploadedImageUrl = await getDownloadURL(refS);
      document.getElementById('imgPreview').innerHTML = `<img src="${uploadedImageUrl}" class="w-full h-24 rounded-xl object-cover">`;
    };
  }

  window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {size:'invisible'});
  document.getElementById('sendOtpBtn').onclick = async ()=>{
    const phone = document.getElementById('phone').value.trim();
    if(!phone.startsWith('01')){ alert('رقم غلط'); return; }
    confirmationResult = await signInWithPhoneNumber(auth, '+2'+phone, window.recaptchaVerifier);
    document.getElementById('otpSection').classList.remove('hidden');
    document.getElementById('registerBtn').classList.remove('hidden');
    document.getElementById('sendOtpBtn').classList.add('hidden');
    document.getElementById('status').innerText = 'تم ارسال الكود';
  };
  document.getElementById('verifyBtn').onclick = async ()=>{
    await confirmationResult.confirm(document.getElementById('otpCode').value);
    document.getElementById('status').innerText = 'تم التأكد من الرقم';
  };
  document.getElementById('registerBtn').onclick = async ()=>{
    await set(ref(db, `users/${auth.currentUser.uid}`),{
      role:selectedRole,
      name:document.getElementById('name').value,
      phone:document.getElementById('phone').value,
      address:document.getElementById('address').value,
      password:document.getElementById('password').value,
      image:uploadedImageUrl, verified:true, createdAt:Date.now()
    });
    alert('تم التسجيل');
    renderHome();
  };
}

window.selectRole = (r)=>{ selectedRole=r; renderRegister(); };
window.renderHome = renderHome;
renderHome();

window.secretTap = ()=>{
  secretClicks++;
  if(secretTimer) clearTimeout(secretTimer);
  secretTimer=setTimeout(()=>{secretClicks=0}, 3000);
  if(secretClicks>=7){
    secretClicks=0;
    document.getElementById('secretModal').classList.remove('hidden');
    document.getElementById('secretModal').classList.add('flex');
  }
};
window.closeSecret = ()=>{
  document.getElementById('secretModal').classList.add('hidden');
  document.getElementById('secretModal').classList.remove('flex');
};
window.checkSecret = ()=>{
  if(document.getElementById('secretPass').value==='261997'){
    closeSecret(); renderAdmin();
  }else{ alert('باسورد غلط'); }
};

function renderAdmin(){
  document.getElementById('app').innerHTML = `
  <div class="bg-black text-white p-4 flex justify-between items-center">
    <h2 class="font-black">لوحة المالك - سرية</h2>
    <button onclick="renderHome()" class="bg-white/20 px-3 py-1 rounded-full text-xs">خروج</button>
  </div>
  <div class="p-3 space-y-4 bg-[#F8FAFC] min-h-screen">
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white rounded-xl p-3 text-center border"><p class="text-[10px]">عملاء</p><p id="cClients" class="font-black text-xl text-[#16A34A]">0</p></div>
      <div class="bg-white rounded-xl p-3 text-center border"><p class="text-[10px]">مطاعم</p><p id="cRests" class="font-black text-xl text-[#EA580C]">0</p></div>
      <div class="bg-white rounded-xl p-3 text-center border"><p class="text-[10px]">دليفري</p><p id="cDels" class="font-black text-xl text-[#2563EB]">0</p></div>
    </div>

    <div class="bg-white rounded-xl p-3 border">
      <div class="flex gap-2 mb-2"><button onclick="showTab('users')" class="tabBtn bg-black text-white px-3 py-1 rounded-full text-xs">المستخدمين</button><button onclick="showTab('ads')" class="tabBtn bg-slate-100 px-3 py-1 rounded-full text-xs">الاعلانات المطلوبة</button><button onclick="showTab('commission')" class="tabBtn bg-slate-100 px-3 py-1 rounded-full text-xs">عمولة 15%</button></div>
      <div id="tab-users"></div>
      <div id="tab-ads" class="hidden"></div>
      <div id="tab-commission" class="hidden"></div>
    </div>
  </div>`;

  // احصائيات مباشرة حقيقية
  onValue(ref(db,'users'), (snap)=>{
    const data=snap.val()||{}; let cl=0, re=0, de=0; let html='';
    Object.entries(data).forEach(([uid,u])=>{
      if(u.role==='client') cl++; if(u.role==='restaurant') re++; if(u.role==='delivery') de++;
      html+=`<div class="flex justify-between items-center border-b py-2 text-[11px]"><div><p class="font-bold">${u.name} - ${u.role}</p><p class="text-slate-500">${u.phone} - ${u.address||''}</p></div><button onclick="delUser('${uid}')" class="bg-red-600 text-white px-2 py-1 rounded-full text-[10px]">حذف</button></div>`;
    });
    document.getElementById('cClients').innerText=cl;
    document.getElementById('cRests').innerText=re;
    document.getElementById('cDels').innerText=de;
    document.getElementById('tab-users').innerHTML=html||'لا يوجد مستخدمين';
  });

  // اعلانات مطلوبة
  onValue(ref(db,'adRequests'), (snap)=>{
    const data=snap.val()||{}; let html='';
    Object.entries(data).forEach(([id,ad])=>{
      html+=`<div class="border rounded-xl p-2 mb-2 text-[11px]"><p class="font-black">${ad.restName} - ${ad.ownerName}</p><p>${ad.phone} - ${ad.address}</p><p>نوع: ${ad.type}</p>${ad.type==='image'?`<img src="${ad.url}" class="w-full h-32 object-cover rounded-xl mt-1">`:`<video src="${ad.url}" controls class="w-full h-32 rounded-xl"></video>`}<div class="flex gap-2 mt-2"><button onclick="approveAd('${id}')" class="bg-green-600 text-white px-3 py-1 rounded-full">موافق - انشر</button><button onclick="rejectAd('${id}')" class="bg-red-600 text-white px-3 py-1 rounded-full">رفض</button></div></div>`;
    });
    document.getElementById('tab-ads').innerHTML=html||'لا يوجد طلبات اعلان';
  });

  // عمولة دليفري 15%
  onValue(ref(db,'deliveries/qalyubia'), (snap)=>{
    const data=snap.val()||{}; let html='';
    Object.entries(data).forEach(([uid,d])=>{
      const orders=d.orders||0; const profit=d.profit||0; const commission=(profit*0.15).toFixed(2);
      html+=`<div class="border rounded-xl p-2 mb-2 text-[11px] bg-white"><p class="font-black">${d.name} - ${d.phone}</p><p class="text-slate-500">${d.address}</p><div class="grid grid-cols-3 gap-2 mt-2 text-center"><div class="bg-slate-50 rounded-lg p-2"><p class="text-[9px]">الاوردرات</p><p class="font-black">${orders}</p><p class="text-[8px]">بيزيد تلقائي عند انتهاء الاوردر</p></div><div class="bg-green-50 rounded-lg p-2"><p class="text-[9px]">ربحه</p><p class="font-black">${profit}ج</p></div><div class="bg-yellow-50 rounded-lg p-2"><p class="text-[9px]">عمولتي 15%</p><p class="font-black">${commission}ج</p></div></div><button onclick="delDelivery('${uid}')" class="bg-red-600 text-white px-2 py-1 rounded-full text-[10px] mt-2">حذف الدليفري</button></div>`;
    });
    document.getElementById('tab-commission').innerHTML=html||'لا يوجد دليفري';
  });
}

window.showTab = (t)=>{
  document.querySelectorAll('[id^="tab-"]').forEach(e=>e.classList.add('hidden'));
  document.getElementById('tab-'+t).classList.remove('hidden');
  document.querySelectorAll('.tabBtn').forEach(b=>{b.classList.remove('bg-black','text-white'); b.classList.add('bg-slate-100')});
  event.target.classList.add('bg-black','text-white');
};
window.delUser = async (uid)=>{ if(confirm('متأكد تحذف؟')) await remove(ref(db, `users/${uid}`)); };
window.delDelivery = async (uid)=>{ if(confirm('حذف الدليفري؟')){ await remove(ref(db, `deliveries/qalyubia/${uid}`)); await remove(ref(db, `users/${uid}`)); } };
window.approveAd = async (id)=>{
  const snap=await get(ref(db, `adRequests/${id}`)); const ad=snap.val();
  await set(ref(db, `ads/${id}`), {...ad, approved:true, approvedAt:Date.now()});
  await remove(ref(db, `adRequests/${id}`)); alert('تم النشر في صفحة الاعلانات فورا');
};
window.rejectAd = async (id)=>{ await remove(ref(db, `adRequests/${id}`)); alert('تم الرفض'); };

window.selectRole = (r)=>{ selectedRole=r; renderRegister(); };
window.renderHome = renderHome;
  // ========== الخطوة 3: صفحة العميل - خريطة حقيقية + تتبع + سلة + طلباتي + خصومات - حقيقي 100% ==========
let userPos=null, cart=[], currentOrderId=null, mapObj=null, userMarker=null, restMarkers=[], delMarkers=[];
function calcDist(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function renderClient(){
  cart=[];
  document.getElementById('app').innerHTML=`<div class="bg-[#16A34A] text-white p-3 flex justify-between items-center sticky top-0 z-50"><h2 class="font-black text-[12px]">تتبع مباشر حقيقي</h2><div class="flex gap-1"><button onclick="showClientTab('home')" id="b-home" class="bg-black px-3 py-1 rounded-full text-[10px]">الرئيسية</button><button onclick="showClientTab('cart')" id="b-cart" class="bg-white/20 px-3 py-1 rounded-full text-[10px]">السلة (<span id="cartCountTop">0</span>)</button><button onclick="showClientTab('orders')" id="b-orders" class="bg-white/20 px-3 py-1 rounded-full text-[10px]">طلباتي</button><button onclick="showClientTab('discounts')" id="b-discounts" class="bg-white/20 px-3 py-1 rounded-full text-[10px]">الخصومات</button></div></div><div id="client-home" class="p-2 space-y-2"><div class="bg-yellow-50 border rounded-xl p-2 text-[10px]">📍 الخريطة بتجيب موقعك تلقائي 100% وتظهر المطاعم والدليفري الحقيقيين حواليك</div><div id="map" style="height:280px;border-radius:20px;border:2px solid #16A34A"></div><div class="grid grid-cols-2 gap-2"><div class="bg-white border rounded-xl p-2 text-center"><p class="text-[9px]">موقعك الحقيقي</p><p id="myLoc" class="text-[10px] font-bold">جاري GPS...</p></div><div class="bg-white border rounded-xl p-2 text-center"><p class="text-[9px]">مطاعم حواليك</p><p id="nearCount" class="font-black text-xl">0</p></div></div><h3 class="font-black text-sm">مطاعم قريبة - دوس يفتح المنيو الحقيقي</h3><div id="restList" class="space-y-2"></div></div><div id="client-cart" class="p-3 hidden space-y-3"><h3 class="font-black text-sm">السلة - لازم تأكيد أو إلغاء</h3><div id="cartItems"></div><div class="bg-black text-white rounded-2xl p-3"><p class="text-sm">الإجمالي: <span id="cartTotal">0</span>ج</p><button onclick="confirmCart()" class="w-full bg-[#16A34A] py-3 rounded-full mt-2 font-black">تأكيد الطلب - يروح للمطعم حقيقي</button><button onclick="cancelCart()" class="w-full bg-white/20 py-2 rounded-full mt-2 text-xs">إلغاء</button></div><div id="deliveryChooser" class="hidden bg-white border-2 border-green-400 rounded-2xl p-3"><h4 class="font-black text-sm">اختار أقرب كابتن متاح فقط (مخلص رحلة)</h4><div id="freeDelList" class="space-y-2 mt-3 max-h-[350px] overflow-auto"></div></div></div><div id="client-orders" class="p-3 hidden space-y-3"><h3 class="font-black text-sm">طلباتي - تتبع لايف حقيقي</h3><div id="trackMap" style="height:360px;border-radius:20px;border:2px solid black"></div><div id="myOrdersList"></div></div><div id="client-discounts" class="p-3 hidden space-y-3"><div class="flex gap-2"><button onclick="showDiscount('image')" id="d-img" class="bg-black text-white px-4 py-2 rounded-full text-xs">صور</button><button onclick="showDiscount('video')" id="d-vid" class="bg-slate-100 px-4 py-2 rounded-full text-xs">فيديو</button></div><div id="discountGrid" class="grid grid-cols-1 gap-3"></div></div>`;
  setTimeout(()=>{
    mapObj=L.map('map').setView([30.1027,31.3157],14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapObj);
    if(navigator.geolocation){navigator.geolocation.getCurrentPosition(async(pos)=>{userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};document.getElementById('myLoc').innerText=userPos.lat.toFixed(5)+","+userPos.lng.toFixed(5);mapObj.setView([userPos.lat,userPos.lng],15);if(userMarker)mapObj.removeLayer(userMarker);userMarker=L.marker([userPos.lat,userPos.lng],{icon:L.divIcon({html:'📍',className:'text-[28px]'})}).addTo(mapObj).bindPopup('انت هنا');if(auth.currentUser)await update(ref(db,`users/${auth.currentUser.uid}`),{lat:userPos.lat,lng:userPos.lng});loadNearbyReal();},()=>{loadNearbyReal();},{enableHighAccuracy:true});}
    function loadNearbyReal(){
      onValue(ref(db,'restaurants/qalyubia'),(snap)=>{const data=snap.val()||{};let html='';let count=0;restMarkers.forEach(m=>mapObj.removeLayer(m));restMarkers=[];Object.entries(data).forEach(([uid,r])=>{if(!r.lat)return;const d=userPos?calcDist(userPos.lat,userPos.lng,r.lat,r.lng):0;if(!userPos||d<30){count++;const mk=L.marker([r.lat,r.lng],{icon:L.divIcon({html:'🍔',className:'text-[24px]'})}).addTo(mapObj).bindPopup(r.name);restMarkers.push(mk);html+=`<div onclick="openRest('${uid}')" class="bg-white border-2 rounded-2xl p-3 flex gap-3"><img src="${r.img}" class="w-16 h-16 rounded-xl object-cover"><div><p class="font-black text-sm">${r.name}</p><p class="text-[10px] text-green-600">${d.toFixed(2)} كم</p></div></div>`;}});document.getElementById('nearCount').innerText=count;document.getElementById('restList').innerHTML=html||'لا يوجد مطاعم';});
      onValue(ref(db,'deliveries/qalyubia'),(snap)=>{const data=snap.val()||{};delMarkers.forEach(m=>mapObj.removeLayer(m));delMarkers=[];Object.entries(data).forEach(([uid,d])=>{if(d.lat&&d.lng){const mk=L.marker([d.lat,d.lng],{icon:L.divIcon({html:d.status==='free'?'🟢🛵':'🔴🛵',className:'text-[20px]'})}).addTo(mapObj).bindPopup(d.name);delMarkers.push(mk);}});});
    }
    loadNearbyReal(); loadMyOrdersReal(); loadDiscountsReal('image');
  },400);
}
window.showClientTab=(t)=>{document.getElementById('client-home').classList.add('hidden');document.getElementById('client-cart').classList.add('hidden');document.getElementById('client-orders').classList.add('hidden');document.getElementById('client-discounts').classList.add('hidden');document.getElementById('client-'+t).classList.remove('hidden');document.querySelectorAll('[id^="b-"]').forEach(b=>b.className='bg-white/20 px-3 py-1 rounded-full text-[10px]');document.getElementById('b-'+t).className='bg-black px-3 py-1 rounded-full text-[10px]';if(t==='orders')setTimeout(initTrackMapReal,400);};
function initTrackMapReal(){const tmap=L.map('trackMap').setView(userPos?[userPos.lat,userPos.lng]:[30.1027,31.3157],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(tmap);if(userPos)L.marker([userPos.lat,userPos.lng]).addTo(tmap);onValue(ref(db,`orders`),(snap)=>{const data=snap.val()||{};Object.entries(data).forEach(([id,o])=>{if(o.clientId===auth.currentUser.uid&&o.deliveryId){onValue(ref(db,`deliveries/qalyubia/${o.deliveryId}`),(dsnap)=>{const d=dsnap.val();if(!d||!d.lat)return;L.marker([d.lat,d.lng],{icon:L.divIcon({html:'🛵💨',className:'text-[26px]'})}).addTo(tmap).bindPopup(d.name+'<br>'+d.phone);if(userPos)L.polyline([[userPos.lat,userPos.lng],[d.lat,d.lng]],{color:'#16A34A',weight:4,dashArray:'8,8'}).addTo(tmap);});}});});}
window.openRest=async(restId)=>{const snap=await get(ref(db,`restaurants/qalyubia/${restId}`));const r=snap.val();const menuSnap=await get(ref(db,`menus/${restId}`));const menu=menuSnap.val()||{};let html=`<div class="bg-[#16A34A] text-white p-4 flex gap-3"><button onclick="renderClient()" class="w-9 h-9 bg-white/20 rounded-full">←</button><h2 class="font-black">${r.name}</h2></div><div class="p-3 space-y-3"><img src="${r.img}" class="w-full h-44 rounded-2xl object-cover"><p class="font-black text-sm">${Object.keys(menu).length} وجبة حقيقية</p>`;Object.entries(menu).forEach(([mid,m])=>{html+=`<div class="bg-white border-2 rounded-2xl p-3 flex gap-3"><img src="${m.img}" class="w-20 h-20 rounded-xl"><div><p class="font-black text-sm">${m.name}</p><p class="text-sm text-green-600 font-bold">${m.price}ج</p><button onclick="addToCart('${restId}','${mid}','${m.name}',${m.price})" class="bg-black text-white px-4 py-2 rounded-full text-xs mt-2">طلب - للسلة مباشر</button></div></div>`;});html+=`</div>`;document.getElementById('app').innerHTML=html;};
window.addToCart=(restId,menuId,name,price)=>{cart.push({restId,menuId,name,price});document.getElementById('cartCountTop').innerText=cart.length;renderCartReal();showClientTab('cart');};
function renderCartReal(){let html='';let total=0;cart.forEach((it,i)=>{total+=it.price;html+=`<div class="bg-white border rounded-xl p-3 flex justify-between text-xs"><b>${it.name}</b><span>${it.price}ج <button onclick="removeCart(${i})" class="text-red-600">x</button></span></div>`;});document.getElementById('cartItems').innerHTML=html;document.getElementById('cartTotal').innerText=total;}
window.removeCart=(i)=>{cart.splice(i,1);document.getElementById('cartCountTop').innerText=cart.length;renderCartReal();};
window.cancelCart=()=>{cart=[];document.getElementById('cartCountTop').innerText=0;renderCartReal();showClientTab('home');document.getElementById('deliveryChooser').classList.add('hidden');};
window.confirmCart=async()=>{if(cart.length===0)return;const total=cart.reduce((s,i)=>s+i.price,0);const restId=cart[0].restId;const orderId=push(ref(db,'orders')).key;const clientSnap=await get(ref(db,`users/${auth.currentUser.uid}`));const client=clientSnap.val();await set(ref(db,`orders/${orderId}`),{id:orderId,clientId:auth.currentUser.uid,restId,items:cart,total,status:'new',clientLat:userPos?.lat||30.1027,clientLng:userPos?.lng||31.3157,address:client.address,createdAt:Date.now()});document.getElementById('deliveryChooser').classList.remove('hidden');onValue(ref(db,'deliveries/qalyubia'),(snap)=>{const data=snap.val()||{};let html='';let sorted=Object.entries(data).filter(([uid,d])=>d.status==='free'&&d.lat).sort((a,b)=>{const da=userPos?calcDist(userPos.lat,userPos.lng,a[1].lat,a[1].lng):0;const db=userPos?calcDist(userPos.lat,userPos.lng,b[1].lat,b[1].lng):0;return da-db;});sorted.forEach(([uid,d])=>{const dist=userPos?calcDist(userPos.lat,userPos.lng,d.lat,d.lng).toFixed(2):'-';html+=`<div class="border-2 border-green-100 rounded-2xl p-3 flex justify-between"><div class="text-xs"><p class="font-black">${d.name} - متاح</p><p>${d.phone}</p><p class="text-[10px] text-green-600">${dist} كم</p></div><button onclick="chooseDelivery('${uid}','${orderId}')" class="bg-[#16A34A] text-white px-4 py-3 rounded-full text-xs">اطلب عليه</button></div>`;});document.getElementById('freeDelList').innerHTML=html||'لا يوجد كابتن متاح';});};
window.chooseDelivery=async(delId,orderId)=>{await update(ref(db,`orders/${orderId}`),{deliveryId:delId,status:'assigned'});const orderData=(await get(ref(db,`orders/${orderId}`))).val();await set(ref(db,`delivery_orders/${delId}/${orderId}`),orderData);await update(ref(db,`deliveries/qalyubia/${delId}`),{status:'busy'});const dSnap=await get(ref(db,`deliveries/qalyubia/${delId}`));const d=dSnap.val();document.getElementById('app').innerHTML=`<div class="bg-black text-white p-4"><h2 class="font-black text-sm">الكابتن ${d.name} - ${d.phone}</h2></div><div class="p-3 space-y-3"><div id="trackMap" style="height:380px;border-radius:20px"></div><button onclick="startTrip('${orderId}','${delId}')" class="w-full bg-[#16A34A] text-white py-4 rounded-xl font-black">ابدأ رحلة توصيل - تتبع لايف حقيقي</button><button onclick="renderClient(); showClientTab('orders')" class="w-full bg-slate-100 py-3 rounded-xl text-xs mt-2">طلباتي - تابع على الخريطة</button></div>`;setTimeout(initTrackMapReal,400);};
window.startTrip=async(orderId,delId)=>{await update(ref(db,`orders/${orderId}`),{status:'on_the_way'});alert('بدأت الرحلة - العميل شايفك لايف حقيقي');};
function loadMyOrdersReal(){onValue(ref(db,'orders'),(snap)=>{const data=snap.val()||{};let html='';Object.entries(data).forEach(([id,o])=>{if(o.clientId===auth.currentUser?.uid){html+=`<div class="bg-white border-2 rounded-2xl p-3 text-xs"><p class="font-black">${o.total}ج - ${o.status}</p><p>الكابتن: ${o.deliveryId?o.deliveryId.slice(0,8):'لم يحدد'}</p><p>${o.deliveryId?'استلم - تابع فوق لايف':'بانتظار كابتن'}</p></div>`;}});const el=document.getElementById('myOrdersList');if(el)el.innerHTML=html||'لا يوجد طلبات';});}
window.showDiscount=(type)=>{document.getElementById('d-img').className=type==='image'?'bg-black text-white px-4 py-2 rounded-full text-xs':'bg-slate-100 px-4 py-2 rounded-full text-xs';document.getElementById('d-vid').className=type==='video'?'bg-black text-white px-4 py-2 rounded-full text-xs':'bg-slate-100 px-4 py-2 rounded-full text-xs';loadDiscountsReal(type);};
function loadDiscountsReal(type){onValue(ref(db,'ads'),(snap)=>{const data=snap.val()||{};let html='';Object.entries(data).forEach(([id,ad])=>{if(ad.type===type){html+=`<div class="bg-white border-2 rounded-2xl overflow-hidden"><div class="p-3"><p class="font-black text-sm">${ad.restName}</p></div>${ad.type==='image'?`<img src="${ad.url}" class="w-full h-64 object-cover"><button onclick="openRest('${ad.restId}')" class="w-full bg-black text-white py-3 text-sm font-black">اطلب</button>`:`<video src="${ad.url}" controls class="w-full h-64"></video><button onclick="openRest('${ad.restId}')" class="w-full bg-black text-white py-3">اطلب</button>`}</div>`;}});const el=document.getElementById('discountGrid');if(el)el.innerHTML=html||'لا يوجد خصومات';});}
renderHome();
</script>
