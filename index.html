function haversine(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

async function uploadImage(file){if(!file)return null;const compressed=await new Promise(res=>{const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');let w=img.width,h=img.height;if(w>500){h=h*(500/w);w=500;}if(h>500){w=w*(500/h);h=500;}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cv.toBlob(b=>res(b),'image/jpeg',0.6);};img.src=ev.target.result;};rd.readAsDataURL(file);});try{const sr=sRef(storage,'images/'+Date.now()+'.jpg');const snap=await uploadBytes(sr,compressed);return await getDownloadURL(snap.ref);}catch(e){return new Promise(res=>{const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');let w=img.width,h=img.height;if(w>500){h=h*(500/w);w=500;}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',0.5));};img.src=ev.target.result;};rd.readAsDataURL(file);});}}

};
function renderDriver(){
document.getElementById('app').innerHTML='<div class="flex justify-between mb-4"><h2 class="font-black">دليفري - '+currentUser.name+'</h2><button onclick="logout()" class="bg-white/10 px-3 py-1 rounded-full text-xs">خروج</button></div><div class="glass p-3 rounded-xl mb-3"><div class="flex justify-between"><span class="text-xs">💰 عمولتك: <b id="myDebt">0/150ج</b></span><span class="text-[10px] opacity-50" id="myDebtPercent">0%</span></div><div class="w-full h-2 bg-black/30 rounded-full mt-2 overflow-hidden"><div id="myDebtBar" class="h-full bg-green-500" style="width:0%"></div></div></div><div class="flex gap-2 mb-3"><button onclick="showDriverTab(\'nearby\')" id="dtab-nearby" class="flex-1 bg-[#FFD600] text-black py-2 rounded-xl text-xs">📦 طلبات قريبة</button><button onclick="showDriverTab(\'history\')" id="dtab-history" class="flex-1 bg-white/10 py-2 rounded-xl text-xs">📜 سجلي</button></div><div id="driverOrders"><div class="text-center py-8 opacity-30 text-xs">جاري البحث...</div></div><div id="driverHistory" class="hidden"></div>';
loadDriverOrders();loadMyDebt();if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{myLat=pos.coords.latitude;myLng=pos.coords.longitude;});}
}
window.showDriverTab=(tab)=>{const ob=document.getElementById('dtab-nearby');const hb=document.getElementById('dtab-history');const od=document.getElementById('driverOrders');const hd=document.getElementById('driverHistory');if(tab==='nearby'){ob.className='flex-1 bg-[#FFD600] text-black py-2 rounded-xl text-xs';hb.className='flex-1 bg-white/10 py-2 rounded-xl text-xs';od.classList.remove('hidden');hd.classList.add('hidden');}else{ob.className='flex-1 bg-white/10 py-2 rounded-xl text-xs';hb.className='flex-1 bg-[#FFD600] text-black py-2 rounded-xl text-xs';od.classList.add('hidden');hd.classList.remove('hidden');loadDriverHistory();}};
function loadDriverHistory(){const hd=document.getElementById('driverHistory');if(!hd)return;hd.innerHTML='⏳ جاري التحميل...';const q=query(ref(db,'orders'),orderByChild('driverId'),equalTo(currentUser.id),limitToLast(100));onValue(q,s=>{const vals=s.val()||{};const all=Object.entries(vals).sort((a,b)=>b[1].createdAt-a[1].createdAt);const delivered=all.filter(([k,o])=>o.status==='delivered').length;const comm=all.reduce((sum,[k,o])=>sum+(o.commission||0),0);hd.innerHTML='<div class="grid grid-cols-3 gap-2 mb-3"><div class="glass p-3 rounded-xl text-center"><div class="font-black text-sm">'+all.length+'</div><div class="text-[9px] opacity-50">كل الطلبات</div></div><div class="glass p-3 rounded-xl text-center"><div class="font-black text-sm text-green-400">'+delivered+'</div><div class="text-[10px] opacity-50">تم</div></div><div class="glass p-3 rounded-xl text-center"><div class="font-black text-sm">'+comm+'ج</div><div class="text-[9px] opacity-50">عمولة</div></div></div><div class="space-y-2">'+all.map(([k,o])=>'<div class="glass p-3 rounded-xl"><div class="font-bold text-xs">#'+(o.orderNumber||'')+' '+o.text.slice(0,30)+'</div><div class="text-[11px] opacity-60">💰 '+o.price+'ج - '+o.status+'</div><div class="text-[10px] opacity-40">'+new Date(o.createdAt).toLocaleDateString('ar-EG')+'</div></div>').join('')+'</div>';});}
function loadDriverOrders(){const q=query(ref(db,'orders'),orderByChild('status'),equalTo('searching'),limitToLast(50));onValue(q,async s=>{const vals=s.val()||{};let list=Object.entries(vals);if(!myLat){myLat=30.4698;myLng=31.1969;}let withDist=[];for(const [k,o] of list){if(!o.lat||!o.lng)continue;const d=haversine(myLat,myLng,o.lat,o.lng);if(d<=7){withDist.push([k,o,d]);}}withDist.sort((a,b)=>a[2]-b[2]);const el=document.getElementById('driverOrders');if(!el)return;if(!withDist.length){el.innerHTML='<div class="text-center opacity-30 py-8 text-xs">مفيش طلبات قريبة 0-7 كيلو</div>';return;}el.innerHTML=withDist.map(([k,o,d])=>{
let isRest=o.type==='restaurant';
let receiptHtml='';
if(isRest && o.items){
  receiptHtml='<div class="mt-2 bg-black/40 p-2 rounded-xl border border-white/10"><div class="font-black text-xs mb-1">🍔 '+ (o.restaurantName||'مطعم') +' - شيك:</div>'+ o.items.map((it,i)=>'<div class="flex justify-between text-[11px]"><span>'+(i+1)+'. '+it.name+'</span><span class="text-[#FFD600]">'+it.price+'ج</span></div>').join('') +'<div class="border-t border-white/10 mt-1 pt-1 flex justify-between font-black text-xs"><span>الإجمالي</span><span class="text-[#FFD600]">'+o.price+'ج</span></div>'+(o.restaurantLat?'<div class="text-[10px] opacity-50 mt-1">📍 مطعم: '+o.restaurantLat.toFixed(4)+','+o.restaurantLng.toFixed(4)+'</div>':'')+'</div>';
} else {
  receiptHtml='<div class="text-xs mt-1 bg-black/20 p-2 rounded-xl">📦 '+o.text.slice(0,120)+'</div>';
}
return '<div class="glass p-4 rounded-xl mb-3 border '+(isRest?'border-orange-500/30 bg-orange-500/5':'border-white/10')+'"><div class="flex justify-between"><div class="font-bold text-sm">#'+(o.orderNumber||'')+' '+(isRest?'🍔 مطعم':'📦 توصيلة')+'</div><div class="text-[10px] bg-[#FFD600] text-black px-2 py-1 rounded-full font-black">'+d.toFixed(1)+' كم</div></div>'+receiptHtml+'<div class="flex justify-between mt-2 text-xs"><span>💰 '+o.price+'ج - عمولة '+o.commission+'ج</span><span class="opacity-50">'+(o.city||'')+'</span></div><div class="text-xs mt-2">👤 '+o.customerName+' - 📞 <a href="tel:'+o.customerPhone+'" class="text-[#FFD600] underline">'+o.customerPhone+'</a></div>'+(isRest?'<div class="text-[11px] mt-1 opacity-60">🏪 '+ (o.restaurantName||'') + (o.restaurantPhone?' - 📞 '+o.restaurantPhone:'') +'</div>':'')+'<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="acceptOrder(\''+k+'\')" class="yellow font-black py-2.5 rounded-xl text-sm">قبول ✅ - شيك كامل</button><button onclick="openMaps('+(o.restaurantLat||o.lat)+','+(o.restaurantLng||o.lng)+')" class="bg-white/10 py-2.5 rounded-xl text-xs">📍 مطعم</button></div></div>';
}).join('');});}
window.acceptOrder=async(orderId)=>{try{await runTransaction(ref(db,'orders/'+orderId),curr=>{if(!curr)return curr;if(curr.status!=='searching')return;curr.status='accepted';curr.driverId=currentUser.id;curr.driverName=currentUser.name;curr.driverPhone=currentUser.phone;curr.acceptedAt=Date.now();return curr;});const snap=await new Promise(r=>{onValue(ref(db,'orders/'+orderId),s=>r(s),{onlyOnce:true});});const o=snap.val();if(o&&o.driverId===currentUser.id){startDriverLiveTracking(orderId);renderDriverActive(orderId);}else{alert('الطلب اتاخد');}}catch(e){alert('فشل');}};
function renderDriverActive(orderId){onValue(ref(db,'orders/'+orderId),s=>{const o=s.val();if(!o)return;const el=document.getElementById('driverOrders');if(!el)return;if(o.status==='accepted'){
let isRest=o.type==='restaurant';
let receiptHtml='';
if(isRest && o.items){
  receiptHtml='<div class="mt-3 bg-black/40 p-3 rounded-xl border border-orange-500/20"><div class="font-black text-sm mb-2">🧾 شيك #'+(o.orderNumber||'')+' - '+ (o.restaurantName||'مطعم') +'</div>'+ o.items.map((it,i)=>'<div class="flex justify-between text-xs py-1 border-b border-white/5"><span>'+(i+1)+'. '+it.name+'</span><span class="text-[#FFD600] font-black">'+it.price+'ج</span></div>').join('') +'<div class="flex justify-between font-black text-sm mt-2"><span>الإجمالي</span><span class="text-[#FFD600]">'+o.price+'ج</span></div><div class="text-[11px] mt-2 opacity-60">🏪 '+ (o.restaurantName||'') +' - 📞 '+(o.restaurantPhone||'') +'</div><div class="text-[10px] opacity-50 mt-1">📍 مطعم: '+(o.restaurantLat?.toFixed(4)||'')+' → عميل: '+(o.customerLat?.toFixed(4)||o.lat.toFixed(4))+'</div></div>';
} else {
  receiptHtml='<div class="mt-2 bg-black/20 p-2 rounded-xl text-xs">📦 '+o.text.slice(0,200)+'</div>';
}
el.innerHTML='<div class="glass p-4 rounded-xl border border-green-500/20"><div class="font-black">#'+(o.orderNumber||'')+' مقبول - '+(isRest?'🍔 مطعم':'📦 توصيلة')+'</div><div class="text-xs mt-2">👤 '+o.customerName+' - 📞 <a href="tel:'+o.customerPhone+'" class="text-[#FFD600] underline">'+o.customerPhone+'</a></div>'+receiptHtml+'<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="updateOrderStatus(\''+orderId+'\',\'on_the_way\')" class="yellow py-2.5 rounded-xl text-xs font-black">في الطريق 🛵</button><button onclick="openChat(\''+orderId+'\')" class="bg-white/10 py-2.5 rounded-xl text-xs">💬 شات</button></div><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="openMaps('+(o.restaurantLat||o.lat)+','+(o.restaurantLng||o.lng)+')" class="bg-orange-500/20 text-orange-300 py-2 rounded-xl text-xs">📍 مطعم</button><button onclick="openMaps('+(o.customerLat||o.lat)+','+(o.customerLng||o.lng)+')" class="bg-blue-500/20 text-blue-300 py-2 rounded-xl text-xs">📍 عميل</button></div></div>';
}else if(o.status==='on_the_way'){
let receiptHtml=o.items? '<div class="mt-2 bg-black/30 p-2 rounded-xl text-xs">'+ o.items.map(it=>it.name+' - '+it.price+'ج').join(' | ') +'</div>' : '<div class="mt-2 text-xs opacity-60">'+o.text.slice(0,100)+'</div>';
el.innerHTML='<div class="glass p-4 rounded-xl"><div class="font-black">#'+(o.orderNumber||'')+' في الطريق 🛵 - '+ (o.restaurantName||o.customerName) +'</div>'+receiptHtml+'<div class="text-xs mt-2">👤 '+o.customerName+' - 📞 '+o.customerPhone+'</div><button onclick="updateOrderStatus(\''+orderId+'\',\'delivered\')" class="w-full mt-3 bg-green-500 text-black py-3 rounded-xl font-black">تم التوصيل ✅ - خد '+o.commission+'ج</button><button onclick="openMaps('+(o.customerLat||o.lat)+','+(o.customerLng||o.lng)+')" class="w-full mt-2 bg-white/10 py-2 rounded-xl text-xs">📍 عميل - خرائط</button></div>';
}else if(o.status==='delivered'){el.innerHTML='<div class="text-center py-8"><div class="text-4xl">✅</div><div class="font-black mt-2">تم #'+(o.orderNumber||'')+'</div><button onclick="renderDriver()" class="mt-4 bg-white/10 px-6 py-2 rounded-xl text-xs">طلبات جديدة</button></div>';stopLiveTracking();}});}
window.updateOrderStatus=async(orderId,status)=>{await update(ref(db,'orders/'+orderId),{status});if(status==='delivered'){const snap=await new Promise(r=>{onValue(ref(db,'orders/'+orderId),s=>r(s),{onlyOnce:true});});const o=snap.val();if(o){const ds=await new Promise(r=>{onValue(ref(db,'users/'+o.driverId),s=>r(s),{onlyOnce:true});});const driver=ds.val();if(driver){const newDebt=(driver.debt||0)+(o.commission||0);const blocked=newDebt>=150;await update(ref(db,'users/'+o.driverId),{debt:newDebt,blocked});}}stopLiveTracking();}if(status!=='delivered')renderDriverActive(orderId);};
function loadMyDebt(){onValue(ref(db,'users/'+currentUser.id),s=>{const u=s.val();if(!u)return;const d=u.debt||0;const el=document.getElementById('myDebt');if(el)el.textContent=d+'/150ج';const p=document.getElementById('myDebtPercent');if(p)p.textContent=Math.round((d/150)*100)+'%';const bar=document.getElementById('myDebtBar');if(bar){bar.style.width=Math.min((d/150)*100,100)+'%';bar.className='h-full '+(d>=120?'bg-red-500':d>=80?'bg-yellow-500':'bg-green-500');}});}
function renderAdmin(){
document.getElementById('app').innerHTML='<div class="flex justify-between mb-4"><h2 class="font-black">مالك - 261997</h2><button onclick="logout()" class="bg-white/10 px-3 py-1 rounded-full text-xs">خروج</button></div><div class="grid grid-cols-3 gap-2 mb-4"><button onclick="atab(\'overview\')" class="bg-[#FFD600] text-black py-2 rounded-xl text-xs font-black">نظرة</button><button onclick="atab(\'pending\')" class="bg-white/10 py-2 rounded-xl text-xs">انتظار</button><button onclick="atab(\'allDelivery\')" class="bg-white/10 py-2 rounded-xl text-xs">دليفري</button></div><div class="grid grid-cols-3 gap-2 mb-4"><button onclick="atab(\'orders\')" class="bg-white/10 py-2 rounded-xl text-xs">طلبات</button><button onclick="atab(\'search\')" class="bg-white/10 py-2 rounded-xl text-xs">بحث</button><button onclick="exportExcel()" class="bg-green-500 text-black py-2 rounded-xl text-xs">إكسل</button></div><div id="ac"></div>';
atab('overview');
}
window.atab=(t)=>{
document.querySelectorAll('[onclick^=atab]').forEach(b=>b.className='bg-white/10 py-2 rounded-xl text-xs');
if(t==='overview'){const q=query(ref(db,'users'),limitToLast(100));onValue(q,s=>{const vals=Object.values(s.val()||{});const del=vals.filter(u=>u.role==='delivery').length;const cust=vals.filter(u=>u.role==='customer').length;const rest=vals.filter(u=>u.role==='restaurant').length;document.getElementById('ac').innerHTML='<div class="grid grid-cols-3 gap-2"><div class="glass p-3 rounded-xl text-center"><div class="font-black">'+cust+'</div><div class="text-[10px] opacity-50">عملاء</div></div><div class="glass p-3 rounded-xl text-center"><div class="font-black">'+del+'</div><div class="text-[10px] opacity-50">دليفري</div></div><div class="glass p-3 rounded-xl text-center"><div class="font-black">'+rest+'</div><div class="text-[10px] opacity-50">مطاعم</div></div></div>';});}
if(t==='pending'){const q=query(ref(db,'users'),orderByChild('status'),equalTo('pending'),limitToLast(50));onValue(q,s=>{const vals=Object.values(s.val()||{});document.getElementById('ac').innerHTML=vals.map(u=>'<div class="glass p-4 rounded-xl mb-3"><div class="font-bold text-sm">'+u.name+' - '+u.phone+'</div><div class="flex gap-2 mt-2"><button onclick="approve(\''+u.id+'\')" class="flex-1 bg-green-500 text-black py-2 rounded-xl text-xs">قبول</button><button onclick="deleteUser(\''+u.id+'\')" class="bg-red-500/20 text-red-400 px-3 rounded-xl text-xs">حذف</button></div></div>').join('')||'لا يوجد';});}
if(t==='allDelivery'){const q=query(ref(db,'users'),orderByChild('role'),equalTo('delivery'),limitToLast(200));onValue(q,s=>{const all=Object.values(s.val()||{}).sort((a,b)=>(b.debt||0)-(a.debt||0));document.getElementById('ac').innerHTML='<h3 class="font-bold text-sm mb-2">كل الدليفري: '+all.length+'</h3>'+all.map(u=>{const debt=u.debt||0;const blocked=u.blocked||debt>=150;return '<div class="glass p-4 rounded-xl mb-3 border '+(blocked?'border-red-500/50 bg-red-500/10':'border-white/10')+'"><div class="font-bold text-sm">'+u.name+' '+(blocked?'🚫':'✅')+'</div><div class="text-xs">📞 '+u.phone+' - 💰 '+debt+'/150ج</div><div class="flex gap-2 mt-3"><button onclick="resetDebt(\''+u.id+'\')" class="flex-1 bg-green-500 text-black py-2 rounded-xl text-xs">💰 صفر</button><button onclick="deleteUser(\''+u.id+'\')" class="bg-red-500/20 text-red-400 px-3 rounded-xl text-xs">🗑️</button></div></div>';}).join('');});}
if(t==='orders'){const q=query(ref(db,'orders'),limitToLast(50));onValue(q,s=>{const all=Object.entries(s.val()||{}).sort((a,b)=>b[1].createdAt-a[1].createdAt);document.getElementById('ac').innerHTML='<h3 class="font-black text-sm">آخر 50 طلب</h3>'+all.map(([k,o])=>'<div class="glass p-3 rounded-xl mb-2"><div class="text-xs">#'+(o.orderNumber||'')+' '+o.text.slice(0,30)+' - '+o.price+'ج - '+o.status+'</div></div>').join('');});}
if(t==='search'){document.getElementById('ac').innerHTML='<div class="glass p-4 rounded-xl"><h3 class="font-black text-sm mb-3">بحث برقم</h3><input id="searchPhone" placeholder="رقم" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm"><button onclick="searchPhone()" class="w-full mt-3 yellow py-3 rounded-xl text-sm">بحث</button><div id="searchResult" class="mt-4"></div></div>';}
};
window.searchPhone=async()=>{const phone=document.getElementById('searchPhone')?.value.trim();if(!phone)return;const q=query(ref(db,'users'),orderByChild('phone'),equalTo(phone));const snap=await new Promise(r=>{onValue(q,s=>r(s),{onlyOnce:true});});const res=document.getElementById('searchResult');if(!snap.exists()){res.innerHTML='مفيش';return;}const users=Object.values(snap.val());res.innerHTML=users.map(u=>'<div class="glass p-4 rounded-xl mb-2"><div class="font-bold text-sm">'+(u.shopName||u.name)+' - '+u.role+'</div><div class="text-xs">📞 '+u.phone+' - 💰 '+(u.debt||0)+'/150ج</div><div class="flex gap-2 mt-2"><button onclick="resetDebt(\''+u.id+'\')" class="flex-1 bg-green-500 text-black py-2 rounded-xl text-xs">صفر</button><button onclick="deleteUser(\''+u.id+'\')" class="bg-red-500/20 px-3 rounded-xl text-xs">حذف</button></div></div>').join('');};
window.approve=async(id)=>{await update(ref(db,'users/'+id),{status:'approved',blocked:false});alert('تم');};
window.deleteUser=async(id)=>{if(!confirm('تحذف؟'))return;await set(ref(db,'users/'+id),null);alert('تم');};
window.resetDebt=async(id)=>{if(!confirm('صفر؟'))return;await update(ref(db,'users/'+id),{debt:0,blocked:false});alert('تم');};
window.exportExcel=async()=>{const snap=await new Promise(r=>{onValue(query(ref(db,'orders'),limitToLast(1000)),s=>r(s),{onlyOnce:true});});const orders=Object.values(snap.val()||{});let csv='رقم,نص,سعر,عمولة,حالة\n';orders.forEach(o=>{csv+=[o.orderNumber||'',(o.text||'').replace(/,/g,' '),o.price||0,o.commission||0,o.status||''].join(',')+'\n';});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='orders.csv';a.click();};
window.logout=()=>{stopLiveTracking();localStorage.clear();currentUser=null;selectedLat=null;selectedLng=null;cart={restaurantId:null,items:[],total:0};renderLanding();
// Company footer injection
setTimeout(()=>{const app=document.getElementById('app');if(app&&app.innerHTML.includes('Super Flash')&&!document.getElementById('companyFooter')){const f=document.createElement('div');f.id='companyFooter';f.className='mt-10 text-center opacity-20 text-[10px] pb-6';f.innerHTML='Super Flash © 2025 - شركة توصيل مصر كلها<br>مصر - القاهرة - الإسكندرية - الدلتا - الصعيد<br>تواصل: 010xxxxxxxx - عمولة 15% - حظر عند 150ج';app.appendChild(f);}},1000);};
render();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js');});}
</script>
