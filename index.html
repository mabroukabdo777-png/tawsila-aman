<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="google" content="notranslate">
<title>توصيلة أمان - تتبع بكود الرحلة لايف</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#d00000;--red2:#ff1a1a;--black:#050505;--card:#0f0f0f;--border:#222}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(900px at 50% -15%, #2a0000 0%, #000 70%);color:#fff;font-family:'Cairo',sans-serif}
#header{position:sticky;top:0;z-index:9999;background:linear-gradient(90deg,#000,#d00000);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(208,0,0,.5)}
#logo{width:54px;height:54px;border-radius:14px;background:#fff;padding:5px;cursor:pointer;object-fit:contain;border:2px solid #fff}
#root{max-width:580px;margin:auto;padding:12px;padding-bottom:130px}
.card{background:linear-gradient(180deg,#111,#0a0a0a);border:1px solid #222;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 10px 25px rgba(0,0,0,.5)}
.card-red{border:1.5px solid var(--red);background:linear-gradient(180deg,#150000,#0a0000)}
.btn{width:100%;border:none;border-radius:14px;padding:13px;font-weight:900;font-family:'Cairo';cursor:pointer}
.btn-red{background:linear-gradient(90deg,#d00000,#ff1a1a);color:#fff;box-shadow:0 8px 24px rgba(208,0,0,.4)}
.btn-black{background:#000;color:#d00000;border:1px solid #d00000}
.btn-green{background:linear-gradient(90deg,#00ff88,#00e676);color:#000}
.role-tabs{display:flex;gap:6px;overflow-x:auto}
.role-btn{flex:1;min-width:78px;padding:8px 4px;border-radius:14px;border:1.5px solid #222;background:#0a0a0a;color:#777;font-weight:900;font-size:11px;text-align:center}
.role-btn.active{border-color:#d00000;background:#1a0000;color:#d00000}
.role-btn img{width:58px;height:42px;object-fit:contain;display:block;margin:0 auto 3px;filter:drop-shadow(0 0 8px rgba(255,0,0,.4))}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #222;background:#080808;color:#fff;margin:6px 0;font-family:'Cairo'}
#real-map{width:100%;height:500px;border-radius:20px;border:3px solid #d00000;display:none;box-shadow:0 12px 30px rgba(208,0,0,.3)}
#priceBox{display:none;text-align:center;background:#160000;border:1px dashed #d00000;border-radius:12px;padding:9px;color:#ff3b3b;font-weight:900;margin:8px 0}
.track-box{background:linear-gradient(90deg,#000,#1a0000);border:2px dashed #ff1a1a;border-radius:16px;padding:10px;margin:10px 0;display:flex;gap:6px;align-items:center}
.track-box input{flex:1;margin:0}
.vehicle-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.vehicle-card{background:#0c0c0c;border:1.5px solid #222;border-radius:16px;padding:8px;text-align:center;cursor:pointer}
.vehicle-card.active{border-color:#d00000;background:#1a0000;transform:scale(1.03);box-shadow:0 0 20px rgba(208,0,0,.4)}
.vehicle-card img{width:100%;height:86px;object-fit:contain}
.driver-item{background:#0e0e0e;border:1px solid #222;border-radius:16px;padding:10px;margin:8px 0;display:flex;gap:10px;align-items:center}
.driver-item.free{border-color:#00ff88} .driver-item.busy{border-color:#d00000}
.driver-item img{width:64px;height:48px;object-fit:contain;border-radius:10px;background:#000;padding:4px}
.emergency{position:fixed;bottom:10px;left:10px;right:10px;z-index:9998;display:flex;gap:6px}
.emergency button{flex:1;padding:11px;border-radius:12px;border:none;font-weight:900;font-size:11px}
#perm{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:18px}
.perm{background:#111;border:2px solid #d00000;border-radius:22px;padding:18px;max-width:380px;text-align:center}
.code-badge{background:linear-gradient(90deg,#d00000,#ff1a1a);color:#fff;padding:6px 14px;border-radius:20px;font-weight:900;font-size:14px;letter-spacing:2px;display:inline-block;margin:6px 0}
</style>
</head>
<body>
<div id="header">
<img id="logo" src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png" alt="logo">
<div style="flex:1;margin:0 10px"><div style="font-weight:900;line-height:1">توصيلة أمان</div><div style="font-size:11px;opacity:.85">تتبع بكود الرحلة لايف - أسمر × أحمر</div></div>
<button id="installBtn" style="display:none;background:#fff;color:#d00000;border:none;border-radius:10px;padding:6px 12px;font-weight:900;font-size:12px" onclick="installApp()">📲 تثبيت</button>
</div>

<div id="perm">
<div class="perm">
<div style="font-size:44px">📍</div>
<h3 style="color:#d00000;margin:8px 0">وافق على فتح موقعك عبر الهاتف</h3>
<p style="color:#999;font-size:12px;line-height:1.7">عشان التتبع المباشر يشتغل بجد - أي حد يقدر يشوف المكنه والتوكتوك رايح فين لايف على الخريطة الحقيقية.</p>
<button class="btn btn-red" onclick="acceptLoc()">✅ موافق - افتح الموقع الآن</button>
</div>
</div>

<div id="root">
<!-- كود تتبع الرحلة - فكرة البنت تبعته لأبوها -->
<div class="track-box">
<input id="trackCodeInput" placeholder="حط كود الرحلة هنا مثلا AMN-123456 لمتابعة لايف">
<button class="btn btn-red" style="width:auto;padding:10px 16px" onclick="trackByCode()">🔍 تتبع الآن لايف</button>
</div>
<div id="trackingInfo" style="display:none" class="card card-red"></div>

<div class="role-tabs">
<button class="role-btn active" id="btn-customer" onclick="setRole('customer')">🧑 عميل</button>
<button class="role-btn" id="btn-tuk" onclick="setRole('tuk')"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">🛺 توكتوك</button>
<button class="role-btn" id="btn-moto" onclick="setRole('moto')"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">🏍️ مكنه</button>
<button class="role-btn" id="btn-car" onclick="setRole('car')"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">🚗 ملاكي</button>
</div>

<div id="real-map"></div>
<div id="priceBox"></div>

<div class="vehicle-grid">
<div class="vehicle-card active" id="card-tuk" onclick="chooseVehicle('tuk')"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"><b>توكتوك فخم</b><br><span style="font-size:10px;color:#ff5555">15 + 5/كم - تتبع لايف</span></div>
<div class="vehicle-card" id="card-moto" onclick="chooseVehicle('moto')"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"><b>مكنه فخمة</b><br><span style="font-size:10px;color:#ff5555">15 + 5/كم - تتبع لايف</span></div>
<div class="vehicle-card" id="card-car" onclick="chooseVehicle('car')"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"><b>ملاكي فخم</b><br><span style="font-size:10px;color:#ff5555">25 + 7/كم - تتبع لايف</span></div>
</div>

<div id="customerArea"></div>
<div id="driverArea"></div>

<div class="emergency">
<button style="background:#d00000;color:#fff" onclick="emergencyCall('police')">🚨 نجدة 122</button>
<button style="background:#ff6a00;color:#fff" onclick="emergencyCall('fire')">🔥 مطافي 180</button>
<button style="background:#fff;color:#d00000" onclick="shareLocation()">📍 موقعي للطوارئ</button>
</div>
</div>

<script type="module">
// Import the functions you need from the SDKs you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, onSnapshot, getDocs, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCFYCnn8bUqSfL619UhNyv3G6Vvkrmp7hk",
  authDomain: "mata3m-masr.firebaseapp.com",
  projectId: "mata3m-masr",
  storageBucket: "mata3m-masr.firebasestorage.app",
  messagingSenderId: "315344044519",
  appId: "1:315344044519:web:2766778ebdec4cf053fd42",
  measurementId: "G-C1273J01LG"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

// عدم ترجمة جوجل نهائيا
document.documentElement.setAttribute('translate','no');

// تثبيت التطبيق
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').style.display='block'; });
window.installApp=async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBtn').style.display='none'; } else alert('دوس ⋮ ثم إضافة إلى الشاشة الرئيسية'); };
if('serviceWorker' in navigator){ navigator.serviceWorker.register('data:text/javascript;base64,'+btoa('self.addEventListener("fetch",e=>{})')); }

let map,myMarker,otherMarker, watchId=null, currentRole='customer', chosenVehicle='tuk', trackingMode=false, trackedOrderId=null, pathLine=null, pathCoords=[];
let currentUser = JSON.parse(localStorage.getItem('tawsila_user_final')||'null') || {id:'user_'+Math.random().toString(36).slice(2,7), role:'customer', name:'', phone:'', address:'', plate:'', vehicleType:'customer'};
localStorage.setItem('tawsila_user_final', JSON.stringify(currentUser));

function calcKm(lat1,lon1,lat2,lon2){
 let R=6371, dLa=(lat2-lat1)*Math.PI/180, dLo=(lon2-lon1)*Math.PI/180;
 let a=Math.sin(dLa/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function generateTripCode(){ return 'AMN-'+Math.floor(100000+Math.random()*900000); }

window.setRole=(role)=>{
 currentRole=role; chosenVehicle=role==='customer'?'tuk':role;
 document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
 document.getElementById('btn-'+(role==='customer'?'customer':role)).classList.add('active');
 render();
};
window.chooseVehicle=(v)=>{ chosenVehicle=v; document.querySelectorAll('.vehicle-card').forEach(c=>c.classList.remove('active')); document.getElementById('card-'+v).classList.add('active'); setRole('customer'); loadDriversForCustomer(); getRealLocation(); };

function render(){
 document.getElementById('customerArea').innerHTML=''; document.getElementById('driverArea').innerHTML='';
 if(currentRole==='customer') renderCustomer(); else renderDriver(currentRole);
}
function renderCustomer(){
 document.getElementById('customerArea').innerHTML=`
 <div class="card card-red">
 <h3 style="margin:0;color:#ff2222">🧑 تسجيل دخول عميل - آمن - تتبع بكود الرحلة</h3>
 <input id="cName" placeholder="اسمك الكامل" value="${currentUser.name||''}">
 <input id="cPhone" placeholder="رقمك - تسجيل آمن" value="${currentUser.phone||''}">
 <input id="cAddr" placeholder="عنوانك - طوخ" value="${currentUser.address||''}">
 <button class="btn btn-red" onclick="login('customer')">🔐 تسجيل دخول عميل</button>
 <p style="font-size:11px;color:#888;margin-top:6px">💰 الدفع بره عند انتهاء الرحلة - كل رحلة ليها كود تبعتيه لأهلك يتابعوكي لايف</p>
 <button class="btn btn-black" onclick="getRealLocation()" style="margin-top:8px">📍 افتح الخريطة الحقيقية - شوف المكنه والتوكتوك فين ورايح فين لايف</button>
 <div id="driverList"></div>
 <div id="myTripCode" style="margin-top:10px"></div>
 </div>`;
 loadDriversForCustomer();
 loadMyTripCode();
}
function renderDriver(type){
 let title=type==='tuk'?'🛺 سائق توكتوك':type==='moto'?'🏍️ سائق مكنه':'🚗 سائق ملاكي';
 document.getElementById('driverArea').innerHTML=`
 <div class="card card-red">
 <h3 style="margin:0;color:#ff2222">${title} - تسجيل آمن - تتبع بكود</h3>
 <input id="dName" placeholder="اسمك - السائق" value="${currentUser.name||''}">
 <input id="dPhone" placeholder="رقمك" value="${currentUser.phone||''}">
 <input id="dAddr" placeholder="عنوانك" value="${currentUser.address||''}">
 <input id="dPlate" placeholder="رقم المركبة" value="${currentUser.plate||''}">
 <button class="btn btn-red" onclick="login('${type}')">🔐 تسجيل دخول سائق</button>
 <div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-black" onclick="setStatus('free')">✅ فاضي</button><button class="btn btn-black" onclick="setStatus('busy')">🛵 في رحلة الآن</button></div>
 <button class="btn btn-black" onclick="getRealLocation()" style="margin-top:8px">📍 شغل التتبع الحقيقي - العميل وأهله شايفينك فين ورايح فين لايف</button>
 <button class="btn btn-green" onclick="endTrip()" style="margin-top:8px">✅ انهاء الرحلة - لازم تدوسه - تتحسب العمولة تلقائيا باسمه ورقمه وعداد</button>
 <div id="myOrders"></div>
 <div style="background:#1a0000;border:1px dashed #d00000;border-radius:12px;padding:8px;margin-top:8px;font-size:11px;color:#ff9a9a">💌 رسالة ترحيب: أهلا بيك يا كابتن! مندوبنا هيتواصل من 9 لـ 11 لتصفية 10% خارج التطبيق</div>
 </div>`;
 loadOrdersForDriver(type);
}

window.login=async(role)=>{
 let name=(document.getElementById('cName')||document.getElementById('dName')).value;
 let phone=(document.getElementById('cPhone')||document.getElementById('dPhone')).value;
 let addr=(document.getElementById('cAddr')||document.getElementById('dAddr')).value;
 let plate=document.getElementById('dPlate')?.value||'';
 if(!name||!phone) return alert('اكتب اسمك ورقمك');
 currentUser={...currentUser, name, phone, address:addr, plate, role, vehicleType:role, id:currentUser.id};
 localStorage.setItem('tawsila_user_final', JSON.stringify(currentUser));
 await setDoc(doc(db, role==='customer'?'customers':'drivers', currentUser.id), {...currentUser, createdAt:serverTimestamp(), status:'free', ordersCount:0, totalCommission:0, totalEarn:0}, {merge:true});
 if(role!=='customer') alert(`أهلا بيك يا ${name}!\nمندوبنا هيتواصل من 9 لـ 11 لتصفية عمولة 10% - هنبرن عليك ${phone}`);
 render();
};

async function loadMyTripCode(){
 let orderId=localStorage.getItem('currentOrder'); if(!orderId) return;
 let snap=await getDocs(collection(db,'orders'));
 snap.forEach(d=>{ if(d.id===orderId){ let o=d.data(); if(o.tripCode){ document.getElementById('myTripCode').innerHTML=`<div class="card" style="background:#000;border:2px solid #00ff88"><p>🔑 كود رحلتك الحالي:</p><span class="code-badge">${o.tripCode}</span><br><button class="btn btn-green" onclick="shareTripCode('${o.tripCode}')" style="margin-top:8px">📤 ابعت كود الرحلة لأبوك أو أهلك على واتساب - يتابعوكي لايف فين ورايحة فين</button><br><span style="font-size:11px;color:#888">أبوك يحط الكود فوق الخريطة يظهرله حقيقي مباشر بيتحرك رايح فين</span></div>`; } } });
}
window.shareTripCode=(code)=>{
 let url=`https://mabr.github.io/tawsila-aman/?code=${code}`;
 let text=`🚗 تابع رحلتي لايف على توصيلة أمان - كود الرحلة: ${code} - افتح الرابط وحط الكود فوق الخريطة هتشوفني فين ورايحة فين مباشر: ${url}`;
 window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
};

async function loadDriversForCustomer(){
 let snap=await getDocs(collection(db,'drivers'));
 let html=`<h4 style="color:#ff2222;margin:10px 0">كل كابتن صورة المركبة قدامه - دوس يظهر الخريطة الحقيقية - اخترت: ${chosenVehicle} - شايف المكنه بقت فين ورايحة فين</h4>`;
 snap.forEach(d=>{
  let dr=d.data();
  if(dr.vehicleType===chosenVehicle){
   let statusClass=dr.status==='free'?'free':'busy';
   let statusText=dr.status==='free'?'✅ فاضي حاليا':'🛵 في رحلة الآن';
   html+=`<div class="driver-item ${statusClass}"><div style="width:64px;height:48px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px">${dr.vehicleType==='tuk'?'🛺':dr.vehicleType==='moto'?'🏍️':'🚗'}</div><div style="flex:1"><b>${dr.name}</b> - ${dr.vehicleType}<br>📞 ${dr.phone} - 📍 ${dr.address||''}<br><span style="font-size:11px;padding:3px 8px;border-radius:20px;background:${dr.status==='free'?'#00ff88':'#d00000'};color:${dr.status==='free'?'#000':'#fff'}">${statusText}</span></div><button class="btn btn-red" style="width:auto;padding:8px 14px" onclick="requestRide('${dr.id}','${dr.vehicleType}')">اطلب</button></div>`;
  }
 });
 document.getElementById('driverList').innerHTML=html||'<div class="card">مفيش سائقين من النوع ده - سجل كسائق الأول</div>';
}

window.requestRide=async(driverId, vehicleType)=>{
 let tripCode=generateTripCode();
 let order={id:'order_'+Date.now(), tripCode, customerId:currentUser.id, customerName:currentUser.name, customerPhone:currentUser.phone, customerAddress:currentUser.address, driverId, vehicleType, status:'searching', km:window.currentKm||0, price:window.currentPrice||0, createdAt:serverTimestamp()};
 await setDoc(doc(db,'orders', order.id), order); 
 localStorage.setItem('currentOrder', order.id); 
 localStorage.setItem('currentTripCode', tripCode);
 alert(`✅ طلبت ${vehicleType} - كود رحلتك: ${tripCode}\nابعت الكود لأهلك يتابعوكي لايف فين ورايحة فين\nالخريطة شغالة بجد تتبع حقيقي - أي حد يقدر يشوف المكنه بقت فين`);
 loadMyTripCode();
 getRealLocation();
};

// تتبع بكود الرحلة - البنت تبعته لأبوها وأبوها يحط الكود فوق الخريطة يظهرله حقيقي مباشر
window.trackByCode=async()=>{
 let code=document.getElementById('trackCodeInput').value.trim().toUpperCase();
 if(!code) return alert('حط كود الرحلة مثلا AMN-123456');
 let q=query(collection(db,'orders'), where('tripCode','==',code));
 let snap=await getDocs(q);
 if(snap.empty){ alert('كود الرحلة مش موجود - اتأكد من الكود'); return; }
 snap.forEach(d=>{
  let o=d.data();
  trackedOrderId=o.id; trackingMode=true;
  document.getElementById('trackingInfo').style.display='block';
  document.getElementById('trackingInfo').innerHTML=`<p>🔍 بتتابع كود: <span class="code-badge">${code}</span></p><p>👤 العميل: ${o.customerName} - ${o.customerPhone}<br>🛺 السائق: ${o.vehicleType} - ${o.driverId}<br>📍 الخريطة شغالة بجد تتبع حقيقي لايف - شايف المكنه/التوكتوك فين ورايح فين</p><button class="btn btn-black" onclick="stopTracking()">⏹️ ايقاف التتبع</button>`;
  document.getElementById('real-map').style.display='block';
  document.getElementById('priceBox').style.display='block';
  // ابدأ تتبع مباشر للاوردر ده
  onSnapshot(collection(db,'liveLocations'), lsnap=>{
   lsnap.forEach(ld=>{
    let loc=ld.data();
    if(loc.orderId===o.id){
     if(!map){ map=L.map('real-map').setView([loc.lat,loc.lng],16); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); myMarker=L.marker([loc.lat,loc.lng]).addTo(map).bindPopup('المركبة بتتحرك لايف').openPopup(); pathCoords=[]; pathLine=L.polyline([], {color:'#d00000', weight:4}).addTo(map); }
     pathCoords.push([loc.lat,loc.lng]); pathLine.setLatLngs(pathCoords);
     myMarker.setLatLng([loc.lat,loc.lng]).bindPopup(`🛺 ${loc.vehicleType} بيتحرك لايف<br>📍 ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}<br>كود: ${code}`).openPopup();
     map.panTo([loc.lat,loc.lng]);
     document.getElementById('priceBox').innerHTML=`🔍 تتبع كود ${code} - المركبة بتتحرك لايف - آخر تحديث: ${new Date().toLocaleTimeString('ar-EG')} - المسار: ${pathCoords.length} نقطة - فين ورايحة فين`;
    }
   });
  });
 });
};
window.stopTracking=()=>{ trackingMode=false; trackedOrderId=null; document.getElementById('trackingInfo').style.display='none'; pathCoords=[]; if(pathLine) map.removeLayer(pathLine); };

    let km=calcKm(p.coords.latitude,p.coords.longitude,o.lat,o.lng); let price=(currentRole==='car'||o.vehicleType==='car'||chosenVehicle==='car')?(25+km*7):(15+km*5);

   }
  });
 });
}
