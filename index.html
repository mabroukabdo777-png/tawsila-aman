<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate"><meta name="robots" content="notranslate">
<title>توصيلة أمان - خريطة حقيقية تتبع مباشر</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
html{translate:no!important}.notranslate{translate:no!important}.goog-te-banner-frame{display:none!important}
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:'Cairo',sans-serif}
#header{background:linear-gradient(90deg,#000,#8a0000 50%,#d00000 100%);padding:14px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10000;border-bottom:2px solid #d00000}
#logo{width:64px;height:64px;border-radius:16px;background:#111;padding:6px;cursor:pointer;object-fit:contain;border:2px solid #ff4444}
#root{max-width:600px;margin:auto;padding:0;padding-bottom:140px;background:#000}
#real-map{width:100%;height:380px;border-top:2px solid #d00000;border-bottom:2px solid #d00000;display:block;position:relative;z-index:1}
.vehicle-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#000}
.vehicle-card{background:linear-gradient(180deg,#111,#050505);border:1.5px solid #333;border-radius:18px;padding:10px;text-align:center;cursor:pointer}
.vehicle-card.active{border-color:#ff4400;background:#1a0000;box-shadow:0 0 20px rgba(255,68,0,.4);transform:scale(1.02)}
.vehicle-card img{width:100%;height:78px;object-fit:contain}
.role-tabs{display:flex;gap:6px;padding:0 10px;margin-top:10px}
.role-btn{flex:1;padding:8px 4px;border-radius:14px;border:1.5px solid #333;background:#0a0a0a;color:#777;font-weight:900;font-size:11px;text-align:center;cursor:pointer}
.role-btn.active{border-color:#d00000;background:#1a0000;color:#d00000}
.card{background:#111;border:1px solid #222;border-radius:20px;padding:14px;margin:10px}
.card-red{border:1.5px solid #d00000;background:#150000}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font-weight:900;font-family:'Cairo';cursor:pointer;font-size:15px}
.btn-red{background:linear-gradient(90deg,#d00000,#ff1a1a);color:#fff}
.btn-black{background:#000;color:#d00000;border:1px solid #d00000}
.btn-green{background:#00ff88;color:#000}
.btn-orange{background:#ff6a00;color:#fff}
input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #333;background:#080808;color:#fff;margin:7px 0;font-family:'Cairo';font-size:14px}
.file-input{background:#111;border:1.5px dashed #d00000;padding:10px;border-radius:14px;margin:7px 0;display:block;cursor:pointer;text-align:center}
.file-input input{display:none}
.emergency{position:fixed;bottom:0;left:0;right:0;z-index:9998;display:flex;gap:8px;padding:10px;background:linear-gradient(180deg,transparent,#000)}
.emergency button{flex:1;padding:12px;border-radius:14px;border:none;font-weight:900;font-size:13px;cursor:pointer}
.code-badge{background:#d00000;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900;display:inline-block;margin:6px 0;font-size:18px}
.preview-img{width:100%;max-height:140px;object-fit:contain;border-radius:12px;border:1px solid #333;margin-top:6px;display:none}
.track-box{background:linear-gradient(180deg,#0a0a0a,#000);border:2px solid #d00000;border-radius:20px;padding:16px;margin:10px;box-shadow:0 0 30px rgba(208,0,0,.3)}
.driver-item{cursor:pointer;border:2px solid #222;transition:all.2s}
.driver-item:hover{border-color:#00ff88;transform:scale(1.02)}
.driver-item.selected{border-color:#d00000;background:#1a0000;box-shadow:0 0 15px rgba(208,0,0,.4)}
</style>
<script>document.documentElement.setAttribute('translate','no');document.documentElement.classList.add('notranslate');</script>
</head>
<body>
<div id="header">
<div style="flex:1;text-align:right">
<div style="font-weight:900;font-size:20px;line-height:1.1">توصيلة أمان</div>
<div style="font-size:12px;opacity:.9">خريطة حقيقية - تتبع مباشر - مصر كلها</div>
</div>
<button id="installBtn" style="display:none;background:#fff;color:#d00000;border:none;border-radius:10px;padding:8px 14px;font-weight:900;font-size:13px;margin-left:8px;cursor:pointer">📲 تثبيت</button>
<img id="logo" src="https://cdn.fbsbx.com/v/t65.102178-21/808564422_1461284129166123_5087545650242094510_n.jpg/logo-tawsila-aman.png" alt="logo">
</div>
<div id="root">
<div id="real-map"></div>
<div class="track-box">
<h3 style="margin:0 0 10px;color:#ff2222;text-align:center">🔑 تتبع بكود الرحلة + خريطة حقيقية تتبع مباشر</h3>
<div style="display:flex;gap:8px">
<input id="trackCodeInput" placeholder="دخل كود الرحلة AMN-123456" style="flex:1;font-size:18px;text-align:center;letter-spacing:2px">
<button class="btn btn-red" style="width:auto;padding:14px 22px" onclick="trackByCode()">🔍 تتبع لايف</button>
</div>
<p style="font-size:11px;color:#888;margin:8px 0 0;text-align:center">الأب يدوس الكود يجبله بنته فين بالظبط ورايحة فين لايف - حتى لو الكابتن فاضي يدوس عليه يجيله موقعه مباشر</p>
<div id="trackingInfo" style="display:none;margin-top:10px" class="card card-red"></div>
<div id="liveStatus" style="display:none;margin-top:10px" class="card"></div>
</div>
<div class="vehicle-grid">
<div class="vehicle-card" id="card-car" onclick="chooseVehicle('car')"><img src="https://cdn.fbsbx.com/v/t65.102178-21/808450239_1591608392703122_3156409658034779678_n.jpg/car-luxury.png"><b>ملاكي</b><span>25 + 7/كم</span></div>
<div class="vehicle-card" id="card-moto" onclick="chooseVehicle('moto')"><img src="https://cdn.fbsbx.com/v/t65.102178-21/807083479_1777467790153005_429861216672035121_n.jpg/moto-luxury.png"><b>مكنه</b><span>15 + 5/كم</span></div>
<div class="vehicle-card active" id="card-tuk" onclick="chooseVehicle('tuk')"><img src="https://cdn.fbsbx.com/v/t65.102178-21/808461794_988848264228611_5102588120439965276_n.jpg/tuktuk-luxury.png"><b>توكتوك</b><span>15 + 5/كم</span></div>
</div>
<div class="role-tabs">
<button class="role-btn active" id="btn-customer" onclick="setRole('customer')">🧑 عميل - اطلب كابتن</button>
<button class="role-btn" id="btn-tuk" onclick="setRole('tuk')">🧑‍✈️ كابتن توكتوك</button>
<button class="role-btn" id="btn-moto" onclick="setRole('moto')">🧑‍✈️ كابتن دليفري</button>
<button class="role-btn" id="btn-car" onclick="setRole('car')">🧑‍✈️ كابتن عربية</button>
</div>
<div id="recaptcha-container"></div>
<div id="customerArea"></div>
<div id="driverArea"></div>
<div class="emergency">
<button style="background:#111;color:#ff6a00;border:1px solid #333" onclick="shareLocation()">📍 طوارئ</button>
<button style="background:#ff6a00;color:#fff" onclick="emergencyCall('fire')">🔥 180</button>
<button style="background:#d00000;color:#fff" onclick="emergencyCall('police')">🚨 122</button>
</div>
</div>
<script>
let map,myMarker,watchId=null,currentRole='customer',chosenVehicle='tuk',pathLine=null,pathCoords=[],clicks=0,lastClick=0,isPhoneVerified=false,verifiedPhone='',trackingInterval=null,currentTrackingCode='',driverMarkers={},selectedDriverId=null;
let currentUser=JSON.parse(localStorage.getItem('tawsila_user_final')||'null')||{id:'user_'+Math.random().toString(36).slice(2,7),name:'',phone:'',idNumber:'',address:'',addressDetail:'',plate:'',carLicense:'',driverLicense:'',vehiclePhoto:'',idPhoto:'',carLicensePhoto:'',driverLicensePhoto:'',role:'customer',vehicleType:'customer',blocked:false,phoneVerified:false,status:'free',lat:30.0444,lng:31.2357};
localStorage.setItem('tawsila_user_final',JSON.stringify(currentUser));
function generateTripCode(){return 'AMN-'+Math.floor(100000+Math.random()*900000);}
function requestLocationAutoImmediate(){
 if(!navigator.geolocation) return;
 navigator.geolocation.getCurrentPosition(pos=>{
  startTracking(pos);
  if(currentTrackingCode&&window.saveLocationFirebase) window.saveLocationFirebase(pos);
  if(currentUser.role!=='customer'){
    currentUser.lat=pos.coords.latitude;currentUser.lng=pos.coords.longitude;
    localStorage.setItem('tawsila_user_final',JSON.stringify(currentUser));
    let drivers=JSON.parse(localStorage.getItem('all_drivers')||'[]');
    let idx=drivers.findIndex(d=>d.id===currentUser.id);
    if(idx>=0){drivers[idx].lat=pos.coords.latitude;drivers[idx].lng=pos.coords.longitude;drivers[idx].status=currentUser.status||'free';localStorage.setItem('all_drivers',JSON.stringify(drivers));}
  }
  updateFreeCaptainsOnMap();
 },err=>{if(err.code===1){setTimeout(()=>{requestLocationAutoImmediate();},3000);}if(!map){initRealMap(30.0444,31.2357);}}, {enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
window.addEventListener('load',()=>{setTimeout(requestLocationAutoImmediate,500);setTimeout(requestLocationAutoImmediate,2000);setTimeout(updateFreeCaptainsOnMap,3000);});
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;let btn=document.getElementById('installBtn');if(btn) btn.style.display='block';});
document.getElementById('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none';}});
function handleFile(inputId,previewId,field){
 let input=document.getElementById(inputId);let file=input.files[0];if(!file) return;
 let reader=new FileReader();
 reader.onload=function(e){currentUser[field]=e.target.result;localStorage.setItem('tawsila_user_final',JSON.stringify(currentUser));let prev=document.getElementById(previewId);if(prev){prev.src=e.target.result;prev.style.display='block';}};
 reader.readAsDataURL(file);
}
window.setRole=function(role){
 currentRole=role;chosenVehicle=role==='customer'?'tuk':role;
 document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
 let btn=document.getElementById('btn-'+(role==='customer'?'customer':role));if(btn) btn.classList.add('active');
 document.querySelectorAll('.vehicle-card').forEach(c=>c.classList.remove('active'));
 let card=document.getElementById('card-'+chosenVehicle);if(card) card.classList.add('active');
 render();updateFreeCaptainsOnMap();
};
window.chooseVehicle=function(v){chosenVehicle=v;document.querySelectorAll('.vehicle-card').forEach(c=>c.classList.remove('active'));document.getElementById('card-'+v).classList.add('active');setRole('customer');};
function render(){
 document.getElementById('customerArea').innerHTML='';document.getElementById('driverArea').innerHTML='';
 if(currentRole==='customer') renderCustomer(); else renderDriver(currentRole);
}
function renderCustomer(){
 let drivers=JSON.parse(localStorage.getItem('all_drivers')||'[]');
 let freeDrivers=drivers.filter(d=>!d.blocked&&d.status==='free'&&d.vehicleType===chosenVehicle);
 if(freeDrivers.length===0) freeDrivers=drivers.filter(d=>!d.blocked&&d.status==='free');
 document.getElementById('customerArea').innerHTML=`
 <div class="card card-red">
 <h3 style="margin:0;color:#ff2222">🧑 عميل - اطلب كابتن فاضي - دوس عليه يجيله موقعه مباشر وبيتحرك ${isPhoneVerified?'✅ موثق':''}</h3>
 <p style="font-size:11px;color:#00ff88;margin:4px 0">🗺️ الخريطة حقيقية 100% - تتبع مباشر - الكابتن الفاضي بيظهر على الخريطة وبيتحرك لايف</p>
 <input id="cName" placeholder="الاسم الحقيقي بالكامل" value="${currentUser.name||''}">
 <div style="background:linear-gradient(180deg,#001a00,#000);border:1.5px solid #00ff88;border-radius:14px;padding:10px;margin:8px 0">
   <input id="phoneInput" placeholder="الرقم الحقيقي - 010xxxxxxxx" value="${currentUser.phone||''}">
   <button class="btn btn-green" style="padding:10px" onclick="sendOTP()">📲 ابعت كود OTP حقيقي</button>
   <div id="otpInputDiv" style="display:none;margin-top:8px">
     <input id="otpCode" placeholder="كود OTP اللي جالك SMS">
     <button class="btn btn-orange" style="padding:10px" onclick="verifyOTP()">✅ تأكيد الكود</button>
   </div>
   <div id="otpStatus" style="font-size:11px;margin-top:6px;color:#00ff88">${isPhoneVerified?'✅ تم تأكيد رقمك: '+verifiedPhone:''}</div>
 </div>
 <input id="cAddr" placeholder="العنوان بالتفصيل" value="${currentUser.addressDetail||''}">
 <button class="btn btn-red" onclick="login('customer')" ${!isPhoneVerified?'disabled style="opacity:.5"':''}>🔐 تسجيل دخول عميل</button>
 <h4 style="color:#00ff88;margin:12px 0 6px">🧑‍✈️ الكباتن الفاضيين - دوس على الكابتن يجيلك موقعه مباشر</h4>
 <div id="freeCaptainsList">
 ${freeDrivers.length?freeDrivers.map(d=>`
   <div class="card driver-item ${selectedDriverId===d.id?'selected':''}" onclick="selectFreeCaptain('${d.id}')">
     <div style="display:flex;gap:10px;align-items:center">
       ${d.vehiclePhoto?`<img src="${d.vehiclePhoto}" style="width:70px;height:52px;object-fit:contain;border-radius:10px;background:#000;padding:4px">`:`<div style="width:70px;height:52px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center">🧑‍✈️</div>`}
       <div style="flex:1">
         <b>🧑‍✈️ كابتن ${d.name} - ${d.vehicleType==='car'?'عربية':d.vehicleType==='moto'?'دليفري':'توكتوك'}</b><br>
         <span style="font-size:11px;color:#00ff88">✅ فاضي - دوس يجيلك موقعه مباشر وبيتحرك</span><br>
         <span style="font-size:11px;color:#888">📞 ${d.phone}</span><br>
         <span style="font-size:10px;color:#ff6a00">📍 ${d.lat?d.lat.toFixed(4)+','+d.lng.toFixed(4):'على الخريطة لايف'} - بيتحرك على فين</span>
       </div>
       <div style="background:#00ff88;color:#000;padding:6px 10px;border-radius:12px;font-weight:900;font-size:11px">📍 تتبع مباشر</div>
     </div>
   </div>
 `).join(''):`<div class="card">مفيش كباتن فاضيين دلوقتي من نوع ${chosenVehicle}</div>`}
 </div>
 <button class="btn btn-black" onclick="updateFreeCaptainsOnMap()" style="margin-top:8px">🔄 حدث الكباتن الفاضيين على الخريطة - خريطة حقيقية</button>
 <div id="myTripCode"></div>
 </div>`;
 loadTripCode();updateFreeCaptainsOnMap();
}
function renderDriver(type){
 let isCar=type==='car';
 let title=type==='tuk'?'🧑‍✈️ كابتن توكتوك':type==='moto'?'🧑‍✈️ كابتن دليفري':'🧑‍✈️ كابتن عربية';
 document.getElementById('driverArea').innerHTML=`
 <div class="card card-red">
 <h3 style="margin:0;color:#ff2222">${title} - خريطة حقيقية تتبع مباشر ${isPhoneVerified?'✅ موثق':''}</h3>
 <input id="dName" placeholder="اسم الكابتن الحقيقي" value="${currentUser.name||''}">
 <div style="background:linear-gradient(180deg,#001a00,#000);border:1.5px solid #00ff88;border-radius:14px;padding:10px;margin:8px 0">
   <input id="phoneInput" placeholder="رقم الكابتن الحقيقي" value="${currentUser.phone||''}">
   <button class="btn btn-green" style="padding:10px" onclick="sendOTP()">📲 ابعت كود OTP للكابتن</button>
   <div id="otpInputDiv" style="display:none;margin-top:8px">
     <input id="otpCode" placeholder="كود OTP">
     <button class="btn btn-orange" style="padding:10px" onclick="verifyOTP()">✅ تأكيد كود الكابتن</button>
   </div>
   <div id="otpStatus" style="font-size:11px;margin-top:6px;color:#00ff88">${isPhoneVerified?'✅ تم تأكيد رقم الكابتن: '+verifiedPhone:''}</div>
 </div>
 <input id="dIdNumber" placeholder="رقم بطاقة الكابتن - 14 رقم" value="${currentUser.idNumber||''}">
 <input id="dAddr" placeholder="عنوان الكابتن بالتفصيل" value="${currentUser.addressDetail||''}">
 <label class="file-input">📸 صورة مركبة الكابتن
   <input type="file" id="vehiclePhotoInput" accept="image/*" onchange="handleFile('vehiclePhotoInput','vehiclePreview','vehiclePhoto')">
   <img id="vehiclePreview" class="preview-img" src="${currentUser.vehiclePhoto||''}" style="${currentUser.vehiclePhoto?'display:block':''}">
 </label>
 <label class="file-input">🪪 صورة بطاقة الكابتن
   <input type="file" id="idPhotoInput" accept="image/*" onchange="handleFile('idPhotoInput','idPreview','idPhoto')">
   <img id="idPreview" class="preview-img" src="${currentUser.idPhoto||''}" style="${currentUser.idPhoto?'display:block':''}">
 </label>
 ${isCar?`
 <label class="file-input">🚗 رخصة العربية
   <input type="file" id="carLicensePhotoInput" accept="image/*" onchange="handleFile('carLicensePhotoInput','carLicensePreview','carLicensePhoto')">
   <img id="carLicensePreview" class="preview-img" src="${currentUser.carLicensePhoto||''}" style="${currentUser.carLicensePhoto?'display:block':''}">
 </label>
 <input id="dCarLicense" placeholder="رقم رخصة العربية" value="${currentUser.carLicense||''}">
 <label class="file-input">🪪 رخصة الكابتن
   <input type="file" id="driverLicensePhotoInput" accept="image/*" onchange="handleFile('driverLicensePhotoInput','driverLicensePreview','driverLicensePhoto')">
   <img id="driverLicensePreview" class="preview-img" src="${currentUser.driverLicensePhoto||''}" style="${currentUser.driverLicensePhoto?'display:block':''}">
 </label>
 <input id="dDriverLicense" placeholder="رقم رخصة الكابتن" value="${currentUser.driverLicense||''}">
 `:`
 <input id="dPlate" placeholder="رقم مركبة الكابتن" value="${currentUser.plate||''}">
 `}
 <button class="btn btn-red" onclick="login('${type}')" ${!isPhoneVerified?'disabled style="opacity:.5"':''}>🔐 تسجيل دخول كابتن - يظهر على الخريطة الحقيقية فاضي</button>
 <div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-black" onclick="setStatus('free')">✅ فاضي - اظهر على الخريطة</button><button class="btn btn-black" onclick="setStatus('busy')">🛵 في رحلة الآن</button></div>
 <button class="btn btn-green" onclick="startTripWithCode()" style="margin-top:8px">🚀 ابدأ الرحلة بكود تتبع - ابعته لأهلك</button>
 <button class="btn btn-black" onclick="endTrip()" style="margin-top:8px">✅ انهاء الرحلة - العمولة 10%</button>
 </div>`;
}
window.login=function(role){
 if(!isPhoneVerified){alert('فعل رقمك بـ OTP الأول');return;}
 let name=(document.getElementById('cName')||document.getElementById('dName')).value.trim();
 let phone=verifiedPhone||document.getElementById('phoneInput')?.value;
 let addr=(document.getElementById('cAddr')||document.getElementById('dAddr')).value.trim();
 let idNumber=document.getElementById('dIdNumber')?.value||'';
 let plate=document.getElementById('dPlate')?.value||'';
 let carLicense=document.getElementById('dCarLicense')?.value||'';
 let driverLicense=document.getElementById('dDriverLicense')?.value||'';
 if(!name){alert('اكتب الاسم');return;}
 if(role!=='customer'&&!idNumber){alert('اكتب رقم البطاقة');return;}
 if(role!=='customer'&&!currentUser.vehiclePhoto){alert('حمل صورة المركبة');return;}
 if(role==='car'&&(!carLicense||!driverLicense)){alert('كابتن العربية لازم رخصة العربية ورخصة الكابتن');return;}
 let lat=currentUser.lat||30.0444;let lng=currentUser.lng||31.2357;
 if(myMarker){let ll=myMarker.getLatLng();lat=ll.lat;lng=ll.lng;}
 currentUser={...currentUser,name,phone,address:addr,addressDetail:addr,idNumber,plate,carLicense,driverLicense,role,vehicleType:role,blocked:false,phoneVerified:true,status:'free',lat,lng};
 localStorage.setItem('tawsila_user_final',JSON.stringify(currentUser));
 let drivers=JSON.parse(localStorage.getItem('all_drivers')||'[]');let customers=JSON.parse(localStorage.getItem('all_customers')||'[]');
 if(role==='customer'){customers=customers.filter(c=>c.id!==currentUser.id);customers.push({...currentUser});localStorage.setItem('all_customers',JSON.stringify(customers));}
 else{drivers=drivers.filter(d=>d.id!==currentUser.id);drivers.push({...currentUser});localStorage.setItem('all_drivers',JSON.stringify(drivers));}
 alert('✅ تم تسجيل كابتن '+name+' - يظهر على الخريطة الحقيقية فاضي');
 if(window.saveToFirebase) window.saveToFirebase(role);
 render();updateFreeCaptainsOnMap();
};
function loadTripCode(){let code=localStorage.getItem('currentTripCode');if(code){let el=document.getElementById('myTripCode');if(el) el.innerHTML=`<div class="card" style="border:2px solid #00ff88"><p>🔑 كود رحلتك الحالي:</p><span class="code-badge">${code}</span><br><button class
