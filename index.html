import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";

const firebaseConfig = {
  apiKey: "AIzaSyCFYCnn8bUqSfL619UhNyv3G6Vvkrmp7hk",

};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);
console.log("Firebase مربوط ✅");
// ===== كود موقع حقيقي + منع ترجمة =====
document.documentElement.setAttribute('translate','no');
document.documentElement.classList.add('notranslate');
document.body.classList.add('notranslate');
let lCss=document.createElement('link');
lCss.rel='stylesheet'; lCss.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
document.head.appendChild(lCss);
let lJs=document.createElement('script');
lJs.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
document.head.appendChild(lJs);
    function getRealLocation(){
 if(!localStorage.getItem('locAsked')){
  if(confirm("التطبيق محتاج موقعك الحالي عشان التتبع المباشر - دوس موافق لتفعيل الموقع")){
   localStorage.setItem('locAsked','yes');
  }
 }
 navigator.geolocation.watchPosition(p=>{
  window.currentUserLocation={lat:p.coords.latitude,lng:p.coords.longitude};
  localStorage.setItem("userLocation", JSON.stringify(window.currentUserLocation));
  console.log("✅ موقعك:",window.currentUserLocation);
  if(window.drawMap) window.drawMap(p);
 }, e=>console.log("فعل الموقع من الاعدادات"), {enableHighAccuracy:true,maximumAge:0,timeout:15000});

 let mapDiv=document.getElementById('real-map');
 if(!mapDiv){
   mapDiv=document.createElement('div');
  mapDiv.id='real-map';
  mapDiv.style.position='relative';
  mapDiv.style.width='95%';
  mapDiv.style.height='200px';
  mapDiv.style.margin='10px auto';
  mapDiv.style.display='block';
  mapDiv.style.borderRadius='15px';
  mapDiv.style.border='3px solid #ff7700';
  mapDiv.style.zIndex='1';
  let parent=document.getElementById('root');
  if(parent) parent.prepend(mapDiv);
 }
    }     
        
let map, myMarker, otherMarker, restaurantMarkers=[];
function calcKm(lat1,lon1,lat2,lon2){
 let R=6371, dLa=(lat2-lat1)*Math.PI/180, dLo=(lon2-lon1)*Math.PI/180;
 let a=Math.sin(dLa/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function drawMap(p){
 if(!window.L) return;
 let orderId=new URLSearchParams(location.search).get('order')||localStorage.getItem('currentOrder')||'order'+Date.now();
 localStorage.setItem('currentOrder',orderId);
 let isDelivery=location.search.includes('delivery');
 let isCustomer=!isDelivery;
 if(!map){
  map=L.map('real-map',{zoomControl:true}).setView([p.coords.latitude,p.coords.longitude],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  myMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup(isDelivery?'انت (الدليفري)':'انت (العميل)').openPopup();
  otherMarker=L.marker([p.coords.latitude+0.001,p.coords.longitude+0.001]).addTo(map);
  let priceDiv=document.createElement('div'); priceDiv.id='delivery-price';
  priceDiv.style.textAlign='center'; priceDiv.style.color='#ff7700'; priceDiv.style.fontWeight='bold'; priceDiv.style.margin='8px';
  priceDiv.innerHTML='جاري حساب المسافة...';
  document.getElementById('real-map').after(priceDiv);
 }
 let priceDiv=document.getElementById('delivery-price');
 // كل عميل مع الدليفري بتاعه بس - orderId
 if(isDelivery){
  // الدليفري يبعت مكانه لايف
  // هنا هنستخدم localStorage مؤقتا لحد ما نربط Firebase
  localStorage.setItem('deliveryLoc',JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude}));
  let cust=JSON.parse(localStorage.getItem('customerLoc')||'{"lat":30.355,"lng":31.039}');
  let km=calcKm(p.coords.latitude,p.coords.longitude,cust.lat,cust.lng);
  let price=15+km*5;
  if(priceDiv) priceDiv.innerHTML=`📍 مكان العميل لايف - على بعد ${km.toFixed(1)}كم - التوصيل ${price.toFixed(0)}ج - عمولتي ${(price*0.1).toFixed(0)}ج`;
  otherMarker.setLatLng([cust.lat,cust.lng]).bindPopup('مكان العميل لايف');
  window.currentKm=km; window.currentPrice=price;
 }else{
  localStorage.setItem('customerLoc',JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude}));
  let del=JSON.parse(localStorage.getItem('deliveryLoc')||'{"lat":30.356,"lng":31.04}');
