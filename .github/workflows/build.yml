name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter create . --platforms=android --org com.tawsila.aman --project-name tawsila_aman || true
      - run: |
          mkdir -p android/app
          if [ -f google-services.json ]; then cp google-services.json android/app/; fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tawsila-aman-apk
          path: build/app/outputs/flutter-apk/app-release.apk
