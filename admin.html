<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>المالك - مطعمي</title></head><body style="font-family:Tahoma;padding:16px">
<h2>👑 لوحة المالك - مطعمي soqshpin</h2>
<div id="list">جاري تحميل الطلبات الحقيقية...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB0eHMekVj3hxInK2n1HfBEjEshGp2njpg",
  authDomain: "soqshpin.firebaseapp.com",
  databaseURL: "https://soqshpin-default-rtdb.firebaseio.com",
  projectId: "soqshpin",
  storageBucket: "soqshpin.firebasestorage.app",
  messagingSenderId: "282224755647",
  appId: "1:282224755647:web:deb4a22bcb7274c8b1570a"
};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const q=query(collection(db,"orders"), orderBy("timestamp","desc"));
onSnapshot(q,(snap)=>{
 document.getElementById('list').innerHTML=snap.docs.map(d=>{
  const o=d.data();
  return `<div style="border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0"><b>${o.restaurant_name}</b> - ${o.meal_name}<br>👤 ${o.client_name} - ${o.client_phone}<br>📍 ${o.client_address}<br>📏 ${o.distance?.toFixed(2)}كم - ${o.delivery_fee?.toFixed(2)}ج - إجمالي ${o.total_price?.toFixed(2)}ج<br><small>${o.created_at}</small></div>`;
 }).join('')||'لا يوجد طلبات';
});
</script>
</body></html>
