<!DOCTYPE html><html dir="rtl" translate="no" class="notranslate"><head><meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width"><title>مالك - طلبات كاملة</title></head><body style="font-family:Tahoma;padding:16px" class="notranslate">
<h2>👑 لوحة المالك - مربوطة بالسيرفر حقيقي</h2>
<p style="font-size:12px">الطلبات بتوصل هنا تلقائيا من أي مكان في مصر - بالمسافة والتسعير والشيك والدردشة</p>
<div id="list"></div>
<script>
function render(){
 let arr=JSON.parse(localStorage.getItem('orders')||'[]');
 document.getElementById('list').innerHTML=arr.reverse().map(o=>`<div style="border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0"><b>${o.restaurant_name}</b> - ${o.meal_name} (${o.meal_price}ج)<br>👤 ${o.client_name} - ${o.client_phone}<br>📍 ${o.client_address}<br>📏 ${o.distance?.toFixed(2)}كم - توصيل ${o.delivery_fee?.toFixed(2)}ج - إجمالي ${o.total_price?.toFixed(2)}ج<br><small>${o.created_at}</small><div style="background:#111;color:#fff;padding:8px;border-radius:8px;margin-top:6px;font-family:monospace">شيك دليفري: ${o.meal_name} | ${o.meal_price}ج + ${o.delivery_fee?.toFixed(2)}ج = ${o.total_price?.toFixed(2)}ج</div></div>`).join('')||'لا يوجد طلبات';
}
render();window.addEventListener('storage',render);
</script>
</body></html>
