function haversine(lat1,lon1,lat2,lon2){const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
async function getRealRoadDistance(lat1,lon1,lat2,lon2){
  try{
    const url='https://router.project-osrm.org/route/v1/driving/'+lon1+','+lat1+';'+lon2+','+lat2+'?overview=false';
    const res=await fetch(url);
    const data=await res.json();
    if(data.routes && data.routes[0] && data.routes[0].distance){
      const roadKm=data.routes[0].distance/1000;
      return {km:roadKm, isRoad:true, straight:haversine(lat1,lon1,lat2,lon2)};
    }
  }catch(e){ console.log('OSRM failed, using haversine', e); }
  const straight=haversine(lat1,lon1,lat2,lon2);
  return {km:straight, isRoad:false, straight};
}

window.doSearch=(val)=>{ currentSearch=val.trim().toLowerCase(); applyFilters(); };
window.setFilter=(type)=>{
  currentFilter=type;
  document.querySelectorAll('[id^=f-]').forEach(b=>{ b.className='flex-1 bg-white/10 py-2 rounded-xl text-xs'; });
  const active=document.getElementById('f-'+type); if(active) active.className='flex-1 bg-[#FFD600] text-black font-black py-2 rounded-xl text-xs';
  applyFilters();
};
function applyFilters(){
  if(!allRestaurantsCache.length) return;
  let filtered=[...allRestaurantsCache];
  if(currentSearch){
    filtered=filtered.filter(r=>r.shopName.toLowerCase().includes(currentSearch) || r.name.toLowerCase().includes(currentSearch));
  }
  if(currentFilter==='nearest'){
    filtered.sort((a,b)=>a.distReal - b.distReal);
  } else if(currentFilter==='cheapest'){
    filtered.sort((a,b)=> (a.avgPrice||9999) - (b.avgPrice||9999) );
  } else if(currentFilter==='rating'){
    filtered.sort((a,b)=> (b.avgRating||0) - (a.avgRating||0) );
  }
  renderRestaurantList(filtered);
}
function renderRestaurantList(list){
  const el=document.getElementById('restaurantsList'); if(!el) return;
  if(list.length===0){ el.innerHTML='<div class="text-center opacity-30 py-8 text-xs">مفيش مطاعم بالاسم ده<br>جرب اسم تاني أو دوس الأقرب</div>'; return; }

}
async function loadNearbyRestaurantsReal(){
  if(!myLat){ myLat=30.4698; myLng=31.1969; }
  const snap=await new Promise(r=>{onValue(ref(db,'users'),s=>r(s),{onlyOnce:true});});
  const mealsSnap=await new Promise(r=>{onValue(ref(db,'meals'),s=>r(s),{onlyOnce:true});});
  const meals=Object.values(mealsSnap.val()||{});
  const vals=Object.values(snap.val()||{}).filter(u=>u.role==='restaurant' && u.status==='approved' && u.lat);
  let withDist=[];
  for(let r of vals){
    const straight=haversine(myLat,myLng,r.lat,r.lng);
    if(straight<=10){
      const road=await getRealRoadDistance(myLat,myLng,r.lat,r.lng);
      const restMeals=meals.filter(m=>m.restaurantId===r.id);
      const avgPrice=restMeals.length?Math.round(restMeals.reduce((s,m)=>s+m.price,0)/restMeals.length):0;
      withDist.push({...r, dist:straight, distReal:road.km, isRoad:road.isRoad, avgPrice, avgRating:r.avgRating||5});
    }
  }
  withDist.sort((a,b)=>a.distReal-b.distReal);
  allRestaurantsCache=withDist;
  const el=document.getElementById('restaurantsList');
  if(!el) return;
  if(withDist.length===0){ el.innerHTML='<div class="text-center opacity-30 py-8 text-xs">مفيش مطاعم قريبة 0-10 كيلو - عدد المطاعم الكلي: '+vals.length+'</div>'; return; }
  applyFilters();
}

window.addToCart=(mealId, mealName, price, restId, restName)=>{

    if(filtered.length===0){ el.innerHTML='<div class="text-center opacity-30 text-xs py-8">مفيش طلبات قريبة 0-7 كيلو طريق حقيقي</div>'; return; }
    el.innerHTML='<h3 class="font-black text-sm mb-2">طلبات قريبة (مسافة طريق حقيقية): '+filtered.length+'</h3>'+filtered.map(o=>{
      const isRest=o.type==='restaurant';
      return '<div class="glass p-4 rounded-2xl mb-3 border '+(isRest?'border-orange-500/30':'border-white/10')+'"><div class="flex justify-between"><div class="font-bold text-sm">'+(isRest?'🍔 '+o.restaurantName+'<br>📦 ':'📦 ')+o.text.slice(0,40)+'</div><div class="bg-[#FFD600] text-black px-2 py-1 rounded-full text-xs font-black">'+o.dist.toFixed(1)+' كم '+(o.isRoad?'طريق':'')+'</div></div>'+(isRest?'<div class="mt-2 bg-black/40 p-2 rounded-xl text-[11px]"><div>🏪 '+o.restaurantName+' - '+o.restaurantPhone+'</div><div>🍔 '+(o.items||[]).map(i=>i.name+' x'+i.qty).join(', ')+'</div><div>💰 '+o.totalPrice+'ج + توصيل '+o.deliveryPrice+'ج = <b>'+o.finalPrice+'ج</b></div></div>':'')+'<div class="text-xs opacity-60 mt-1">'+o.customerName+' - '+o.price+'ج</div><button onclick="acceptOrder(\''+o._key+'\')" class="w-full mt-3 '+(isRest?'bg-orange-500 text-black':'yellow')+' font-black py-2.5 rounded-xl text-xs">قبول - مسافة طريق حقيقية</button></div>';
    }).join('');
  });
  if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(pos=>{ myLat=pos.coords.latitude; myLng=pos.coords.longitude; }); }
}
window.acceptOrder=async(id)=>{
  const orderRef=ref(db,'orders/'+id);
  await runTransaction(orderRef, curr=>{ if(!curr) return curr; if(curr.status!=='searching') return; return {...curr, status:'accepted', driverId:currentUser.id, driverName:currentUser.name, driverPhone:currentUser.phone, acceptedAt:Date.now()}; });
  const snap=await new Promise(r=>{onValue(ref(db,'orders/'+id),s=>r(s),{onlyOnce:true});}); const o=snap.val(); if(!o || o.driverId!==currentUser.id){ alert('اتاخد'); return; }
  if(Notification.permission==='granted'){ new Notification('✅ قبلت الطلب', {body:o.text.slice(0,50)+' - '+o.price+'ج', icon:'./icon-192.png'}); }
  document.getElementById('app').innerHTML='<div class="glass p-4 rounded-[20px]"><div class="font-black">✅ قبلت - '+o.price+'ج</div><div class="mt-2">👤 '+o.customerName+' - '+o.customerPhone+'</div><div>📦 '+o.text+'</div>'+(o.restaurantName?'<div>🍔 '+o.restaurantName+'</div>':'')+'<button onclick="startDelivery(\''+id+'\')" class="w-full mt-4 yellow font-black py-3 rounded-xl">🚀 ابدأ التوصيل</button></div>';
};
window.startDelivery=async(id)=>{ await update(ref(db,'orders/'+id),{status:'on_the_way'}); alert('بدأت'); document.getElementById('app').innerHTML='<div class="glass p-4 rounded-[20px]"><div class="font-black">🛵 في الطريق</div><button onclick="completeDelivery(\''+id+'\')" class="w-full mt-4 bg-green-500 text-black font-black py-3 rounded-xl">✅ تم التوصيل</button></div>'; };
window.completeDelivery=async(id)=>{ await update(ref(db,'orders/'+id),{status:'delivered'}); alert('تم'); renderDriver(); };

function renderAdmin(){
  document.getElementById('app').innerHTML='<div class="flex justify-between mb-4"><h2 class="font-black">لوحة المالك 👑 v48 شركة</h2><button onclick="renderLanding()" class="bg-white/10 px-3 py-1.5 rounded-full text-xs">خروج</button></div><div class="flex gap-2 mb-4"><button onclick="atab(\'pending\')" class="flex-1 yellow font-black py-2.5 rounded-xl text-xs">دليفري</button><button onclick="atab(\'pendingRest\')" class="flex-1 bg-orange-500 text-black font-black py-2.5 rounded-xl text-xs">مطاعم</button><button onclick="atab(\'orders\')" class="flex-1 bg-white/10 py-2.5 rounded-xl text-xs">طلبات</button></div><div id="ac"></div>';
  window.atab=(t)=>{
    if(t==='pending'){
      onValue(ref(db,'users'),s=>{
        const all=Object.values(s.val()||{}).filter(u=>u.role==='delivery'&&u.status==='pending');
        document.getElementById('ac').innerHTML='<h3 class="font-bold text-sm mb-2">🛵 دليفري: '+all.length+'</h3>'+all.map(u=>'<div class="glass p-4 rounded-2xl mb-2"><div class="font-bold text-sm">🛵 '+u.name+'</div><div class="text-xs opacity-50">📞 '+u.phone+'</div><div class="flex gap-2 mt-3"><button onclick="approve(\''+u.id+'\')" class="flex-1 bg-green-500 text-black font-black py-2 rounded-xl text-xs">✅ قبول</button><button onclick="reject(\''+u.id+'\')" class="flex-1 bg-white/10 py-2 rounded-xl text-xs">❌ رفض</button></div></div>').join('')||'<div class="text-center opacity-30 py-8">لا يوجد</div>';
      });
    }
    if(t==='pendingRest'){
      onValue(ref(db,'users'),s=>{
        const all=Object.values(s.val()||{}).filter(u=>u.role==='restaurant'&&u.status==='pending');
        document.getElementById('ac').innerHTML='<h3 class="font-bold text-sm mb-2">🍔 مطاعم: '+all.length+'</h3>'+all.map(u=>'<div class="glass p-4 rounded-2xl mb-2 border border-orange-500/30"><div class="font-bold text-sm">🍔 '+u.shopName+' - '+u.name+'</div><div class="text-xs opacity-50">📞 '+u.phone+'</div>'+(u.shopPhoto?'<img src="'+u.shopPhoto+'" class="w-full h-24 object-cover rounded-xl mt-2">':'')+'<div class="flex gap-2 mt-3"><button onclick="approve(\''+u.id+'\')" class="flex-1 bg-orange-500 text-black font-black py-2 rounded-xl text-xs">✅ قبول</button><button onclick="reject(\''+u.id+'\')" class="flex-1 bg-white/10 py-2 rounded-xl text-xs">❌ رفض</button></div></div>').join('')||'<div class="text-center opacity-30 py-8">لا يوجد</div>';
      });
    }
    if(t==='orders'){
      onValue(ref(db,'orders'),s=>{
        const all=Object.values(s.val()||{}).sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);
        document.getElementById('ac').innerHTML='<h3 class="font-bold text-sm mb-2">طلبات: '+all.length+'</h3>'+all.map(o=>'<div class="glass p-3 rounded-xl mb-2"><div class="font-bold text-xs">'+o.text.slice(0,40)+'</div><div class="text-[11px] opacity-50">'+o.customerName+' - '+o.price+'ج - '+(o.distance?.toFixed(1)||'')+' كم '+(o.distanceType||'')+' - '+o.status+'</div></div>').join('');
      });
    }
  };
  atab('pending');
}
window.approve=async(id)=>{ await update(ref(db,'users/'+id),{status:'approved'}); alert('✅ تمت الموافقة'); };
window.reject=async(id)=>{ await update(ref(db,'users/'+id),{status:'rejected'}); };
window.logout=()=>{ localStorage.clear(); currentUser=null; selectedLat=null; selectedLng=null; cart={restaurantId:null, restaurantName:null, items:[], total:0}; renderLanding(); };
window.renderLanding=renderLanding; window.render=render; window.renderCustomer=renderCustomer; window.renderRestaurants=renderRestaurants; window.renderRestaurant=renderRestaurant; window.renderDriver=renderDriver; window.renderWaiting=renderWaiting; window.renderRejected=renderRejected;

render();
</script>
