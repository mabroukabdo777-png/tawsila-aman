function haversine(lat1,lon1,lat2,lon2){const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function calcPrice(km){ return Math.min(Math.max(Math.round(10+km*5),10),300); }
function calcCommission(p){ return Math.round(p*0.15); }
async function getRealRoadDistance(lat1,lon1,lat2,lon2){
  try{
    const url='https://router.project-osrm.org/route/v1/driving/'+lon1+','+lat1+';'+lon2+','+lat2+'?overview=false';
    const r=await fetch(url); const d=await r.json();
    if(d.routes&&d.routes[0]) return {km:d.routes[0].distance/1000, isRoad:true};
  }catch(e){}
  return {km:haversine(lat1,lon1,lat2,lon2), isRoad:false};
}
async function getRoute(lat1,lon1,lat2,lon2){
  try{
    const url='https://router.project-osrm.org/route/v1/driving/'+lon1+','+lat1+';'+lon2+','+lat2+'?overview=full&geometries=geojson';
    const r=await fetch(url); const d=await r.json();
    if(d.routes&&d.routes[0]) return {coords:d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]), dist:d.routes[0].distance/1000};
  }catch(e){}
  return null;
}
async function uploadImage(file){
  if(!file) return null;
  try{
    const storageRef = sRef(storage, 'images/'+Date.now()+'_'+file.name);
    const snap = await uploadBytes(storageRef, file);
    const url = await getDownloadURL(snap.ref);
    return url;
  }catch(e){
    return new Promise((res)=>{
      const rd=new FileReader(); rd.onload=(ev)=>{
        const img=new Image(); img.onload=()=>{
          const cv=document.createElement('canvas'); let w=img.width,h=img.height; if(w>700){h=h*(700/w); w=700;} cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.65));
        }; img.src=ev.target.result;
      }; rd.readAsDataURL(file);
    });
  }
}

function startDriverLiveTracking(orderId){
  if(!navigator.geolocation) return;
  if(watchId) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(
    async (pos)=>{
      myLat=pos.coords.latitude; myLng=pos.coords.longitude;
      try{
        await update(ref(db,'users/'+currentUser.id), {lat:myLat, lng:myLng, lastSeen:Date.now()});
        await update(ref(db,'orders/'+orderId), {driverLat:myLat, driverLng:myLng, driverLastUpdate:Date.now()});
      }catch(e){}
      if(driverMap && driverLiveMarker){
        driverLiveMarker.setLatLng([myLat,myLng]);
      }
    },
    (err)=>{ console.log('watch error', err); },
    {enableHighAccuracy:true, timeout:10000, maximumAge:5000}
  );
}
function stopLiveTracking(){
  if(watchId){ navigator.geolocation.clearWatch(watchId); watchId=null; }
}

window.setMyLocationForRestaurant=async()=>{
  const btn=document.getElementById('myLocBtn'); const status=document.getElementById('restLocStatus');
  if(!navigator.geolocation){ alert('المتصفح مش بيدعم'); return; }
  if(btn){ btn.textContent='⏳ جاري تحديد موقعك...'; btn.disabled=true; }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      selectedLat=pos.coords.latitude; selectedLng=pos.coords.longitude;
      if(status){ status.innerHTML='✅ تم حفظ موقعك: '+selectedLat.toFixed(6)+','+selectedLng.toFixed(6); status.className='mt-2 text-[11px] bg-green-500/20 border border-green-500/30 p-3 rounded-xl text-center text-green-400 font-bold'; }
      if(btn){ btn.textContent='✅ تم حفظ موقعي'; btn.className='w-full mt-2 bg-green-500 text-black font-black py-3 rounded-xl text-sm'; btn.disabled=false; }
      try{
        if(window.restMapInstance){
          window.restMapInstance.setView([selectedLat,selectedLng],16);
          if(window.restMarker) window.restMapInstance.removeLayer(window.restMarker);
          window.restMarker=L.marker([selectedLat,selectedLng]).addTo(window.restMapInstance).bindPopup('📍 مطعمك هنا').openPopup();
        }
      }catch(e){}
    },
    (err)=>{ if(btn){ btn.textContent='❌ فشل - دوس تاني'; btn.disabled=false; } alert('فشل: '+err.message); },
    {enableHighAccuracy:true, timeout:10000, maximumAge:0}
  );

window.doLogin=async(role)=>{
  const phone=document.getElementById('lPhone')?.value.trim();
  const pass=document.getElementById('lPass')?.value.trim();
  if(!phone||!pass){ alert('اكمل'); return; }
  try{
    const snap=await new Promise(r=>{onValue(ref(db,'users'),s=>r(s),{onlyOnce:true});});
    const all=Object.values(snap.val()||{});
    let u=all.find(x=>x.phone===phone && x.pass===pass && x.role===role);
    if(!u){ 
      const byPhonePass=all.find(x=>x.phone===phone && x.pass===pass);
      if(byPhonePass){ u=byPhonePass; }
      else { alert('بيانات غلط'); return; }
    }
    if(u.blocked){ alert('🚫 محظور - كلم المالك 261997'); return; }
    save(u); currentUser=u; await initFCM(); render();
  }catch(e){ alert('خطأ: '+e.message); }
};

async function updatePriceReal(){

function initCustomerTrackingMap(orderKey, order){

          driverMarker=L.marker([o.driverLat,o.driverLng],{icon:L.divIcon({html:'<div style="background:#FFD600;color:black;padding:8px 12px;border-radius:20px;font-weight:900">🛵 '+o.driverName+'</div>', className:''})}).addTo(map).bindPopup('🛵 '+o.driverName).openPopup();

window.submitRating=async(orderId)=>{
  const driverRate=window._ratings.driver; const restRate=window._ratings.rest;
  if(!driverRate){ alert('قيّم الدليفري على الأقل'); return; }
  const comment=document.getElementById('ratingComment')?.value.trim()||'';
  const snap=await new Promise(r=>{onValue(ref(db,'orders/'+orderId),s=>r(s),{onlyOnce:true});});
  const order=snap.val(); if(!order) return;
  await update(ref(db,'orders/'+orderId),{rated:true, rating:driverRate, restRating:restRate||5, ratingComment:comment, ratedAt:Date.now()});
  if(order.driverId){
    const dSnap=await new Promise(r=>{onValue(ref(db,'users/'+order.driverId),s=>r(s),{onlyOnce:true});});
    const driver=dSnap.val(); if(driver){
      const newCount=(driver.ratingCount||0)+1;
      const newAvg=((driver.avgRating||5)* (driver.ratingCount||0) + driverRate)/newCount;
      await update(ref(db,'users/'+order.driverId),{avgRating:newAvg, ratingCount:newCount});
    }
  }
  if(order.restaurantId && restRate){
    const rSnap=await new Promise(r=>{onValue(ref(db,'users/'+order.restaurantId),s=>r(s),{onlyOnce:true});});
    const rest=rSnap.val(); if(rest){
      const newCount=(rest.ratingCount||0)+1;
      const newAvg=((rest.avgRating||5)* (rest.ratingCount||0) + restRate)/newCount;
      await update(ref(db,'users/'+order.restaurantId),{avgRating:newAvg, ratingCount:newCount});
    }
  }
  const ratingRef=push(ref(db,'ratings'));
  await set(ratingRef,{orderId, customerId:currentUser.id, driverId:order.driverId, restaurantId:order.restaurantId||null, driverRate, restRate:restRate||5, comment, createdAt:Date.now()});
  closeRating(); alert('✅ شكرا لتقييمك');
};

function applyFilters(){
  if(!allRestaurantsCache.length) return;
  let filtered=[...allRestaurantsCache];
  if(currentSearch){ filtered=filtered.filter(r=>r.shopName.toLowerCase().includes(currentSearch)); }
  if(currentFilter==='nearest') filtered.sort((a,b)=>a.distReal-b.distReal);

async function loadNearbyRestaurantsReal(){
  if(!myLat){ myLat=30.4698; myLng=31.1969; }
  const snap=await new Promise(r=>{onValue(ref(db,'users'),s=>r(s),{onlyOnce:true});});
  const mealsSnap=await new Promise(r=>{onValue(ref(db,'meals'),s=>r(s),{onlyOnce:true});});
  const meals=Object.values(mealsSnap.val()||{});
  const vals=Object.values(snap.val()||{}).filter(u=>u.role==='restaurant' && u.status==='approved' && !u.blocked && u.lat);
  let withDist=[];
  for(let r of vals){
    const straight=haversine(myLat,myLng,r.lat,r.lng);
    if(straight<=10){
      const road=await getRealRoadDistance(myLat,myLng,r.lat,r.lng);
      if(road.km<=10){
        const restMeals=meals.filter(m=>m.restaurantId===r.id);
        const avgPrice=restMeals.length?Math.round(restMeals.reduce((s,m)=>s+m.price,0)/restMeals.length):0;
        withDist.push({...r, dist:straight, distReal:road.km, avgPrice});
      }
    }
  }
  withDist.sort((a,b)=>a.distReal-b.distReal);
  allRestaurantsCache=withDist;
  applyFilters();
}

        document.getElementById('ac').innerHTML='<div class="space-y-2">'+all.slice(0,50).map(([k,o])=>'<div class="glass p-3 rounded-xl mb-2"><div class="font-bold text-xs">📦 '+o.text.slice(0,40)+' - '+o.price+'ج - '+o.status+'</div><div class="text-[11px]">👤 '+o.customerName+' - 🛵 '+(o.driverName||'لا يوجد')+' - 📍 '+(o.driverLat?.toFixed(3)||'')+'</div><div class="text-[10px] opacity-50">⭐ '+(o.rating||'لم يقيم')+' - 💬 '+(o.chat?Object.keys(o.chat).length:0)+' رسائل</div></div>').join('')+'</div>';
      });
    }
    if(t==='ratings'){
      onValue(ref(db,'ratings'),s=>{
        const all=Object.entries(s.val()||{}).sort((a,b)=>b[1].createdAt-a[1].createdAt).slice(0,50);
        document.getElementById('ac').innerHTML='<h3 class="font-black text-sm mb-2">⭐ تقييمات: '+all.length+'</h3>'+all.map(([k,r])=>'<div class="glass p-3 rounded-xl mb-2"><div class="font-bold text-xs">⭐ دليفري: '+r.driverRate+' - 🍔 مطعم: '+r.restRate+'</div><div class="text-[11px] mt-1">'+(r.comment||'بدون تعليق')+'</div></div>').join('')||'<div class="text-center opacity-30">لا يوجد</div>';
      });
    }
  };
  atab('overview');
}
window.approve=async(id)=>{ await update(ref(db,'users/'+id),{status:'approved', blocked:false}); alert('✅ تم'); };
window.deleteUser=async(id)=>{ if(!confirm('تحذف؟')) return; await set(ref(db,'users/'+id), null); alert('🗑️ تم'); };
window.resetDebt=async(id)=>{ if(!confirm('صفر العداد؟')) return; await update(ref(db,'users/'+id),{debt:0, blocked:false, blockReason:null, debtClearedAt:Date.now()}); alert('✅ تم'); };
window.exportExcel=async()=>{
  const snap=await new Promise(r=>{onValue(ref(db,'orders'),s=>r(s),{onlyOnce:true});});
  const usersSnap=await new Promise(r=>{onValue(ref(db,'users'),s=>r(s),{onlyOnce:true});});
  const orders=Object.values(snap.val()||{});
  const users=Object.values(usersSnap.val()||{});
  let csv='نوع,عميل,هاتف,نص,سعر,عمولة,حالة,دليفري,مطعم,تقييم,تاريخ\n';
  orders.forEach(o=>{
    csv+=[o.type||'delivery',o.customerName||'',o.customerPhone||'',(o.text||'').replace(/,/g,' '),o.price||0,o.commission||0,o.status||'',o.driverName||'',o.restaurantName||'',o.rating||'',new Date(o.createdAt).toLocaleDateString('ar-EG')].join(',')+'\n';
  });
  csv+='\n\nالديون\nاسم,هاتف,دين,محظور,تقييم\n';
  users.filter(u=>u.role==='delivery').forEach(u=>{
    csv+=[u.name,u.phone,u.debt||0,u.blocked?'محظور':'شغال',u.avgRating||5].join(',')+'\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='super-flash-v50-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  alert('✅ تم تصدير إكسل');
};
window.logout=()=>{ stopLiveTracking(); localStorage.clear(); currentUser=null; selectedLat=null; selectedLng=null; cart={restaurantId:null, restaurantName:null, items:[], total:0}; renderLanding(); };

render();
